<style>

:root{--blue:#2196F3;--deep:#1565C0;--navy:#10203C;--slate:#6E7D96;--hair:#DEE6F2;--appbg:#EEF2F8;--red:#DC3232;--green:#22A050}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#FBFCFF}
body{font-family:V,sans-serif;color:#10203C}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#FBFCFF 0%,#ECF3FC 100%)}
.a{position:absolute}.rtl{direction:rtl}.ltr{direction:ltr;unicode-bidi:isolate}
.ttl{position:absolute;left:0;width:1080px;text-align:center;direction:rtl;z-index:50;opacity:0}
.ttl .h{font-weight:900;font-size:84px;line-height:1.15;color:#10203C;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:12px;height:76px;padding:0 32px;border-radius:38px;background:#DEF6E6;color:#22A050;font-weight:700;font-size:40px;white-space:nowrap}

/* ---------- phone ---------- */
#phone{position:absolute;left:240px;top:390px;width:600px;height:1290px;border-radius:78px;background:#181C24;border:3px solid #5F6878;transform-origin:50% 0;
 box-shadow:0 50px 90px rgba(20,40,80,.28),0 12px 26px rgba(20,40,80,.18);z-index:10;display:none}
#screen{position:absolute;left:11px;top:11px;width:572px;height:1262px;border-radius:66px;overflow:hidden;clip-path:inset(0 round 66px);isolation:isolate;background:var(--appbg)}
#notch{position:absolute;left:50%;top:14px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#0b0e13;z-index:30}
.scr{position:absolute;left:0;top:0;width:572px;height:1262px;background:var(--appbg);direction:rtl;overflow:hidden;font-family:V;display:none}
.sbar{height:48px;display:flex;justify-content:space-between;align-items:center;padding:6px 40px 0;font-weight:700;font-size:19px;direction:ltr}
.appbar{background:var(--blue);color:#fff}
.abar{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;direction:rtl}
.abar .t{font-weight:800;font-size:29px;display:flex;align-items:center;gap:14px}
.abar .help{font-weight:500;font-size:19px;display:flex;align-items:center;gap:6px}
.tabs{height:62px;display:flex;background:#F7F8FC}
.tabs div{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#98A3B8;position:relative}
.tabs div.on{color:var(--blue)}
.tabs div.on:after{content:"";position:absolute;bottom:0;width:90px;height:4px;border-radius:3px;background:var(--blue)}
.card{background:#fff;border:2px solid var(--hair);border-radius:24px;margin:14px 18px;padding:18px 20px;box-shadow:0 6px 16px rgba(20,40,80,.05)}
.btn{height:62px;border-radius:31px;background:var(--blue);color:#fff;font-weight:700;font-size:23px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.o{background:#fff;border:2px solid var(--hair);color:var(--slate)}
.nav{position:absolute;left:0;bottom:0;width:572px;height:96px;background:var(--blue);display:flex;padding-bottom:6px;z-index:5}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:500;font-size:17px;gap:4px}
.nav .pillon{width:84px;height:38px;border-radius:19px;background:rgba(255,255,255,.26);display:flex;align-items:center;justify-content:center}
.tapdot{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:5px solid rgba(33,150,243,.9);background:rgba(33,150,243,.15);opacity:0;z-index:40}
.tile{background:#fff;border:2px solid var(--hair);border-radius:24px;height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:20px;white-space:nowrap}
.tile .ib{width:62px;height:62px;border-radius:18px;background:#E3EFFC;display:flex;align-items:center;justify-content:center}
.row{height:112px;display:flex;align-items:center;gap:14px;padding:0 18px;direction:rtl}
.row .nm{font-weight:800;font-size:23px;color:#C62828;direction:ltr;text-align:right}
.row .mac{font-weight:500;font-size:16px;color:#6E7D96;direction:ltr;text-align:right;margin-top:2px}
.row .tg{font-weight:800;font-size:15px;color:#fff;border-radius:8px;padding:3px 10px;text-align:center}
/* ---------- floating cards ---------- */
.fc{position:absolute;left:110px;top:1430px;width:860px;background:#fff;border:3px solid var(--hair);border-radius:40px;
 box-shadow:0 30px 60px rgba(20,40,80,.20),0 8px 18px rgba(20,40,80,.10);direction:rtl;padding:30px 40px;opacity:0;z-index:20;transform-origin:50% 100%;display:none}
.fc .ct{font-weight:800;font-size:50px;color:var(--navy);line-height:1.2}
.fc .sub{font-weight:500;font-size:38px;color:var(--slate);line-height:1.35}
.big{font-weight:900;font-size:70px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:10px;height:66px;padding:0 26px;border-radius:33px;font-weight:700;font-size:40px;white-space:nowrap}

<style>
/* full report document */
#doc{position:absolute;left:60px;top:290px;width:960px;height:1580px;border-radius:40px;background:#fff;border:3px solid #DEE6F2;box-shadow:0 40px 80px rgba(20,40,80,.22);overflow:hidden;transform-origin:0 0;display:none;z-index:24;direction:rtl}
#doc_in{position:relative;padding:30px 34px}
.dh{display:flex;align-items:center;gap:26px;border-radius:30px;background:linear-gradient(135deg,#1E88E5,#2196F3);color:#fff;padding:34px 36px}
.ds{display:flex;align-items:center;gap:16px;margin:34px 0 14px;padding:18px 24px;background:#F4F6FA;border-radius:20px;font-weight:800;font-size:38px;color:#1565C0}
.ds:before{content:"";width:8px;height:38px;border-radius:4px;background:#2196F3}
.dr{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 8px;padding:14px 6px;border-bottom:2px solid #E6EBF2;font-size:31px}
.dr span{color:#6E7D96;font-weight:500;white-space:nowrap}.dr b{font-weight:800;text-align:left}
.db{display:flex;align-items:center;gap:20px;margin:16px 8px;font-size:31px;font-weight:700}
.db .l{width:220px;white-space:nowrap}.db .v{width:90px;text-align:left;font-weight:900}
.db .tr,.tr2{flex:1;height:36px;border-radius:18px;background:#E6EBF2;overflow:hidden;direction:ltr}
.tr2{height:30px}
.fi{height:100%;width:0;border-radius:18px}
.dn{margin:14px 8px 0;font-size:28px;color:#6E7D96}
.dc{margin:18px 0;border:3px solid #E6EBF2;border-radius:24px;overflow:hidden;background:#fff}
.dc .h{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 24px;font-weight:800;font-size:33px}
.dc .b{padding:16px 24px 22px;font-size:29px;line-height:1.7;color:#33415C}
.dp{font-weight:800;font-size:24px;padding:5px 18px;border-radius:14px;white-space:nowrap}
.dt{margin:0 4px;border-radius:18px;overflow:hidden;border:2px solid #E6EBF2}
.dt .th,.tr3{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;padding:14px 20px;font-size:28px;text-align:center}
.dt .th{background:#2196F3;color:#fff;font-weight:800}
.tr3{border-top:2px solid #EEF2F8;font-weight:700}
.tr3 span:first-child,.dt .th span:first-child{text-align:right}
.ck2{display:flex;justify-content:space-between;align-items:center;margin:0 4px;padding:12px 22px;border-right:8px solid;border-bottom:2px solid #EEF2F8;font-size:29px;font-weight:700}
.td{display:flex;align-items:center;gap:20px;margin:14px 4px;padding:20px 22px;border-radius:20px;background:#F4F6FA;border-right:8px solid;font-size:30px;font-weight:700}

function tapAt(f,a,id){const t=f-a; const el=$('tap'); if(t<-4||t>14) return false;

 const r=$(id).getBoundingClientRect(), pg=$(id).closest('.scr').getBoundingClientRect(), sc=$('screen').getBoundingClientRect(), k=sc.width/572;
 el.style.left=(11+(r.left+r.width/2-pg.left)/k)+'px'; el.style.top=(11+(r.top+r.height/2-pg.top)/k)+'px';
 el.style.opacity=t<0?seg(t,-4,0):1-seg(t,4,14); el.style.transform=`scale(${t<0?1.2-0.2*seg(t,-4,0):1+0.6*seg(t,0,14)})`; return true;}
const press=(id,f,a)=>{$(id).style.transform=`scale(${1-0.05*Math.exp(-Math.pow((f-a-1)/3,2))})`};
// forward navigation: old page moves right, new page comes from the left (RTL); back is the reverse
function slide(f,a,from,to,dir){const p=E.io(seg(f,a,a+12)); const o={}; o[from]=dir*p*572; o[to]=dir*(p-1)*572; return p>=1?{[to]:0}:o}

 const z=lerp(1.15,1,E.oc(seg(f,140,156))); d.style.transform=`scale(${z})`;
 const PLUG=168;
 const m=E.io(seg(f,148,PLUG)); const push=f>=PLUG? -Math.sin(seg(f,PLUG,PLUG+6)*Math.PI)*8 : 0;
 const dx=lerp(1250,395,m)+push, dy=lerp(1000,964,m);
 const w=$('diagWrap'); w.style.left=(dx-280)+'px'; w.style.top=(dy-209)+'px';
 w.style.transform=`rotate(${lerp(-10,0,m)}deg) scale(${lerp(1.08,1,m)})`;

 let r='';if(f>=PLUG+4){for(let i=0;i<3;i++){const ph=((f-PLUG-4)/16+i/3)%1;const R=lerp(180,420,ph);

}

 }

 /* step 1: ECU scan finds P0420 */
 if(f>=T_ECU&&f<T_EB+14){T(T_ESCAN,'e_scan'); const p=E.io(seg(f,T_ESCAN+2,T_ESCAN+14)); $('e_prog').style.width=(p*100)+'%'; $('e_prog').style.opacity=p<1?1:0;
  const k=seg(f,T_ESCAN+14,T_ESCAN+24), n1=$('e_n1'); n1.textContent=k>0?'۱':'۰'; n1.style.color=k>0?RED:'#98A3B8';
  $('e_dtc').style.opacity=E.oc(k); $('e_dtc').style.transform=`translateY(${(1-E.oc(k))*24}px)`;}
 /* step 2: 20-minute trip time-lapse; the two O2 sensors swing together (worn catalyst) */
 if(f>=T_TRIP&&f<T_TB+14){$('t_time').textContent=mmss(1200*Math.pow(seg(f,T_TRIP+10,T_TB-20),1.15)); $('t_time').style.color=f>=T_TB-20?'#22A050':'#2196F3';
  TPID.forEach((q,i)=>{const el=$('tp'+i); el.textContent=q[2](f); el.style.color=(i==3&&f>T_TRIP+40)||i==8?AMB:'#10203C';});
  $('tc8').style.borderColor=f>T_TRIP+30?'#F9C88A':'';}
 /* step 3: AI troubleshooter -> "I want to go to technical inspection" */
 if(f>=T_AI&&f<T_INSP+16){
  const o=$('a_insp'), on=f>=T_OPT; o.style.background=on?'#CFE3FA':'#ECE6F0'; o.style.color=on?'#1E88E5':'#33415C';
  const glow=f>=T_AI+20&&f<T_OPT?0.5+0.5*Math.sin((f-T_AI)/4):0; o.style.boxShadow=`0 0 0 ${3+6*glow}px rgba(33,150,243,${0.25+0.35*glow})`;
  T(T_OPT,'a_insp'); $('a_desc').style.opacity=E.oc(seg(f,T_OPT+2,T_OPT+10));
  // the AI uses steps 1 and 2: both cards light up
  [['a_err',T_OPT+8,'220,50,50'],['a_trip',T_OPT+14,'242,128,18']].forEach(([id,a,c])=>{const h=Math.exp(-Math.pow((f-a-6)/6,2)); $(id).style.boxShadow=`0 0 0 ${8*h}px rgba(${c},${0.35*h})`;});
  T(T_INSP,'a_insp');
 }
 /* chat: question, typing, first lines of the answer */
 if(f>=T_INSP){
  const u=seg(f,T_INSP+12,T_INSP+20); $('c_u').style.opacity=E.oc(u); $('c_u').style.transform=`translateY(${(1-E.oc(u))*24}px)`;
  $('c_b').style.opacity=E.oc(seg(f,T_INSP+22,T_INSP+28));
  const typing=f<T_REP-12; $('c_dots').style.display=typing?'block':'none'; $('c_head').style.display=typing?'none':'block';
  [...$('c_dots').children].forEach((d,i)=>d.style.transform=`translateY(${-8*Math.max(0,Math.sin(f/3-i*0.9))}px)`);
 }
 if(!tapped) $('tap').style.opacity=0;
}

function mont(f){
 const show=(id,a,b)=>{const el=$(id); if(f<a-1||f>b+1){el.style.display='none';return 0}
  el.style.display='block'; const pin=seg(f,a,a+14), pout=seg(f,b-9,b);
  el.style.opacity=E.oc(seg(f,a,a+6))*(1-E.ic(pout)); el.style.transform=`translateY(${(1-E.oc(pin))*60-E.ic(pout)*40}px) scale(${lerp(0.86,1,E.back(pin))})`; return 1};
 if(show('mA',T_ECU+8,T_EB+4)){const p=E.io(seg(f,T_ESCAN+2,T_ESCAN+14)); $('mAp').style.width=(p*100)+'%'; $('mAp').style.background=p<1?'#2196F3':RED;
  $('mAs').innerHTML=p<1?'در حال اسکن ECU...':'کارایی کاتالیزور پایین‌تر از حد مجاز';
  $('mAc').innerHTML=p<1?'':`<span class="pill ltr" style="background:#FFECEC;color:${RED};font-weight:900">P0420</span>`;}
 if(show('mB',T_TRIP+6,T_TB+4)){const s=1200*Math.pow(seg(f,T_TRIP+10,T_TB-20),1.15); $('mBt').textContent=mmss(s); street(f);}
}
/* step 2 card: the 206 bouncing down the street, puffing smoke */
function street(f){
 const sk=[...Array(6)].map((_,i)=>{const x=((i*170+f*5)%1020+1020)%1020-120, h=[120,170,90,150,110,140][i];
  return `<rect x="${x}" y="${330-h}" width="120" height="${h}" rx="10" fill="#E3EFFC"/>${[...Array(Math.floor(h/40))].map((_,j)=>`<rect x="${x+22}" y="${330-h+18+j*40}" width="22" height="16" rx="3" fill="#fff"/><rect x="${x+72}" y="${330-h+18+j*40}" width="22" height="16" rx="3" fill="#fff"/>`).join('')}`;}).join('');
 const dash=[...Array(7)].map((_,i)=>`<rect x="${((i*150+f*14)%1050+1050)%1050-120}" y="402" width="80" height="10" rx="5" fill="#fff"/>`).join('');
 const bump=Math.abs(Math.sin(f*0.55))*7+(f%40<6?(6-f%40)*2:0), tilt=Math.sin(f*0.55)*1.4;
 const sp=-f*24;
 const car=CAR206.replace(/<g class="sp">/g,`<g class="sp" transform="rotate(${sp})">`);
 $('street').innerHTML=`<rect width="854" height="468" fill="#F8FBFF"/>${sk}<rect x="0" y="330" width="854" height="138" fill="#E4ECF6"/>${dash}
  <g>${smoke(f,640,392,1,1.6).replace(/#98A3B8/g,'#8A96AA')}</g>
  <g transform="translate(420 ${318-bump}) scale(.95) rotate(${tilt})">${car}</g>`;
}
function doc(f){
 const d=$('doc'); const on=f>=T_REP&&f<T_FIX+6; if(!on){d.style.display='none';return} d.style.display='block';
 const r0=$('c_card').getBoundingClientRect(); if(r0.width>0) SC0=r0; const sc=SC0; const g=E.io(seg(f,T_REP,T_REP+18)), out=E.ic(seg(f,T_FIX-12,T_FIX+4));
 const X=60,Y=290,W=960; const x=lerp(sc.left,X,g), y=lerp(sc.top,Y,g), s=lerp(sc.width/W,1,g);
 d.style.transform=`translate(${x-X}px,${y-Y}px) scale(${s*(1-0.1*out)})`; d.style.opacity=cl(g*3)*(1-out);
 $('doc_in').style.transform=`translateY(${-docScroll(f)}px)`;
 DTRIG.forEach(o=>{const p=seg(f,o.t,o.t+16), el=o.el;
  if(el.classList.contains('fi')) el.style.width=(E.oc(p)*(+el.dataset.w))+'%';
  else {el.style.opacity=lerp(0.15,1,E.oc(p)); el.style.transform=`translateX(${(1-E.oc(p))*-30}px)`;}});
}
function docLayout(){
 const dv=$('doc'); dv.style.display='block'; dv.style.visibility='hidden';
 const max=$('doc_in').scrollHeight-DOC_VH;
 DST=DSTOP.map(id=>{let top=0,e=$(id); while(e&&e.id!=='doc_in'){top+=e.offsetTop;e=e.offsetParent} return Math.min(max,Math.max(0,top-24))});
 DTRIG=[...document.querySelectorAll('#doc_in .fi,#doc_in .td')].map(el=>{
  let top=0,e=el; while(e&&e.id!=='doc_in'){top+=e.offsetTop;e=e.offsetParent} const i=DST.findIndex(s=>top<s+DOC_VH-120);
  return {el,t:T_DOC(Math.max(0,i))+(i<=0?8:0)+(el.classList.contains('td')?[...el.parentNode.querySelectorAll('.td')].indexOf(el)*6:0)};});
 dv.style.display='none'; dv.style.visibility='';
}
function docScroll(f){let y=DST[0];DST.forEach((s,i)=>{if(i){const a=T_DOC(i)-14; y=lerp(y,s,E.io(seg(f,a,a+14)))}});return y}
const DOC_VH=1580; let DST=[], DTRIG=[], SC0={left:300,top:700,width:480};
/* after the repair: check again, the needle swings from 20% to 85% */
function gauge(f){
 const g=$('gauge'); const on=f>=T_FIX-8&&f<T_GATE+2; if(!on){g.style.display='none';return} g.style.display='block';
 g.style.opacity=E.oc(seg(f,T_FIX-8,T_FIX+4)); g.style.clipPath=f>=T_GATE-16?`polygon(0 0,${lerp(140,-40,E.io(seg(f,T_GATE-16,T_GATE)))-40}% 0,${lerp(140,-40,E.io(seg(f,T_GATE-16,T_GATE)))-80}% 100%,0 100%)`:'none';
 const sw=E.io(seg(f,T_FIX+18,T_FIX+40)), v=lerp(20,85,sw)+(sw>=1?Math.sin((f-T_FIX)/5)*0.6:0);
 $('gN').setAttribute('transform',`rotate(${-90+v*1.8} 540 860)`);
 const gv=$('gV'); gv.textContent=fa(Math.round(v))+'٪'; gv.style.color=v<50?AMB:(v<75?'#D7C832':GRN);
 const fx=E.back(seg(f,T_FIX+2,T_FIX+14)); $('gF').style.opacity=E.oc(seg(f,T_FIX+2,T_FIX+8)); $('gF').style.transform=`scale(${lerp(0.7,1,fx)})`;
 const ok=E.oc(seg(f,T_FIX+40,T_FIX+50)); $('gOk').style.opacity=ok; $('gOk').style.transform=`translateY(${(1-ok)*20}px)`;
}
/* break: what it does, one row per beat */
function outro(f){
 const ex=$('ex'), E0=T_RECAP, E1=T_END;
 if(f>=E0-6&&f<E1+2){const pin=seg(f,E0-6,E0+8), pout=seg(f,E1-9,E1-1);
  ex.style.display='block'; ex.style.opacity=E.oc(seg(f,E0-6,E0))*(1-E.ic(pout));
  ex.style.transform=`translateY(${(1-E.oc(pin))*70+E.ic(pout)*30}px) scale(${lerp(0.88,1,E.back(pin))})`;
  for(let i=0;i<3;i++){const b=E0+i*BEAT, p=seg(f,b-2,b+10), r=$('exr'+i);
   r.style.opacity=E.oc(seg(f,b-2,b+4)); r.style.transform=`translateX(${(1-E.oc(p))*-50}px)`;
   const nn=r.firstChild, hit=Math.exp(-Math.pow((f-b-1)/4,2)); nn.style.transform=`scale(${(p<=0?0.4:lerp(0.4,1,E.back(p)))*(1+0.12*hit)})`;}
 } else ex.style.display='none';
}
/* the 1-2-3 step strip above the phone */
function steps(f){
 const s=$('steps'); const o=E.oc(seg(f,T_ECU-6,T_ECU+4))*(1-seg(f,T_REP,T_REP+8)); s.style.display=o>0?'block':'none'; if(o<=0) return; s.style.opacity=o;
 const cur=f<T_TRIP?0:(f<T_AI?1:2);
 [0,1,2].forEach(i=>{const el=$('st'+i); el.className='stp'+(i<cur?' dn':(i==cur?' on':'')); el.querySelector('.n').innerHTML=i<cur?svg('check','#fff',24):fa(i+1);
  const a=[T_ECU,T_TRIP,T_AI][i], h=Math.exp(-Math.pow((f-a-3)/4,2)); el.style.transform=`scale(${1+0.12*h})`;});
 [1,2].forEach(i=>{$('sl'+i).style.background=cur>=i?'#22A050':'#DEE6F2';});
}

function render(f){
 scene(f); dash(f); phone(f); mont(f); doc(f); gauge(f); outro(f); steps(f);
 TT.forEach((t,i)=>{const el=$('tt'+i);const pin=E.oc(seg(f,t.a,t.a+9)),pout=E.ic(seg(f,t.b-6,t.b));const o=pin*(1-pout);
  vis(el,o); el.style.transform=`translateY(${(1-pin)*28-pout*14}px)`;});
 renderEnd(f);
}

</script>

initEnd(null,{health:HEALTH,healthColor:LG,t0:T_END});
