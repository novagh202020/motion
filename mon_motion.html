  else if(reading){st.textContent=`✓ ۱۴ سنسور یافت شد — ${fa(picks.length)} سنسور در حال خواندن`; st.style.color='#22A050';}
  else if(found){st.textContent='✓ ۱۴ سنسور یافت شد'; st.style.color='#22A050';}
  else {st.textContent='برای شروع، اسکن را بزنید'; st.style.color='#6E7D96';}
  const sp=f<T_RESCAN?seg(f,T_SCAN+2,T_FOUND):seg(f,T_RESCAN+2,T_LIST2-6); $('m_prog').style.width=(E.io(sp)*100)+'%'; $('m_prog').parentNode.style.opacity=scanning?1:0;
  const t0=r1?T_START1+2:T_START2+2, n=reading?Math.floor((f-t0)/UPD):0;
  $('m_cy').textContent=reading?'چرخه: '+fa(n+1):''; $('m_rt').textContent=reading?'نرخ به‌روزرسانی: ۱٫۴ بار در ثانیه (۷۰۹ میلی‌ثانیه)':'';
  // live cards: the chosen sensors, refreshed every 709 ms (a short blue flash on each refresh)
  const live=(f>=T_START1&&f<T_RESCAN)||f>=T_START2;
  SN.forEach((s,i)=>{const g=$('g'+i), k=picks.indexOf(i); if(!live||k<0){g.style.display='none';return}
   g.style.display='block'; const a=t0+k*2.2, p=seg(f,a,a+10); g.style.opacity=E.oc(seg(f,a,a+5))*(f>=T_STOP&&r1?1-seg(f,T_STOP+2,T_RESCAN-2)*0.6:1);
   g.style.transform=`translateY(${(1-E.oc(p))*20}px) scale(${lerp(0.85,1,E.back(p))})`;
   const v=$('gv'+i); v.textContent=fdec(sval(i,reading?n:0),s[5]);
   const fl=reading?Math.exp(-((f-t0)-n*UPD)/3):0; v.style.color=fl>0.35?'#2196F3':'#10203C'; g.style.borderColor=fl>0.5?'#ADD6FA':'';});
  const gs=r1?E.io(seg(f,T_START1+40,T_STOP-14))*370:0; $('m_grid').style.transform=`translateY(${-gs}px)`;
  // sensor list (sheet over the page)
  const list=(f>=T_LIST1&&f<T_OK1+10)||(f>=T_LIST2&&f<T_OK2+10), la=f<T_OK1+10?T_LIST1:T_LIST2, lb=f<T_OK1+10?T_OK1:T_OK2;
  const lw=$('l_wrap'); const lo=list?E.oc(seg(f,la,la+8))*(1-E.ic(seg(f,lb+2,lb+10))):0; lw.style.opacity=lo; lw.style.display=lo>0?'block':'none';
  lw.style.transform=`translateY(${(1-E.oc(seg(f,la,la+10)))*80}px)`;
  if(lo>0){const r2=f>=T_LIST2, ticks=r2?PICK2.map((p,k)=>[p,T_TICK2[k]]):PICK1.map((p,k)=>[p,T_TICK1(k)]);
   let cnt=0; SN.forEach((s,i)=>{const tk=ticks.find(q=>q[0]===i), on=tk&&f>=tk[1]; if(on)cnt++; const c=$('lk'+i);
    c.style.background=on?'#2196F3':'transparent'; c.style.borderColor=on?'#2196F3':'#10203C'; c.innerHTML=on?svg('check','#fff',26):'';
    const pop=tk?Math.exp(-Math.pow((f-tk[1]-2)/3,2)):0; c.style.transform=`scale(${1+0.25*pop})`;
    $('l'+i).style.borderColor=pop>0.3?'#2196F3':''; if(tk) T(tk[1],'lk'+i);});
   $('l_okT').textContent=`تایید انتخاب (${fa(cnt)} سنسور)`; T(lb,'l_ok');
   const ROW=94, sc=r2?E.io(seg(f,T_TICK2[0]+6,T_TICK2[1]-3))*ROW*7:E.io(seg(f,T_TICK1(5),T_TICK1(12)+2))*ROW*7;
   $('l_list').style.transform=`translateY(${-sc}px)`;}
 }
 if(!tapped) $('tap').style.opacity=0;
}

function floats(f){
 const show=(id,a,b)=>{const el=$(id); if(f<a-1||f>b+1){el.style.display='none';return 0}
  el.style.display='block'; const pin=seg(f,a,a+14), pout=seg(f,b-9,b);
  el.style.opacity=E.oc(seg(f,a,a+6))*(1-E.ic(pout)); el.style.transform=`translateY(${(1-E.oc(pin))*60+E.ic(pout)*30}px) scale(${lerp(0.86,1,E.back(pin))})`; return 1};
 if(show('f3',T_START2+14,T_EX-4)){const n=Math.floor((f-T_START2-2)/UPD); PICK2.forEach((i,k)=>{$('f3v'+k).textContent=fdec(sval(i,n),SN[i][5]);});
  $('f3d').style.opacity=0.35+0.65*(0.5+0.5*Math.sin(f/3));}
 const ex=$('ex'), E0=T_EX, E1=T_END;
 if(f>=E0-6&&f<E1+2){const pin=seg(f,E0-6,E0+8), pout=seg(f,E1-9,E1-1);
  ex.style.display='block'; ex.style.opacity=E.oc(seg(f,E0-6,E0))*(1-E.ic(pout));
  ex.style.transform=`translateY(${(1-E.oc(pin))*70+E.ic(pout)*30}px) scale(${lerp(0.88,1,E.back(pin))})`;
  for(let i=0;i<3;i++){const b=E0+i*BEAT, p=seg(f,b-2,b+10), r=$('exr'+i);
   r.style.opacity=E.oc(seg(f,b-2,b+4)); r.style.transform=`translateX(${(1-E.oc(p))*-50}px)`;
   const nn=r.firstChild, hit=Math.exp(-Math.pow((f-b-1)/4,2));
   nn.style.transform=`scale(${(p<=0?0.4:lerp(0.4,1,E.back(p)))*(1+0.12*hit)})`;}
 } else ex.style.display='none';
}

function render(f){
 hook(f); dash(f); phone(f); floats(f);
 TT.forEach((t,i)=>{const el=$('tt'+i);const pin=E.oc(seg(f,t.a,t.a+9)),pout=E.ic(seg(f,t.b-6,t.b));const o=pin*(1-pout);
  vis(el,o); el.style.transform=`translateY(${(1-pin)*28-pout*14}px)`;});
 renderEnd(f);
}
