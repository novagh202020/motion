<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>CarDiag Service Cover</title>
<style>
@font-face{font-family:V;font-weight:900;src:url(fonts/Vazirmatn-FD-Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:V,sans-serif;color:#10203C;background:#FBFCFF}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,#FBFCFF 0%,#ECF3FC 100%)}
.a{position:absolute}
/* everything inside the 3:4 grid crop (y 240..1680) and the 4:5 feed crop (y 285..1635) */
#title{left:0;top:300px;width:1080px;text-align:center;font-weight:900;font-size:90px;line-height:1.3;direction:rtl;white-space:nowrap}
#title b{font-weight:900;color:#10203C;padding:0 12px;background:linear-gradient(180deg,transparent 58%,rgba(33,150,243,.32) 58%,rgba(33,150,243,.32) 90%,transparent 90%)}
</style></head><body>
<div id="c">
 <div class="a" style="left:140px;top:640px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(40,160,255,.22) 0%,rgba(40,160,255,0) 68%)"></div>
 <div id="title" class="a">با این روش<br><span style="font-size:150px;line-height:1.15;color:#DC3232">تسمه تایمت</span><br>پاره نمی‌شه!</div>
 <svg id="eng" class="a" style="left:110px;top:700px" width="860" height="860" viewBox="0 0 860 860"></svg>
</div>
<script>
function gearPath(r,teeth,a0,a1){if(!teeth){let d='';for(let a=a0;a<=a1+1e-6;a+=Math.PI/36) d+=(d?'L':'M')+(r*Math.cos(a)).toFixed(1)+' '+(r*Math.sin(a)).toFixed(1); return d+(a1-a0<6.28?'L0 0Z':'Z')}
 const st=2*Math.PI/teeth; let d=''; for(let a=a0;a<=a1+1e-6;a+=st/6){const ph=(((a-a0)/st)%1+1)%1, rr=ph<0.5?r:r-12; d+=(d?'L':'M')+(rr*Math.cos(a)).toFixed(1)+' '+(rr*Math.sin(a)).toFixed(1)}
 return d+(a1-a0<6.28?'L0 0Z':'Z')}
function beltPath(P){const n=P.length, T=[];
 for(let i=0;i<n;i++){const [x1,y1,r1]=P[i],[x2,y2,r2]=P[(i+1)%n], dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, c=(r1-r2)/L, s=Math.sqrt(1-c*c);
  const nx=c*ux+s*uy, ny=c*uy-s*ux; T.push([[x1+r1*nx,y1+r1*ny],[x2+r2*nx,y2+r2*ny]]);}
 let d=`M${T[n-1][1][0].toFixed(1)} ${T[n-1][1][1].toFixed(1)}`;
 for(let i=0;i<n;i++){const [cx,cy,r]=P[i], A=T[(i+n-1)%n][1], B=T[i][0];
  const a0=Math.atan2(A[1]-cy,A[0]-cx), a1=Math.atan2(B[1]-cy,B[0]-cx), dl=((a1-a0)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  d+=` A${r} ${r} 0 ${dl>Math.PI?1:0} 1 ${B[0].toFixed(1)} ${B[1].toFixed(1)} L${T[i][1][0].toFixed(1)} ${T[i][1][1].toFixed(1)}`;} return d}

const P=[[140,320,70,20],[310,320,70,20],[350,480,26,0],[205,650,80,18]];
const BELT=beltPath(P);
const spr=(x,y,r,t,a,acc)=>`<g transform="translate(${x} ${y})"><path d="${gearPath(r,t,0,2*Math.PI)}" transform="rotate(${a})" fill="#fff" stroke="#1565C0" stroke-width="5"/><circle r="${r*0.7}" fill="#E3EFFC"/>
 ${[0,1,2,3,4].map(i=>`<circle cx="${(r*0.42*Math.cos(i*1.2566+a/57)).toFixed(1)}" cy="${(r*0.42*Math.sin(i*1.2566+a/57)).toFixed(1)}" r="${r*0.11}" fill="#90CAF9"/>`).join('')}<circle r="${r*0.2}" fill="${acc?'#2196F3':'#1565C0'}"/></g>`;
let s=`<defs><linearGradient id="blk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D3E0"/><stop offset="1" stop-color="#98A3B8"/></linearGradient>
 <linearGradient id="vc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#42A5F5"/><stop offset="1" stop-color="#1565C0"/></linearGradient>
 <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8F9BAD"/><stop offset=".5" stop-color="#C9D3E0"/><stop offset="1" stop-color="#7D8899"/></linearGradient></defs>
 <ellipse cx="450" cy="815" rx="380" ry="34" fill="#142850" opacity=".16"/>`;
// exhaust manifold (right)
s+=`<path d="M720 330 C820 340 830 420 790 470 M720 380 C800 400 806 470 780 520 M790 470 L790 760" fill="none" stroke="url(#pipe)" stroke-width="34" stroke-linecap="round"/>`;
// oil pan + block + head
s+=`<path d="M300 650 L720 650 L700 770 Q696 790 676 790 L344 790 Q324 790 320 770 Z" fill="#6E7D96" stroke="#33415C" stroke-width="5"/>
 <rect x="250" y="380" width="510" height="290" rx="30" fill="url(#blk)" stroke="#33415C" stroke-width="5"/>
 ${[0,1,2,3].map(i=>`<rect x="${300+i*112}" y="420" width="80" height="200" rx="18" fill="#B4C0D0" stroke="#7D8899" stroke-width="3"/>`).join('')}
 <rect x="235" y="270" width="540" height="120" rx="22" fill="#D3DAE4" stroke="#33415C" stroke-width="5"/>
 ${[0,1,2,3,4,5].map(i=>`<circle cx="${270+i*94}" cy="370" r="9" fill="#7D8899"/>`).join('')}`;
// intake: plenum + 4 runners
s+=`${[0,1,2,3].map(i=>`<path d="M${360+i*100} 150 C${360+i*100} 210 ${350+i*100} 230 ${350+i*100} 200" fill="none"/>`).join('')}
 ${[0,1,2,3].map(i=>`<rect x="${330+i*100}" y="120" width="54" height="120" rx="20" fill="url(#pipe)" stroke="#5F6878" stroke-width="4"/>`).join('')}
 <rect x="300" y="70" width="440" height="90" rx="40" fill="#AEB8C6" stroke="#33415C" stroke-width="5"/>
 <rect x="720" y="88" width="90" height="54" rx="20" fill="#8F9BAD" stroke="#33415C" stroke-width="5"/>`;
// valve cover (brand blue) with ribs
s+=`<path d="M250 285 Q250 215 320 205 L700 205 Q770 215 770 285 Z" fill="url(#vc)" stroke="#10203C" stroke-width="5"/>
 ${[0,1,2,3,4,5,6].map(i=>`<rect x="${330+i*54}" y="222" width="22" height="50" rx="11" fill="#78CDFF" opacity=".55"/>`).join('')}
 ${[0,1,2,3].map(i=>`<circle cx="${290+i*146}" cy="268" r="9" fill="#ADD6FA"/>`).join('')}`;
// timing side (left): cover plate cut away, sprockets + belt
s+=`<path d="M60 220 L400 220 L400 780 L70 780 Q30 780 30 740 L30 260 Q30 220 60 220 Z" fill="#F4F9FF" stroke="#1565C0" stroke-width="5"/>
 <path d="M60 220 L400 220 L400 780 L70 780 Q30 780 30 740 L30 260 Q30 220 60 220 Z" fill="none" stroke="#2196F3" stroke-width="3" stroke-dasharray="14 9" transform="translate(10 10) scale(.975)"/>
 ${P.map(([x,y,r,t],i)=>spr(x,y,r,t,i*17,i==3)).join('')}
 <path d="${BELT}" fill="none" stroke="#DC3232" stroke-width="44" opacity=".18" stroke-linejoin="round"/><path d="${BELT}" fill="none" stroke="#8E1B1B" stroke-width="30" stroke-linejoin="round"/><path d="${BELT}" fill="none" stroke="#E53935" stroke-width="22" stroke-linejoin="round"/><path d="${BELT}" fill="none" stroke="#B71C1C" stroke-width="22" stroke-dasharray="7 9"/>`;
document.getElementById('eng').innerHTML=s;
</script></body></html>
