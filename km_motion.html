 <div id="cN" style="margin-top:10px;text-align:center;font-weight:500;font-size:26px;color:#98A3B8;opacity:0">مگه اینکه <span class="ltr">ECU</span> تعویض شده باشه</div></div>`;
$('exs').innerHTML=`<div class="ex" id="ex">${['رایگانه','چیزی وارد نمی‌کنی','قبل از معامله بدون'].map((r,i)=>`<div class="exr" id="exr${i}"><span class="exn">${fa(i+1)}</span><span>${r}</span></div>`).join('')}</div>`;
/* ---------- titles ---------- */
const TT=[
 {h:'کیلومترش <b>واقعیه</b>؟',a:10,b:146},
 {h:'قبل از خرید، <b>چکش</b> کن',a:150,b:T_KM-4},
 {h:'اصالت <b>کیلومتر</b>',s:'رایگان، بدون وارد کردن چیزی',a:T_KM-2,b:T_CMP-4},
 {h:'داشبورد یا <b class="ltr">ECU</b>؟',a:T_CMP-2,b:T_C2-4},
 {h:'این یکی <b>سالمه</b>',a:T_C2-2,b:T_RECAP-2},
 {h:'با خیال <b>راحت</b> بخر',a:T_RECAP+2,b:T_END-4},
 {h:'مکانیک تو <b>جیبِت</b>!',a:T_END-2,b:99999},
];
$('titles').innerHTML=TT.map((t,i)=>`<div class="ttl" id="tt${i}" style="top:${t.s?132:148}px"><div class="h">${t.h}</div>${t.s?`<div class="s">${t.s}</div>`:''}</div>`).join('');

/* ---------- helpers ---------- */
function tapAt(f,a,id){const t=f-a; const el=$('tap'); if(t<-4||t>14) return false;
 // position inside the page (ignores the page's own slide), so the ring stays where the finger was
 const r=$(id).getBoundingClientRect(), pg=$(id).closest('.scr').getBoundingClientRect(), sc=$('screen').getBoundingClientRect(), k=sc.width/572;
 el.style.left=(11+(r.left+r.width/2-pg.left)/k)+'px'; el.style.top=(11+(r.top+r.height/2-pg.top)/k)+'px';
 el.style.opacity=t<0?seg(t,-4,0):1-seg(t,4,14); el.style.transform=`scale(${t<0?1.2-0.2*seg(t,-4,0):1+0.6*seg(t,0,14)})`; return true;}
const press=(id,f,a)=>{$(id).style.transform=`scale(${1-0.05*Math.exp(-Math.pow((f-a-1)/3,2))})`};
// forward navigation: old page moves right, new page comes from the left (RTL); back is the reverse
function slide(f,a,from,to,dir){const p=E.io(seg(f,a,a+12)); const o={}; o[from]=dir*p*572; o[to]=dir*(p-1)*572; return p>=1?{[to]:0}:o}
function dash(f){
 const B0=seg(f,140,150), out=1-seg(f,200,214), d=$('dash');
 if(B0<=0||out<=0){d.style.display='none';return}
 d.style.display='block'; d.style.opacity=B0*out;
 const z=lerp(1.15,1,E.oc(seg(f,140,156))); d.style.transform=`scale(${z})`;
 const PLUG=168;
 const m=E.io(seg(f,148,PLUG)); const push=f>=PLUG? -Math.sin(seg(f,PLUG,PLUG+6)*Math.PI)*8 : 0;
 const dx=lerp(1250,395,m)+push, dy=lerp(1000,964,m);
 const w=$('diagWrap'); w.style.left=(dx-280)+'px'; w.style.top=(dy-209)+'px';
 w.style.transform=`rotate(${lerp(-10,0,m)}deg) scale(${lerp(1.08,1,m)})`;
 $('flash').style.opacity=f>=PLUG?Math.exp(-(f-PLUG)/5)*0.9:0;
 let r='';if(f>=PLUG+4){for(let i=0;i<3;i++){const ph=((f-PLUG-4)/16+i/3)%1;const R=lerp(180,420,ph);
   r+=`<path d="M${dx-R*0.8} ${dy-R*0.6} A${R} ${R} 0 0 1 ${dx+R*0.8} ${dy-R*0.6}" fill="none" stroke="#2196F3" stroke-width="${8-4*ph}" stroke-linecap="round" opacity="${(1-ph)*0.85}"/>`}}
 $('bt').innerHTML=r;
}

/* ---------- hook: seller's claims, then a big question mark ---------- */
const SELL=['فقط ۸۵ هزار کار کرده!','کیلومترش اصله!','دست اول، بی‌دردسر!'];
$('sell').innerHTML=`<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;opacity:0" id="sl_h"><div style="width:70px;height:70px;border-radius:50%;background:#E6EBF2;display:flex;align-items:center;justify-content:center">${svg('person','#6E7D96',46)}</div><span style="font-weight:800;font-size:34px;color:#6E7D96">فروشنده</span></div>`+
 SELL.map((t,i)=>`<div id="sl${i}" style="display:table;margin:0 0 18px ${i%2?'60px':'0'};background:#fff;border:3px solid #DEE6F2;border-radius:40px 40px 40px 12px;box-shadow:0 18px 40px rgba(20,40,80,.14);padding:22px 36px;font-weight:800;font-size:50px;color:#10203C;opacity:0">${t}</div>`).join('');
function hook(f){
 const r=$('road'); const o=E.oc(seg(f,-8,10))*(1-seg(f,142,150));
 if(o<=0){r.style.display='none';return} r.style.display='block'; r.style.opacity=o;
 const z=lerp(1.05,1,E.oc(seg(f,0,24)))*(1+0.9*E.ic(seg(f,132,150))); r.style.transform=`scale(${z})`;
 $('sl_h').style.opacity=E.oc(seg(f,12,20));
 SELL.forEach((t,i)=>{const a=22+i*22, p=seg(f,a,a+12), el=$('sl'+i);
  el.style.opacity=E.oc(seg(f,a,a+6)); el.style.transform=`translateY(${(1-E.oc(p))*30}px) scale(${p<=0?0.8:lerp(0.8,1,E.back(p))})`; el.style.transformOrigin='100% 100%';});
 const q=seg(f,92,106), qm=$('qm'); qm.style.opacity=E.oc(seg(f,92,98)); qm.style.transform=`scale(${q<=0?0.3:lerp(0.3,1,E.back(q))}) rotate(${(1-E.oc(q))*-20}deg)`;
 // the seller's claims get "doubted": they tilt and fade a little when the question mark lands
 const dz=E.oc(seg(f,100,116)); SELL.forEach((t,i)=>{if(f>100) $('sl'+i).style.opacity=1-0.45*dz;});
 $('car').setAttribute('transform',`translate(540 ${1150+Math.sin(f*0.5)*1.2}) scale(1.28)`);
}

function screens(f){
 let x={};
 if(f<T_HOME) x={sc_splash:0};
 else if(f<T_HOME+10) x={sc_splash:0,sc_home:0};
 else if(f<T_CONN+3) x={sc_home:0};
 else if(f<T_BACK) x=slide(f,T_CONN+3,'sc_home','sc_conn',1);
 else if(f<T_KS) x=slide(f,T_BACK,'sc_conn','sc_home',-1);
 else x=slide(f,T_KS,'sc_home','sc_km',1);
 SCR.forEach(s=>{const el=$(s); if(x[s]===undefined){el.style.display='none'}else{el.style.display='block';el.style.transform=`translateX(${x[s]}px)`;el.style.opacity=1}});
 if(f>=T_HOME&&f<T_HOME+10){$('sc_splash').style.zIndex=2;$('sc_splash').style.opacity=1-E.io(seg(f,T_HOME,T_HOME+10));}
}

function phone(f){
 const ph=$('phone'); let py=0,ps=1,po=1,show=true;
 if(f<T_PH) show=false;
 else if(f<T_PH+18){py=lerp(1600,0,E.oc(seg(f,T_PH,T_PH+18)));}
 else if(f>=T_END-10){po=1-seg(f,T_END-10,T_END); if(po<=0) show=false;}
 ph.style.display=show?'block':'none'; ph.style.opacity=po; ph.style.transform=`translateY(${py}px) scale(${ps})`;
 if(!show) return;
 screens(f);
 let tapped=false; const T=(a,id)=>{tapped=tapAt(f,a,id)||tapped; press(id,f,a)};
 /* splash: logo draws in */
 if(f<T_HOME+10){const lg=[...document.querySelectorAll('#sp_logo .lg')];
  lg.forEach((p,i)=>{const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L*(1-E.io(seg(f,T_PH+6+i*3,T_PH+30+i*3)));});
  $('sp_t1').style.opacity=E.oc(seg(f,T_PH+22,T_PH+32)); $('sp_t2').style.opacity=E.oc(seg(f,T_PH+28,T_PH+38));
 }
 /* home */
 if(f>=T_HOME&&f<T_KS+16){
  T(T_CONN,'h_conn');
  const conn=f>=T_OK; $('h_stat').textContent=conn?'متصل':'قطع شده'; $('h_stat').style.color=conn?'#22A050':'#DC3232';
  $('h_conn').style.background=conn?'#E6EBF2':'#2196F3'; $('h_conn').style.color=conn?'#98A3B8':'#fff';
  $('h_conn').querySelector('path').setAttribute('fill',conn?'#98A3B8':'#fff');
  $('h_disc').style.color=conn?'#1565C0':'#98A3B8';
  // connection popup
  const pin=seg(f,T_BACK+6,T_BACK+16), pout=seg(f,T_OK+8,T_OK+14);
  const vis2=f>=T_BACK+6&&f<T_OK+14; const po2=vis2?E.oc(pin)*(1-E.ic(pout)):0;
  $('h_dim').style.opacity=po2; const pop=$('h_pop'); pop.style.opacity=po2;
  pop.style.transform=`scale(${lerp(0.86,1,E.back(pin))*(1-0.06*E.ic(pout))})`;
  const STEPS=['اتصال بلوتوث...','راه‌اندازی دیاگ...','شناسایی <span class="ltr">ECU</span>...'];
  let si=0; T_STEP.forEach((t,i)=>{if(f>=t)si=i}); const st=$('p_step');
  if(f<T_OK){st.innerHTML=STEPS[si]; const k=f-T_STEP[si]; st.style.opacity=E.oc(seg(k,0,5)); st.style.transform=`translateY(${(1-E.oc(seg(k,0,6)))*10}px)`;}
  else {st.innerHTML='دیاگ آماده‌ست'; st.style.opacity=1; st.style.transform='none';}
  $('p_ttl').textContent=f<T_OK?'در حال اتصال':'متصل شد'; $('p_ttl').style.color=f<T_OK?'#10203C':'#22A050';
  $('p_spin').style.transform=`rotate(${f*14}deg)`; $('p_spin').style.opacity=f<T_OK?1:0;
  const ok=seg(f,T_OK,T_OK+8); $('p_ok').style.opacity=E.oc(ok); $('p_ok').style.transform=`scale(${ok<=0?0.4:lerp(0.4,1,E.back(ok))})`;
  $('h_toast').style.opacity=E.oc(seg(f,T_OK+12,T_OK+18))*(1-seg(f,T_KM-6,T_KM));
  // long, clearly visible press on "اصالت کیلومتر" (~1 s)
  const lp=f>=T_KM-4&&f<T_KS+6, tl=$('h_km');
  if(lp){const el=$('tap'), r=tl.getBoundingClientRect(), pg=tl.closest('.scr').getBoundingClientRect(), sc=$('screen').getBoundingClientRect(), k=sc.width/572;
   el.style.left=(11+(r.left+r.width/2-pg.left)/k)+'px'; el.style.top=(11+(r.top+r.height/2-pg.top)/k)+'px';
   el.style.opacity=seg(f,T_KM-4,T_KM)*(1-seg(f,T_KS-4,T_KS+4)); el.style.transform=`scale(${1+0.25*seg(f,T_KM,T_KS)+0.5*seg(f,T_KS-4,T_KS+4)})`; tapped=true;}
  const hold=seg(f,T_KM,T_KM+4)*(1-seg(f,T_KS-4,T_KS));
  tl.style.transform=`scale(${1-0.05*hold})`; tl.style.background=hold>0?`rgba(227,239,252,${hold})`:'#fff'; tl.style.borderColor=hold>0.5?'#2196F3':'';
 }
 /* connection screen (fast: no permission dialog) */
 if(f>=T_CONN&&f<T_BACK+14){
  T(T_SEARCH,'c_search'); const TA=T_SEARCH+2;
  const scanning=f>=TA&&f<T_DEV[4]+4;
  $('c_stat').textContent=f<TA?'برای پیدا کردن دیاگ، جستجو را بزنید':(f<T_DEV[4]+4?'در حال جستجو...':'جستجو کامل شد. ۵ دیاگ یافت شد');
  $('c_search').style.background=scanning?'#90CAF9':'#2196F3';
  $('c_stop').style.color=scanning?'#10203C':'#98A3B8';
  $('c_prog').style.width=(f<TA?0:E.io(seg(f,TA,T_DEV[4]+4))*100)+'%'; $('c_prog').style.opacity=f<T_DEV[4]+10?1:1-seg(f,T_DEV[4]+10,T_DEV[4]+16);
  $('c_dim').style.opacity=0; $('c_perm').style.opacity=0;
  const eo=1-seg(f,T_DEV[0]-2,T_DEV[0]+4); vis($('c_empty'),eo);
  let rr=''; if(f>=TA){for(let i=0;i<3;i++){const ph=((f-TA)/14+i/3)%1; rr+=`<circle cx="268" cy="226" r="${lerp(50,250,ph)}" fill="none" stroke="#2196F3" stroke-width="${5-3*ph}" opacity="${(1-ph)*0.6*seg(f,TA,TA+4)}"/>`;}}
  $('c_radar').innerHTML=rr; $('c_emptyT').textContent=f<TA?'هنوز دستگاهی پیدا نشده':'در حال جستجوی دیاگ...';
  DEV.forEach((d,i)=>{const r=$('c_r'+i); const p=seg(f,T_DEV[i],T_DEV[i]+8); r.style.opacity=E.oc(seg(f,T_DEV[i],T_DEV[i]+4));
   r.style.transform=`translateY(${(1-E.oc(p))*26}px) scale(${p<=0?0.9:lerp(0.9,1,E.back(p))})`;});
  T(T_PICK,'c_r0'); const hl=Math.exp(-Math.pow((f-T_PICK-3)/5,2)); $('c_r0').style.boxShadow=`inset 0 0 0 ${3*hl}px rgba(33,150,243,${hl})`;
 }

 /* mileage page: car 1 (mismatch), car 2 (match) */
 if(f>=T_KS-2){
  T(T_CHK,'k_btn'); T(T_CHK2,'k_btn');
  const c2=f>=T_CHK2, a=c2?T_CHK2:T_CHK, rr=c2?T_C2R:T_C1R;
  const sc=seg(f,a+3,a+8)*(1-seg(f,rr-4,rr)); $('k_scan').style.opacity=f<a?0:sc;
  [0,1,2].forEach(i=>{$('k_s'+i).style.width=(E.io(seg(f,a+4+i*3,rr-6))*100)+'%';});
  const rs=E.oc(seg(f,rr,rr+8))*(c2||f<T_C2-6?1:1-seg(f,T_C2-6,T_C2)); const res=$('k_res'); res.style.opacity=f>=rr?rs:0; res.style.transform=`translateY(${(1-rs)*20}px)`;
  $('k_rt').textContent=c2?'نشانه‌ای از دستکاری دیده نشد':'ناهمخوانی دیده شد'; $('k_rt').style.color=c2?'#22A050':AMB;
  $('k_rb').textContent=c2?'شمارنده‌های داخلی ایسیو با کیلومتر ثبت‌شدهٔ خودرو ناهمخوانی ندارند.':'کیلومتر داشبورد با شمارنده‌های داخلی ایسیو جور درنمی‌آید.';
  res.style.borderRight=`8px solid ${c2?'#22A050':AMB}`;
 }
 if(!tapped) $('tap').style.opacity=0;
}

/* big comparison: the ECU counter climbs, then = or ≠ lands on the beat */
function cmp(f){
 const el=$('cmp'), on=f>=T_CMP-4&&f<T_RECAP+2; if(!on){el.style.display='none';return} el.style.display='block';
 const c2=f>=T_C2, a=c2?T_C2+6:T_CMP, rr=c2?T_C2R:T_C1R, D=c2?142000:85000, EV=c2?142300:186400;
 const pin=seg(f,a,a+14), sw=c2?Math.sin(Math.PI*seg(f,T_C2-8,T_C2+8)):0, out=seg(f,T_RECAP-8,T_RECAP);
 el.style.opacity=E.oc(seg(f,T_CMP-4,T_CMP+4))*(1-out)*(1-0.9*sw); el.style.transform=`translateY(${(1-E.oc(c2?1:pin))*60+sw*30}px) scale(${lerp(0.9,1,E.back(c2?1:pin))})`;
 $('cCar').lastChild.textContent=c2?'ماشین دوم':'ماشین اول';
 $('cD').textContent=g3(D);
 const up=E.io(seg(f,a+8,rr-2)); $('cE').textContent=g3(EV*up);
 const done=f>=rr, ok=c2, eq=$('cEq'), h=Math.exp(-Math.pow((f-rr-2)/5,2));
 eq.textContent=done?(ok?'=':'≠'):''; eq.style.background=done?(ok?GRN:AMB):'#E6EBF2'; eq.style.transform=`scale(${1+0.2*h})`;
 $('cE').style.color=done&&!ok?AMB:(done?GRN:'#10203C');
 const r=$('cR'), rp=seg(f,rr+4,rr+14); r.style.opacity=done?E.oc(rp):0; r.style.transform=`scale(${lerp(0.85,1,E.back(rp))})`;
 r.style.background=ok?'#DEF6E6':AMBT2; r.style.color=ok?GRN:AMB; r.innerHTML=ok?svg('check',GRN,46)+'تطابق دارد':svg('warn',AMB,44)+'تطابق ندارد';
 $('cN').style.opacity=!ok&&done?E.oc(seg(f,rr+18,rr+28)):0;
}
function outro(f){
 const ex=$('ex'), E0=T_RECAP, E1=T_END;
 if(f>=E0-6&&f<E1+2){const pin=seg(f,E0-6,E0+8), pout=seg(f,E1-9,E1-1);
  ex.style.display='block'; ex.style.opacity=E.oc(seg(f,E0-6,E0))*(1-E.ic(pout));
  ex.style.transform=`translateY(${(1-E.oc(pin))*70+E.ic(pout)*30}px) scale(${lerp(0.88,1,E.back(pin))})`;
  for(let i=0;i<3;i++){const b=E0+i*BEAT, p=seg(f,b-2,b+10), r=$('exr'+i);
   r.style.opacity=E.oc(seg(f,b-2,b+4)); r.style.transform=`translateX(${(1-E.oc(p))*-50}px)`;
   const nn=r.firstChild, hit=Math.exp(-Math.pow((f-b-1)/4,2)); nn.style.transform=`scale(${(p<=0?0.4:lerp(0.4,1,E.back(p)))*(1+0.12*hit)})`;}
 } else ex.style.display='none';
}

function render(f){
 hook(f); dash(f); phone(f); cmp(f); outro(f);
 TT.forEach((t,i)=>{const el=$('tt'+i);const pin=E.oc(seg(f,t.a,t.a+9)),pout=E.ic(seg(f,t.b-6,t.b));const o=pin*(1-pout);
  vis(el,o); el.style.transform=`translateY(${(1-pin)*28-pout*14}px)`;});
 renderEnd(f);
}
