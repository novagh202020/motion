<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>CarDiag Heart Ad Cover</title>
<style>
@font-face{font-family:V;font-weight:500;src:url(fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:700;src:url(fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(fonts/Vazirmatn-FD-Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:V,sans-serif;color:#10203C;background:#FBFCFF}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,#FBFCFF 0%,#ECF3FC 100%)}
.a{position:absolute}.rtl{direction:rtl}.ltr{direction:ltr;unicode-bidi:isolate}
/* inside the 4:5 feed crop (y 285..1635) */
#title{left:0;top:320px;width:1080px;text-align:center;font-weight:900;font-size:124px;line-height:1.1;white-space:nowrap}
#title b{color:#2196F3;font-weight:900}
.pill{display:inline-flex;align-items:center;gap:16px;border-radius:999px;white-space:nowrap}
</style></head><body>
<div id="c">
 <div id="title" class="a rtl">صدای <b>قلب</b><br>ماشینتو شنیدی؟</div>
 <svg class="a" style="left:0;top:0" width="1080" height="1920">
  <defs><filter id="gl" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
   <radialGradient id="bl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#28A0FF" stop-opacity=".22"/><stop offset="1" stop-color="#28A0FF" stop-opacity="0"/></radialGradient></defs>
  <circle cx="540" cy="900" r="420" fill="url(#bl)"/>
  <!-- the heartbeat runs from the car into the phone -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
   <path d="M-20 900 L330 900 L352 868 L374 900 L404 900 L436 740 L474 1060 L506 820 L526 930 L546 900 L760 900" stroke="#78CDFF" stroke-width="26" filter="url(#gl)" opacity=".6"/>
   <path d="M-20 900 L330 900 L352 868 L374 900 L404 900 L436 740 L474 1060 L506 820 L526 930 L546 900 L760 900" stroke="#2196F3" stroke-width="13"/>
  </g>
  <!-- road + car (left) -->
  <rect x="40" y="1250" width="600" height="110" rx="20" fill="#E4ECF6"/>
  <g transform="translate(320 1180) scale(.82)">
   <ellipse cx="-12" cy="122" rx="300" ry="18" fill="#142850" opacity=".10"/>
   <path d="M-300 70 L-300 18 Q-300 -4 -276 -8 L-196 -16 L-138 -70 Q-124 -84 -100 -84 L118 -84 Q142 -84 156 -66 L202 -14 L250 -8 Q276 -2 276 24 L276 70 Q276 86 260 86 L-284 86 Q-300 86 -300 70 Z" fill="#2196F3"/>
   <path d="M-120 -14 L-92 -60 L-8 -60 L-8 -14 Z M10 -60 L106 -60 L144 -14 L10 -14 Z" fill="#ADD6FA"/>
   <rect x="-302" y="16" width="26" height="16" rx="5" fill="#FFEA9C"/><rect x="254" y="16" width="22" height="16" rx="5" fill="#DC3232" opacity=".85"/>
   <g transform="translate(-170 86)"><circle r="50" fill="#10203C"/><circle r="26" fill="#E6EBF2"/><circle r="7" fill="#6E7D96"/></g>
   <g transform="translate(160 86)"><circle r="50" fill="#10203C"/><circle r="26" fill="#E6EBF2"/><circle r="7" fill="#6E7D96"/></g>
  </g>
 </svg>
 <!-- phone (right) with the trip report -->
 <div class="a rtl" style="left:700px;top:640px;width:300px;height:620px;border-radius:44px;background:#181C24;border:3px solid #5F6878;box-shadow:0 30px 60px rgba(20,40,80,.28);padding:10px">
  <div style="width:100%;height:100%;border-radius:36px;background:#EEF2F8;overflow:hidden">
   <div style="height:120px;background:linear-gradient(135deg,#1E88E5,#2196F3);color:#fff;padding:22px 18px 0">
    <div class="ltr" style="text-align:right;font-weight:800;font-size:16px;color:#ADD6FA">CarDiag</div>
    <div style="font-weight:900;font-size:24px;margin-top:2px">گزارش سفر</div></div>
   <div style="text-align:center;margin-top:22px"><div style="position:relative;display:inline-block;width:150px;height:150px">
    <svg width="150" height="150" viewBox="0 0 128 128"><circle cx="64" cy="64" r="52" fill="none" stroke="#E6EBF2" stroke-width="12"/><circle cx="64" cy="64" r="52" fill="none" stroke="#5CBF6E" stroke-width="12" stroke-linecap="round" transform="rotate(-90 64 64)" stroke-dasharray="326.7" stroke-dashoffset="71.9"/></svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:40px;color:#10203C">۷۸٪</div></div>
    <div style="font-weight:700;font-size:18px;color:#6E7D96">سلامت کلی</div></div>

   <div style="margin:18px 16px 0;padding:12px 14px;border-radius:14px;background:#FFF4E5;border-right:6px solid #F28012;font-weight:800;font-size:17px">تریم سوخت <span class="ltr" style="color:#F28012">+۱۸٪</span></div>
   <div style="margin:10px 16px 0;padding:12px 14px;border-radius:14px;background:#EEF8F1;border-right:6px solid #22A050;font-weight:800;font-size:17px">دمای موتور: سالم</div>
   <div style="margin:10px 16px 0;height:12px;border-radius:6px;background:#E6EBF2"></div><div style="margin:10px 16px 0;width:70%;height:12px;border-radius:6px;background:#E6EBF2"></div>
  </div></div>
 <div class="a rtl" style="left:0;top:1400px;width:1080px;text-align:center"><span class="pill" style="height:92px;padding:0 40px;background:#fff;border:3px solid #DEE6F2;box-shadow:0 14px 30px rgba(20,40,80,.12);font-weight:800;font-size:42px">۲۰ دقیقه رانندگی = یه چکاپ کامل</span></div>
 <div class="a" style="left:0;top:1520px;width:1080px;text-align:center;direction:ltr"><span class="pill" style="height:84px;padding:0 34px;background:#E3EFFC;color:#1565C0;font-weight:900;font-size:48px">
  <svg width="46" height="46" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#1565C0" stroke-width="2.2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="#1565C0" stroke-width="2.2"/><circle cx="17.3" cy="6.7" r="1.3" fill="#1565C0"/></svg>@cardiagai</span></div>
</div>
</body></html>
