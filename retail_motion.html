<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>CarDiag Retail</title>
<style>
@font-face{font-family:V;font-weight:500;src:url(fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:700;src:url(fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(fonts/Vazirmatn-FD-Black.ttf)}
:root{--blue:#2196F3;--deep:#1565C0;--navy:#10203C;--slate:#6E7D96;--url:#506482;--hair:#DEE6F2;--track:#E6EBF2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#FBFCFF}
body{font-family:V,sans-serif;color:var(--navy)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,#FBFCFF 0%,#ECF3FC 100%)}
.a{position:absolute}.ltr{direction:ltr;unicode-bidi:isolate}.rtl{direction:rtl}
#titles{position:absolute;left:0;top:0;width:1080px;height:400px;z-index:50}
.ttl{position:absolute;left:0;width:1080px;text-align:center;direction:rtl;opacity:0}
.ttl .h{font-weight:900;font-size:86px;line-height:1.15;color:var(--navy);white-space:nowrap;display:inline-block}
.ttl .s{font-weight:500;font-size:40px;color:var(--slate);margin-top:10px;white-space:nowrap}
.card{position:absolute;background:#fff;border:3px solid var(--hair);border-radius:40px;direction:rtl;
 box-shadow:0 30px 60px rgba(20,40,80,.16),0 8px 18px rgba(20,40,80,.08)}
.ic{width:96px;height:96px;border-radius:28px;background:#E3EFFC;display:flex;align-items:center;justify-content:center;flex:none}
/* feature frame: the app clip is composited into the hole (180,330,720x1067) with ffmpeg */
#frame{left:174px;top:324px;width:732px;height:1079px;border-radius:44px;background:#E9F0F8;z-index:10;opacity:0;overflow:hidden}
#desc{left:60px;top:1438px;width:960px;text-align:center;font-weight:700;font-size:42px;color:var(--slate);z-index:12;opacity:0;white-space:nowrap}
.tile{position:absolute;width:228px;height:228px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-weight:800;font-size:30px;line-height:1.25;opacity:0;z-index:14}
.row{position:absolute;left:120px;width:840px;height:150px;display:flex;align-items:center;gap:30px;padding:0 36px;font-weight:800;font-size:50px;white-space:nowrap;opacity:0;z-index:14}
.gold{display:inline-flex;align-items:center;height:84px;padding:0 30px;border-radius:42px;background:linear-gradient(180deg,#FFEA9C 0%,#F6CD5C 45%,#E0A82C 100%);
 color:#4B3005;font-weight:800;font-size:48px;white-space:nowrap;box-shadow:0 8px 18px rgba(224,168,44,.35)}
/* price strip, always on screen */
#price{left:70px;top:1650px;width:940px;height:190px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 44px;opacity:0}
#price .l{display:flex;flex-direction:column;gap:2px}
#price .k{font-weight:500;font-size:34px;color:var(--slate);display:flex;align-items:center;gap:16px}
#price .k s{font-weight:700;color:#98A3B8}
#price .v{font-weight:900;font-size:70px;line-height:1.1;color:var(--navy)}
#price .v small{font-size:40px;font-weight:800;color:var(--slate);margin-right:10px}
#price .off{height:96px;padding:0 30px;border-radius:48px;background:var(--blue);color:#fff;font-weight:900;font-size:44px;display:flex;align-items:center;white-space:nowrap;box-shadow:0 14px 30px rgba(33,150,243,.35)}
#buy{left:200px;top:1120px;width:680px;height:124px;border-radius:62px;background:var(--blue);color:#fff;font-weight:800;font-size:52px;display:flex;align-items:center;justify-content:center;opacity:0;z-index:30;box-shadow:0 18px 40px rgba(33,150,243,.35)}
</style>
</head>
<body>
<div id="stage">
 <svg id="pulseSvg" class="a" style="left:0;top:0;z-index:3" width="1080" height="1920">
  <defs><filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter></defs>
  <g id="pulseG">
   <path id="pulseGlow" d="" fill="none" stroke="#78CDFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)" opacity=".55"/>
   <path id="pulse" d="" fill="none" stroke="#2196F3" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
 </svg>
 <div id="bloom" class="a" style="width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(40,160,255,.30) 0%,rgba(40,160,255,.10) 42%,rgba(40,160,255,0) 70%);z-index:4"></div>
 <div id="diag" class="a" style="width:908px;height:656px;transform-origin:50% 50%;z-index:8">
  <div style="position:absolute;left:12%;top:84%;width:76%;height:18%;border-radius:50%;background:radial-gradient(ellipse,rgba(20,40,80,.32),rgba(20,40,80,0) 70%)"></div>
  <img src="assets/diag_front.png" style="position:absolute;left:0;top:0;width:100%;height:100%">
 </div>

 <div id="frame" class="card"></div>
 <div id="desc" class="a rtl"></div>
 <div id="tiles"></div>
 <div id="rows"></div>

 <div id="ecBrand" class="a ltr" style="left:0;top:900px;width:1080px;text-align:center;font-weight:900;font-size:126px;color:var(--deep);opacity:0;z-index:30">CarDiag AI</div>
 <div id="ecSub" class="a rtl" style="left:0;top:1060px;width:1080px;text-align:center;font-weight:700;font-size:44px;color:var(--slate);opacity:0;z-index:30">دیاگ بلوتوثی و عیب‌یاب هوش مصنوعی</div>
 <div id="buy" class="a">خرید از سایت کاردیاگ</div>
 <div id="ecUrl" class="a ltr" style="left:0;top:1280px;width:1080px;text-align:center;font-weight:700;font-size:60px;color:var(--url);opacity:0;z-index:30">cardiag.ir</div>

 <div id="price" class="a card">
  <div class="l"><span class="k">قیمت <s>۱٬۸۰۰٬۰۰۰</s></span><span class="v">۱٬۵۹۰٬۰۰۰<small>تومان</small></span></div>
  <span class="off">۱۲٪ تخفیف</span>
 </div>

 <div id="titles"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(f,a,b)=>cl((f-a)/(b-a)), lerp=(a,b,t)=>a+(b-a)*t;
const E={oc:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,ic:t=>t*t*t,back:t=>{const c1=1.55,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}};
const IC={
 warn:'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z',
 wrench:'M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z',
 car:'M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z',
 bat:'M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z',
 speed:'M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.27-10.44zm-9.79 6.84a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z',
 eye:'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z',
 bell:'M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z',
 route:'M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z',
 shield:'M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z',
 undo:'M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z',
 gift:'M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z'};
const sv=(p,c='#2196F3',s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${c}" d="${IC[p]}"/></svg>`;

/* ===== music grid: song/song_cut.wav — bar m downbeat = 7.5 + 67.5m, beat 16.875; groove from 210, recap 682.5, break 750, end card 817.5, heartbeats 868 / 885 */
const BAR=67.5, BEAT=16.875, B=m=>7.5+BAR*m;
const KICK1=[7.5,24.4,41.25,75,91.9,108.75,125.6];
const T_F=B(3), T_REC=B(10), T_BRK=B(11), T_END=B(12);
const BEATS=[[24.4,.6],[T_END,.7],[868,.6],[885,1]];
const beatAt=f=>BEATS.reduce((a,[b,m])=>a+m*Math.exp(-Math.pow((f-b)/(m<1?5:4),2)),0);

/* features: one bar each (the clip itself is composited by mux_retail.sh) */
const FEATS=[
 ['warn','خطایابی ECU','نمایش کد خطا و پاک کردن چراغ چک'],
 ['wrench','عیب‌یاب هوش مصنوعی','عیب‌یابی خودرو به زبان ساده'],
 ['route','گزارش سفر','گزارش کامل وضعیت خودرو در پایان مسیر'],
 ['bat','تست باتری و دینام','تشخیص ایراد باتری یا دینام پیش از تعویض'],
 ['speed','اصالت کیلومتر','مقایسه کیلومتر داشبورد با ECU'],
 ['eye','مانیتورینگ زنده','نمایش هم‌زمان سنسورهای خودرو'],
 ['bell','سرویس‌های دوره‌ای','یادآوری سرویس‌ها توسط اپلیکیشن'],
];
const TITLES=[{h:'دیاگ بلوتوثی کاردیاگ', s:'عیب‌یاب هوش مصنوعی خودرو', a:4, b:T_F-3}]
 .concat(FEATS.map((x,i)=>({h:x[1], a:B(3+i)+1, b:B(4+i)-2, fast:1})))
 .concat([{h:'همه امکانات در یک اپلیکیشن', a:T_REC+2, b:T_BRK-3},{h:'همراه هر دستگاه', a:T_BRK+2, b:T_END-3}]);
TITLES.forEach((t,i)=>{const d=document.createElement('div');d.className='ttl';d.id='t'+i;
 d.innerHTML=`<div class="h">${t.h.replace('ECU','<span class="ltr">ECU</span>')}</div>`+(t.s?`<div class="s">${t.s}</div>`:''); d.style.top=(t.s?150:185)+'px'; $('titles').appendChild(d);});
function fitTitles(){document.querySelectorAll('.ttl .h').forEach(h=>{const w=h.scrollWidth;if(w>960)h.style.transform=`scale(${960/w})`;})}

/* recap tiles 4 + 3 */
$('tiles').innerHTML=FEATS.map((x,i)=>{const r=i<4?0:1, c=r?i-4:i, n=r?3:4, x0=540-(n*228+(n-1)*24)/2+c*252;
 return `<div class="card tile" id="tl${i}" style="left:${1080-x0-228}px;top:${520+r*260}px"><span class="ic">${sv(x[0],'#2196F3',54)}</span><span>${x[1].replace('ECU','<span class="ltr">ECU</span>')}</span></div>`}).join('');
/* break rows */
const ROWS=[['gift',''],['shield','۶ ماه گارانتی تعویض'],['undo','۵ روز مرجوعی']];
$('rows').innerHTML=ROWS.map((r,i)=>`<div class="card row" id="rw${i}" style="top:${560+i*190}px"><span class="ic">${sv(r[0],i?'#2196F3':'#E0A82C',56)}</span>${i?r[1]:'<span class="gold">اشتراک طلایی اپلیکیشن</span>'}</div>`).join('');

const P1='M-20 1000 L250 1000 L290 1000 L312 960 L332 1000 L360 1000 L392 820 L430 1150 L462 950 L482 1010 L500 1000 L1100 1000';
const P_END='M-20 1480 L360 1480 L390 1480 L410 1450 L430 1480 L456 1480 L486 1380 L516 1570 L544 1440 L560 1495 L576 1480 L1100 1480';
let curP=''; function setPulse(d){if(curP===d)return;curP=d;$('pulse').setAttribute('d',d);$('pulseGlow').setAttribute('d',d)}

/* diag keyframes [frame, cx, cy, width] — drops on the heartbeat spike, slow zoom, leaves for the features, returns for the end card */
const DK=[[0,540,-500,700],[8,540,-500,700],[24,540,960,700],[T_F-14,540,940,760],[T_F+2,540,-500,700],
 [T_END-8,540,-500,560],[T_END+12,540,640,560]];
function key(K,f){let i=0;while(i<K.length-1&&f>K[i+1][0])i++;const A=K[i],Bk=K[Math.min(i+1,K.length-1)];
 const t=Bk[0]===A[0]?1:(i===2?seg(f,A[0],Bk[0]):E.io(seg(f,A[0],Bk[0])));return A.map((v,j)=>j?lerp(v,Bk[j],t):f);}
const show=(el,o,disp)=>{el.style.opacity=o;el.style.display=o<=0.001?'none':disp;};

function render(f){
 TITLES.forEach((t,i)=>{const el=$('t'+i); const pin=E.oc(seg(f,t.a,t.a+(t.fast?6:9))), pout=E.ic(seg(f,t.b-(t.fast?4:6),t.b));
  const o=pin*(1-pout); el.style.opacity=o; el.style.transform=`translateY(${(1-pin)*28-pout*14}px)`; el.style.display=o<=0.001?'none':'block';});

 /* pulse */
 const pe=$('pulse'), pg=$('pulseG');
 if(f<T_F){ setPulse(P1); const L=pe.getTotalLength(), d=f<24.4?lerp(0.1,0.5,E.io(seg(f,0,24.4))):lerp(0.5,1,E.oc(seg(f,24.4,50)));
  [pe,$('pulseGlow')].forEach(p=>{p.style.strokeDasharray=L;p.style.strokeDashoffset=L*(1-d)});
  const kick=Math.max(Math.exp(-Math.pow((f-24.4)/5,2)),...KICK1.map(k=>0.45*Math.exp(-Math.pow((f-k)/4,2))),...[1,2,3].map(k=>0.5*Math.exp(-Math.pow((f-(B(2)+k*BEAT))/4,2))));
  $('pulseGlow').style.opacity=0.3+0.6*kick; pg.style.opacity=1-seg(f,T_F-12,T_F);
 } else if(f>=T_END+6){ setPulse(P_END); const L=pe.getTotalLength(), d=E.io(seg(f,T_END+6,T_END+36));
  [pe,$('pulseGlow')].forEach(p=>{p.style.strokeDasharray=L;p.style.strokeDashoffset=L*(1-d)});
  $('pulseGlow').style.opacity=0.3+0.7*beatAt(f); pg.style.opacity=1;
 } else pg.style.opacity=0;

 /* diag + bloom */
 const [,cx,cy,w]=key(DK,f), land=f<40?Math.sin(Math.PI*seg(f,24,36))*0.06:0, pump=0.04*beatAt(f), off=(cy<-300);
 const dg=$('diag'), s=w/908*(1-land*0.5+pump);
 dg.style.left=(cx-454)+'px'; dg.style.top=(cy-328)+'px'; dg.style.transform=`scale(${s}) scaleY(${1-land})`; dg.style.display=off?'none':'block';
 const bl=$('bloom'); bl.style.left=(cx-450)+'px'; bl.style.top=(cy-450)+'px'; bl.style.transform=`scale(${w/640*(1+0.08*beatAt(f))})`;
 bl.style.opacity=(f<T_F?seg(f,20,40):1)*(off?0:1);

 /* price strip: slides up after the drop, stays to the end */
 const pp=E.back(seg(f,40,56)); $('price').style.opacity=E.oc(seg(f,40,48)); $('price').style.transform=`translateY(${(1-pp)*240}px) scale(${1+0.03*beatAt(f)})`;

 /* feature frame (clips composited inside) */
 const fi=E.back(seg(f,T_F-2,T_F+10)), fo=E.ic(seg(f,T_REC-6,T_REC+2));
 show($('frame'),E.oc(seg(f,T_F-2,T_F+6))*(1-fo),'block'); $('frame').style.transform=`scale(${lerp(0.85,1,fi)-0.1*fo})`;
 const k=Math.floor((f-T_F)/BAR), dEl=$('desc');
 if(f>=T_F-2&&f<T_REC){const kk=Math.max(0,Math.min(6,k)), a=B(3+kk), p=E.oc(seg(f,a+2,a+10)), q=E.ic(seg(f,a+BAR-5,a+BAR));
  dEl.textContent=FEATS[kk][2]; dEl.innerHTML=dEl.textContent.replace('ECU','<span class="ltr">ECU</span>');
  show(dEl,p*(kk===6?1-fo:1-q),'block'); dEl.style.transform=`translateY(${(1-p)*20}px)`;}
 else show(dEl,0,'block');

 /* recap tiles */
 FEATS.forEach((_,i)=>{const a=T_REC+2+i*8.4, p=E.back(seg(f,a,a+12)), o=E.oc(seg(f,a,a+6))*(1-E.ic(seg(f,T_BRK-5,T_BRK+3)));
  show($('tl'+i),o,'flex'); $('tl'+i).style.transform=`scale(${lerp(0.5,1,p)})`;});
 /* break rows */
 ROWS.forEach((_,i)=>{const a=T_BRK+2+i*BEAT, p=E.back(seg(f,a,a+12)), o=E.oc(seg(f,a,a+6))*(1-E.ic(seg(f,T_END-5,T_END+3)));
  show($('rw'+i),o,'flex'); $('rw'+i).style.transform=`translateX(${(1-p)*-120}px)`;});

 /* end card */
 [['ecBrand',0],['ecSub',6],['buy',BEAT],['ecUrl',BEAT+8]].forEach(([id,d])=>{const a=T_END+10+d, p=E.oc(seg(f,a,a+12)), el=$(id);
  el.style.opacity=p; el.style.transform=`translateY(${(1-p)*40}px)`+(id==='buy'?` scale(${1+0.05*Math.exp(-Math.pow((f-885)/4,2))})`:'');});
}
window.READY=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{fitTitles();render(0)});
window.render=render;
</script>
</body>
</html>
