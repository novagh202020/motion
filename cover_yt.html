<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>CarDiag Cover Phone</title>
<style>
@font-face{font-family:V;font-weight:500;src:url(fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:700;src:url(fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(fonts/Vazirmatn-FD-Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden}
body{font-family:V,sans-serif;background:#FBFCFF;color:#10203C}
#c{position:relative;width:1280px;height:720px;overflow:hidden;
 background:radial-gradient(ellipse 700px 600px at 30% 55%,#FFFFFF 0%,rgba(255,255,255,0) 70%),linear-gradient(180deg,#FBFCFF 0%,#ECF3FC 100%)}
.a{position:absolute}.rtl{direction:rtl}.ltr{direction:ltr;unicode-bidi:isolate}
#kicker{right:70px;top:150px;width:640px;text-align:right;font-weight:800;font-size:40px;color:#2196F3}
#title{right:66px;top:204px;width:700px;text-align:right;font-weight:900;font-size:104px;line-height:1.1;white-space:nowrap}
#title b{color:#2196F3;font-weight:900}
#sub{right:70px;top:352px;width:640px;text-align:right;font-weight:500;font-size:36px;line-height:1.5;color:#6E7D96}
#brand{right:70px;top:540px;width:640px;text-align:right;font-weight:900;font-size:50px;color:#1565C0}
#url{right:70px;top:604px;width:640px;text-align:right;font-weight:700;font-size:32px;color:#506482}
#bloom{left:-40px;top:20px;width:720px;height:700px;border-radius:50%;
 background:radial-gradient(ellipse,rgba(40,160,255,.26) 0%,rgba(40,160,255,.10) 40%,rgba(40,160,255,0) 70%)}

/* phone */
#phone{left:250px;top:58px;width:572px;height:1270px;border-radius:78px;background:#181C24;border:3px solid #5F6878;
 transform-origin:0 0;transform:scale(.44) rotate(7deg);box-shadow:0 60px 110px rgba(20,40,80,.30),0 16px 30px rgba(20,40,80,.18)}
#screen{position:absolute;left:11px;top:11px;width:544px;height:1242px;border-radius:66px;overflow:hidden;background:#EEF2F8;direction:rtl}
#notch{position:absolute;left:50%;top:16px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#0b0e13;z-index:5}
.sbar{height:52px;display:flex;justify-content:space-between;align-items:center;padding:8px 44px 0;font-weight:700;font-size:20px;direction:ltr}
.appbar{background:#2196F3;color:#fff}
.abar{height:84px;display:flex;align-items:center;padding:0 28px;gap:14px;font-weight:800;font-size:31px}
.card{background:#fff;border:2px solid #DEE6F2;border-radius:26px;margin:16px 20px;padding:22px 24px;box-shadow:0 6px 16px rgba(20,40,80,.05)}
.nav{position:absolute;left:0;bottom:0;width:100%;height:100px;background:#2196F3;display:flex;padding-bottom:8px}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:500;font-size:18px;gap:4px}
.tile{background:#fff;border:2px solid #DEE6F2;border-radius:24px;height:176px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:700;font-size:23px}
.ic{width:80px;height:80px;border-radius:22px;background:#E3EFFC;display:flex;align-items:center;justify-content:center}

/* product in front */
#prod{left:30px;top:350px;width:390px}
#shadow{left:60px;top:618px;width:350px;height:80px;border-radius:50%;background:radial-gradient(ellipse,rgba(20,40,80,.34),rgba(20,40,80,0) 70%);filter:blur(4px)}
</style></head><body>
<div id="c">
 <div id="bloom" class="a"></div>

 <div id="phone" class="a"><div id="notch"></div><div id="screen"></div></div>
 <div id="shadow" class="a"></div>
 <img id="prod" class="a" src="assets/diag_front.png">

 <div id="kicker" class="a rtl">دیاگ سری <span class="ltr">C</span> رسید</div>
 <div id="title" class="a rtl">مکانیکِ <b>تو جیبت</b></div>
 <div id="sub" class="a rtl">عیب‌یابی خودرو با هوش مصنوعی<br>بدون نیاز به دانش فنی</div>
 <div id="brand" class="a ltr">CarDiag AI</div>
 <div id="url" class="a ltr">cardiag.ir</div>
</div>
<script>
const I={
 warn:'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z',
 eye:'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z',
 car:'M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z',
 wrench:'M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z',
 home:'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z', add:'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z',
 more:'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
 arrow:'M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z', down:'M7 10l5 5 5-5z',
 plug:'M16 7V3h-2v4h-4V3H8v4h-.01C6.9 6.99 6 7.89 6 8.98v5.52L9.5 18v3h5v-3l3.5-3.51v-5.5c0-1.1-.9-2-2-2z',
 bot:'M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zM7.5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S9.83 13 9 13s-1.5-.67-1.5-1.5zM16 17H8v-2h8v2zm-1-4c-.83 0-1.5-.67-1.5-1.5S14.17 10 15 10s1.5.67 1.5 1.5S15.83 13 15 13z',
};
const sv=(p,c,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${c}" d="${I[p]}"/></svg>`;
const NAV=`<div class="nav"><div>${sv('home','#fff',32)}<span>خانه</span></div><div>${sv('add','#fff',36)}<span>افزودن خودرو</span></div><div>${sv('more','#fff',34)}<span>بیشتر</span></div></div>`;
const SB=(c)=>`<div class="sbar" style="color:${c}"><span>۱۲:۳۴</span><span>●●● ▮ ۱۰۰٪</span></div>`;

const HOME=`${SB('#10203C')}
 <div class="card" style="margin-top:10px;padding:24px">
  <div style="height:76px;border:3px solid #2196F3;border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:0 22px">
   <span style="font-weight:800;font-size:32px">۲۰۶</span>${sv('down','#2196F3',42)}</div>
  <div style="margin-top:18px;font-weight:500;font-size:23px;color:#6E7D96">وضعیت اتصال: <b style="font-weight:800;color:#22A050">متصل</b></div>
  <div style="text-align:center;margin-top:18px"><span style="font-weight:900;font-size:96px;color:#22A050;line-height:1">۹۲٪</span>
   <div style="font-weight:700;font-size:24px;color:#6E7D96;margin-top:2px">سلامت خودرو</div></div>
  <div class="ltr" style="position:relative;margin:18px 6px 4px;height:28px;border-radius:14px;background:#E6EBF2;overflow:hidden">
   <div style="position:absolute;left:0;top:0;height:28px;width:92%;border-radius:14px;background:linear-gradient(90deg,#E63C3C 0%,#F59628 35%,#D7C832 65%,#32B455 100%);background-size:460px 28px"></div></div>
  <div style="display:flex;gap:14px;margin-top:22px">
   <div style="flex:1;height:66px;border-radius:33px;background:#2196F3;color:#fff;font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;gap:8px">${sv('plug','#fff',28)}اتصال</div>
   <div style="flex:1;height:66px;border-radius:33px;border:2px solid #DEE6F2;color:#6E7D96;font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center">قطع اتصال</div></div>
 </div>
 <div style="padding:8px 30px 6px;font-weight:700;font-size:23px;color:#98A3B8">دسترسی سریع</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px">
  <div class="tile"><div class="ic">${sv('car','#2196F3',44)}</div>سفر</div>
  <div class="tile"><div class="ic">${sv('warn','#2196F3',44)}</div><span>خطایابی <span class="ltr">ECU</span></span></div>
  <div class="tile"><div class="ic">${sv('wrench','#2196F3',44)}</div>عیب‌یاب هوش مصنوعی</div>
  <div class="tile"><div class="ic">${sv('eye','#2196F3',44)}</div>مانیتورینگ خودرو</div>
 </div>${NAV}`;

const AI=`<div class="appbar">${SB('#fff')}<div class="abar">${sv('arrow','#fff',34)}<span>عیب‌یاب هوشمند</span></div></div>
 <div style="padding:22px 20px 0;display:flex;justify-content:flex-start">
  <div style="max-width:420px;background:#2196F3;color:#fff;font-weight:700;font-size:25px;line-height:1.5;padding:16px 22px;border-radius:24px 24px 6px 24px">ماشین در حالت سرد بد گاز می‌خوره</div></div>
 <div class="card" style="margin-top:20px;padding:24px 26px">
  <div style="display:flex;align-items:center;gap:12px">
   <div style="width:56px;height:56px;border-radius:16px;background:#E3EFFC;display:flex;align-items:center;justify-content:center">${sv('bot','#2196F3',34)}</div>
   <div style="font-weight:900;font-size:30px">مشکل در کاتالیزور</div></div>
  <div style="display:inline-flex;align-items:center;gap:10px;margin-top:16px;background:#FFECEC;color:#DC3232;font-weight:800;font-size:24px;padding:8px 18px;border-radius:20px">
   <span style="width:16px;height:16px;border-radius:50%;background:#DC3232"></span>خیلی جدی</div>
  <div style="margin-top:20px;font-weight:800;font-size:24px">به زبان ساده چه اتفاقی افتاده؟</div>
  <div style="margin-top:6px;font-weight:500;font-size:22px;line-height:1.75;color:#33415C">یه قطعه توی سیستم اگزوز که وظیفه داره گازهای آلاینده رو کم کنه، درست کار نمی‌کنه.</div>
  <div style="margin-top:18px;font-weight:800;font-size:24px">چی باید بکنی؟</div>
  <div style="margin-top:6px;font-weight:500;font-size:22px;line-height:1.75;color:#33415C">باید سریعاً بری تعمیرگاه و از مکانیک بخوای کاتالیزور رو بررسی کنه.</div>
 </div>
 <div class="card" style="padding:20px 26px;opacity:.55">
  <div style="font-weight:900;font-size:27px">مشکل در تنظیم سوخت و هوا</div>
  <div style="display:inline-flex;align-items:center;gap:10px;margin-top:12px;background:#FFF3DF;color:#F28012;font-weight:800;font-size:22px;padding:6px 16px;border-radius:18px">
   <span style="width:14px;height:14px;border-radius:50%;background:#F28012"></span>نسبتاً جدی</div>
 </div>`;
const v='ai';
document.getElementById('screen').innerHTML=v==='ai'?AI:HOME;
</script>
</body></html>
