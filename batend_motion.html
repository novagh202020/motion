<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>CarDiag Battery End Card</title>
<style>
@font-face{font-family:V;font-weight:500;src:url(fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:700;src:url(fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(fonts/Vazirmatn-FD-Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
body{font-family:V,sans-serif;color:#10203C}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#FBFCFF 0%,#ECF3FC 100%)}
.a{position:absolute}.ltr{direction:ltr;unicode-bidi:isolate}
.L{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
.ctr{position:absolute;left:0;width:1080px;text-align:center;direction:rtl}
.av{width:72px;height:72px;border-radius:50%;flex:none}
.ln{height:20px;border-radius:10px;background:#E6EBF2}
</style></head><body>
<div id="stage">
 <!-- 1. battery fills blue -> green, gets a tick, then opens the scene -->
 <div id="sBat" class="L"><svg id="bat" class="a" style="left:0;top:0" width="1080" height="1920"></svg></div>
 <!-- 2. the diag + the app's home screen, battery tile lit -->
 <div id="sProd" class="L">
  <div class="a" style="left:100px;top:520px;width:880px;height:880px;border-radius:50%;background:radial-gradient(circle,rgba(40,160,255,.22) 0%,rgba(40,160,255,0) 66%)"></div>
  <div id="mock" class="a" style="left:560px;top:520px;width:400px;height:860px;border-radius:56px;box-shadow:0 40px 80px rgba(20,40,80,.25)">
   <img src="assets/app_home.png" style="width:100%;height:100%;border-radius:56px">
   <div id="tile" class="a" style="left:205px;top:610px;width:175px;height:84px;border-radius:18px;border:5px solid #2196F3"></div></div>
  <img id="diag" src="assets/diag_front.png" class="a" style="left:70px;top:900px;width:540px;filter:drop-shadow(0 40px 50px rgba(20,40,80,.28))">
 </div>
 <!-- 3. comment «تست باتری» -->
 <div id="sCm" class="L">
  <div id="cmT" class="ctr" style="top:350px;font-weight:900;font-size:64px;line-height:1.45;white-space:nowrap">برای دریافت اطلاعات محصول،<br>کلمه‌ی <span style="color:#2196F3">«تست باتری»</span> رو کامنت کن</div>
  <div id="sheet" class="a" style="left:110px;top:640px;width:860px;height:900px;border-radius:44px;background:#fff;border:3px solid #DEE6F2;box-shadow:0 40px 80px rgba(20,40,80,.18);padding:34px 44px;direction:rtl;overflow:hidden"></div>
 </div>
 <!-- 4. site -->
 <div id="sSite" class="L">
  <div class="a" style="left:140px;top:520px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(40,160,255,.24) 0%,rgba(40,160,255,0) 66%)"></div>
  <div id="sLogo" class="a" style="left:270px;top:640px"></div>
  <div id="sName" class="ctr ltr" style="top:850px;font-weight:900;font-size:120px;color:#1565C0">CarDiag AI</div>
  <div id="url" class="ctr" style="top:1070px"><span id="urlI" style="display:inline-flex;align-items:center;gap:18px;height:140px;padding:0 60px;border-radius:70px;background:#fff;border:3px solid #E2E8F0;box-shadow:0 24px 50px rgba(20,40,80,.14);direction:ltr;font-weight:800;font-size:80px;color:#10203C"></span></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(f,a,b)=>cl((f-a)/(b-a)), lerp=(a,b,t)=>a+(b-a)*t;
const E={oc:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,ic:t=>t*t*t,back:t=>{const c1=1.55,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}};
const imp=(f,k,d=4)=>f>=k?Math.exp(-(f-k)/d):0;
const FA='۰۱۲۳۴۵۶۷۸۹', fa=s=>String(s).replace(/[0-9]/g,d=>FA[d]);
const vis=(el,o)=>{el.style.opacity=o; el.style.display=o<=0.001?'none':'block';};
const IC={
 warn:'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z',
 car:'M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z',
 check:'M9 16.17L4.83 12l-1.42 1.42L9 19 21 7l-1.41-1.41z',
 checkc:'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z',
 home:'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z', add:'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z',
 more:'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
 arrow:'M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z',
 play:'M10 16.5l6-4.5-6-4.5v9zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z',
 trash:'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
 search:'M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',
 bt:'M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z',
 down:'M7 10l5 5 5-5z',
 plug:'M16 7V3h-2v4h-4V3H8v4h-.01C6.9 6.99 6 7.89 6 8.98v5.52L9.5 18v3h5v-3l3.5-3.51v-5.5c0-1.1-.9-2-2-2z',
 close:'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
 wrench:'M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z',
 eye:'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z',
 batt:'M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4zM11 20v-5.5H9L13 7v5.5h2L11 20z',
 trend:'M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z',
 gift:'M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z',
 medal:'M12 7a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm2.6 9.2L12 14.6l-2.6 1.6.7-3-2.3-2 3-.3L12 8.2l1.2 2.7 3 .3-2.3 2 .7 3zM7 2h10l-2 4H9z',
};
const svg=(p,c='#2196F3',s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${c}" d="${IC[p]}"/></svg>`;
/* brand mark (car outline + pulse) as on the splash */
const LOGO=(w,c,sw=7)=>`<svg width="${w}" height="${w*0.36}" viewBox="0 0 400 144"><path class="lg" d="M8 92 L58 92 Q66 92 72 80 Q92 40 140 38 L176 38 Q214 38 236 74 L248 92 L262 92 L280 60 L304 128 L330 30 L350 92 L392 92" fill="none" stroke="${c}" stroke-width="${sw*1.6}" stroke-linecap="round" stroke-linejoin="round"/>
 <circle class="lg" cx="104" cy="114" r="16" fill="none" stroke="${c}" stroke-width="${sw*1.3}"/><circle class="lg" cx="188" cy="114" r="16" fill="none" stroke="${c}" stroke-width="${sw*1.3}"/></svg>`;
Object.assign(IC,{lock:'M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z',
 send:'M2.01 21L23 12 2.01 3 2 10l15 2-15 2z'});
/* timeline (30 fps, 10 s): battery 0-62, product 55-148, comment 140-240, site 235-300 */
const NF=300, T_FULL=40, T_OPEN=50, T_P=55, T_TILE=88, T_C=140, T_TY=[166,196], T_SEND=206, T_RE=220, T_S=236, T_URL=[250,272], T_HIT=276;
const show=(id,a,b,f)=>{const el=$(id), on=f>=a&&f<b; el.style.display=on?'block':'none'; return on};
const io=(el,f,a,b)=>{const p=E.oc(seg(f,a,a+12)), q=E.ic(seg(f,b-10,b)); el.style.opacity=p*(1-q); el.style.transform=`scale(${lerp(1.06,1,p)*(1-0.05*q)})`; el.style.filter=(p<1||q>0)?`blur(${(1-p)*12+q*12}px)`:'none'};
/* 1. battery */
function bat(f){if(!show('sBat',0,T_OPEN+14,f)) return; const pin=E.back(seg(f,0,10)), fill=E.io(seg(f,8,T_FULL)), op=E.ic(seg(f,T_OPEN,T_OPEN+14));
 const col=fill<0.6?'#2196F3':(fill<0.85?'#4FB34F':'#22A050'), ok=seg(f,T_FULL+1,T_FULL+9), W=420, H=720, X=330, Y=560;
 $('sBat').style.opacity=1-seg(f,T_OPEN+6,T_OPEN+14);
 $('bat').innerHTML=`<g transform="translate(540 920) scale(${lerp(0.6,1,pin)*(1+3.5*op)}) translate(-540 -920)" opacity="${cl(pin*2)}">
  <rect x="${X+W/2-70}" y="${Y-56}" width="140" height="70" rx="20" fill="#10203C"/>
  <rect x="${X}" y="${Y}" width="${W}" height="${H}" rx="70" fill="#fff" stroke="#10203C" stroke-width="22"/>
  <clipPath id="bc"><rect x="${X+30}" y="${Y+30}" width="${W-60}" height="${H-60}" rx="46"/></clipPath>
  <g clip-path="url(#bc)"><rect x="${X+30}" y="${Y+30+(H-60)*(1-fill)}" width="${W-60}" height="${(H-60)*fill+4}" fill="${col}"/>
   <path d="M${X+30} ${Y+30+(H-60)*(1-fill)} q${(W-60)/4} ${-14*Math.sin(f/3)} ${(W-60)/2} 0 t${(W-60)/2} 0 V${Y+H} H${X+30} Z" fill="${col}"/></g>
  ${ok>0?`<g transform="translate(540 ${Y+H/2}) scale(${E.back(ok)})"><circle r="120" fill="#fff" opacity=".95"/><path d="M-56 4 L-16 44 L60 -40" fill="none" stroke="#22A050" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></g>`:''}
  ${fill<1?`<path d="M${540+16} ${Y+H/2-120} L${540-56} ${Y+H/2+14} L${540} ${Y+H/2+14} L${540-16} ${Y+H/2+120} L${540+56} ${Y+H/2-14} L${540} ${Y+H/2-14} Z" fill="#fff" opacity="${0.9*(1-seg(f,T_FULL-6,T_FULL))}"/>`:''}</g>`;}
/* 2. product */
function prod(f){if(!show('sProd',T_P,T_C+8,f)) return; io($('sProd'),f,T_P,T_C+8);
 const m=E.oc(seg(f,T_P+4,T_P+20)); $('mock').style.transform=`translateY(${(1-m)*160+Math.sin(f/14)*6}px) rotate(${lerp(9,4,m)}deg)`; $('mock').style.opacity=cl(m*2);
 const d=E.oc(seg(f,T_P,T_P+16)); $('diag').style.transform=`translateY(${(1-d)*120}px) rotate(${lerp(-16,-6,d)}deg)`; $('diag').style.opacity=cl(d*2);
 const g=seg(f,T_TILE,T_TILE+8), pulse=f>T_TILE?0.5+0.5*Math.sin((f-T_TILE)/4):0; $('tile').style.opacity=E.oc(g); $('tile').style.boxShadow=`0 0 0 ${8+10*pulse}px rgba(33,150,243,${0.25+0.2*pulse})`;}
/* 3. comment */
$('sheet').innerHTML=`<div style="font-weight:800;font-size:40px;text-align:center;padding-bottom:20px;border-bottom:2px solid #EEF2F8">کامنت‌ها</div>
 ${[0,1].map(i=>`<div style="display:flex;align-items:center;gap:20px;padding:20px 0"><span class="av" style="background:#E3EFFC"></span><div style="flex:1"><div class="ln" style="width:${[40,30][i]}%"></div><div class="ln" style="width:${[80,60][i]}%;margin-top:12px;background:#EEF2F8"></div></div></div>`).join('')}
 <div id="cmMe" style="display:flex;align-items:center;gap:20px;padding:20px 0;opacity:0"><span class="av" style="background:linear-gradient(135deg,#78CDFF,#2196F3)"></span><div><div style="font-weight:700;font-size:28px;color:#6E7D96">شما</div><div style="font-weight:900;font-size:50px">تست باتری</div></div></div>
 <div id="cmRe" style="opacity:0;margin-top:10px;display:flex;gap:18px;align-items:flex-start"><span class="av" style="background:#2196F3;display:flex;align-items:center;justify-content:center">${LOGO(56,'#fff',6)}</span>
  <div style="background:#E3EFFC;border-radius:28px;padding:22px 30px"><div class="ltr" style="font-weight:800;font-size:26px;color:#1565C0;text-align:right">@cardiagai</div>
   <div style="font-weight:800;font-size:36px;color:#10203C;margin-top:4px">اطلاعات محصول برات ارسال شد ✓</div></div></div>
 <div style="position:absolute;left:44px;right:44px;bottom:34px;display:flex;align-items:center;gap:16px">
  <span class="av" style="width:64px;height:64px;background:linear-gradient(135deg,#78CDFF,#2196F3)"></span>
  <div id="cmIn" style="flex:1;height:90px;border:3px solid #DEE6F2;border-radius:45px;display:flex;align-items:center;padding:0 30px;font-weight:700;font-size:38px"></div>
  <span id="cmSend" style="width:90px;height:90px;border-radius:50%;background:#2196F3;display:flex;align-items:center;justify-content:center">${svg('send','#fff',46)}</span></div>`;
const typ=(s,a,b,f)=>s.slice(0,Math.round(s.length*seg(f,a,b)));
const caret=(f,a,b)=>f>=a&&f<b+8?`<span style="display:inline-block;width:3px;height:40px;background:#2196F3;margin-right:2px;vertical-align:middle;opacity:${Math.floor(f/8)%2?0:1}"></span>`:'';
function cm(f){if(!show('sCm',T_C,T_S+8,f)) return; io($('sCm'),f,T_C,T_S+8);
 const t=E.oc(seg(f,T_C+2,T_C+14)); $('cmT').style.opacity=t; $('cmT').style.transform=`translateY(${(1-t)*40}px)`;
 const sp=E.oc(seg(f,T_C+8,T_C+22)); $('sheet').style.transform=`translateY(${(1-sp)*260}px)`; $('sheet').style.opacity=cl(sp*2);
 const ph='<span style="color:#98A3B8;font-weight:500">یه کامنت بنویس...</span>';
 $('cmIn').innerHTML=f<T_TY[0]?ph:(f<T_SEND?typ('تست باتری',...T_TY,f)+caret(f,...T_TY):ph); $('cmIn').style.borderColor=f>=T_TY[0]&&f<T_SEND?'#2196F3':'#DEE6F2';
 $('cmSend').style.transform=`scale(${1-0.14*Math.exp(-Math.pow((f-T_SEND)/3,2))})`;
 const m=seg(f,T_SEND+2,T_SEND+10); $('cmMe').style.opacity=E.oc(m); $('cmMe').style.transform=`translateY(${(1-E.oc(m))*40}px)`;
 const r=seg(f,T_RE,T_RE+10); $('cmRe').style.opacity=E.oc(r); $('cmRe').style.transform=`translateY(${(1-E.oc(r))*40}px) scale(${r<=0?0.8:lerp(0.8,1,E.back(r))})`;}
/* 4. site */
$('sLogo').innerHTML=LOGO(540,'#2196F3',7);
function site(f){if(!show('sSite',T_S,NF+1,f)) return; io($('sSite'),f,T_S,99999);
 const hit=Math.exp(-Math.pow((f-T_HIT)/4,2));
 const lg=[...$('sLogo').querySelectorAll('.lg')]; lg.forEach((p,i)=>{const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L*(1-E.io(seg(f,T_S+2+i*3,T_S+24+i*3)));});
 $('sLogo').style.transform=`scale(${1+0.06*hit})`;
 const n=E.oc(seg(f,T_S+10,T_S+20)); $('sName').style.opacity=n; $('sName').style.transform=`translateY(${(1-n)*30}px)`;
 const u=seg(f,T_URL[0]-6,T_URL[0]+6); $('url').style.opacity=E.oc(cl(u*2)); $('urlI').style.transform=`scale(${(u<=0?0.8:lerp(0.8,1,E.back(u)))*(1+0.06*hit)})`;
 const s='cardiag.ir', k=Math.round(s.length*seg(f,...T_URL)), car=f<T_URL[1]+10&&Math.floor(f/8)%2==0;
 $('urlI').innerHTML=`${svg('lock','#22A050',58)}<span>${s.slice(0,k)}</span><span style="display:inline-block;width:5px;height:78px;background:#2196F3;opacity:${car?1:0}"></span>`;}
function render(f){bat(f); prod(f); cm(f); site(f);}
window.READY=document.fonts.ready.then(()=>{render(0);return true});
</script>
</body></html>
