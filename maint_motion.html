 const oo=E.oc(seg(f,T_GPS+24,T_GPS+34))*(1-seg(f,T_DRIVE[1]-40,T_DRIVE[1]-30)), od=$('odo'); od.style.opacity=oo;
 if(oo>0) od.innerHTML=`<span class="chip" style="height:120px;font-size:64px;font-weight:900;color:#10203C">${svg('gps','#2196F3',60)}<span>${kmf(Math.round(km(f)/10)*10)}</span><span style="font-size:40px;color:#6E7D96">کیلومتر</span></span>`;
 // two promises, then the monitor boots
 $('pro').innerHTML=f<T_S1?[[svg('check',GRN,42),'بدون دیاگ'],[svg('check',GRN,42),'رایگان']].map(([i,t],j)=>{const p=seg(f,T_LIGHT+24+j*16,T_LIGHT+36+j*16);
  return `<span class="chip" style="color:${GRN};opacity:${E.oc(cl(p*2))*(1-seg(f,T_S1-10,T_S1-2))};transform:scale(${p<=0?0.5:lerp(0.5,1,E.back(p))})">${i}${t}</span>`}).join(''):'';
 let tapped=false; const T=(a,id)=>{tapped=tapAt(f,a,id)||tapped; press(id,f,a)};
 page('m_boot',T_LIGHT-4,T_S1+6,f);
 if(page('m_car',T_S1,T_SAVE1+14,f)){
  $('c_nmv').innerHTML=f<T_NAME[0]?'':typ('۲۰۷ تیپ ۵',...T_NAME,f)+caret(f,...T_NAME); $('c_nm').className='fld'+(f>=T_NAME[0]-2&&f<T_FILL?' on':'');
  [['c_brv','پژو'],['c_mdv','۲۰۷'],['c_yrv','۱۳۹۸']].forEach(([id,v],i)=>{const p=seg(f,T_FILL+i*5,T_FILL+i*5+6); $(id).textContent=p>0?v:''; $(id).style.opacity=p;});
  $('c_kmv').innerHTML=f<T_KM[0]?'':kmf(+typ('25000',...T_KM,f)||0).replace(/^۰$/,'')+caret(f,...T_KM); $('c_km').className='fld'+(f>=T_KM[0]-2&&f<T_SAVE1?' on':'');
  T(T_SAVE1,'c_sv');}
 if(page('m_svc',T_SAVE1+6,99999,f)){
  T(T_ADD,'s_add');
  // the dialog: pick «تسمه تایم», every 60,000 km, save
  const dg=f>=T_DLG&&f<T_SAVE2+10, dp=E.oc(seg(f,T_DLG,T_DLG+10))*(1-seg(f,T_SAVE2+2,T_SAVE2+10)); $('dlg').style.opacity=dg?dp:0; $('d_dim').style.opacity=dg?dp:0;
  $('dlg').style.transform=`scale(${lerp(0.9,1,E.back(seg(f,T_DLG,T_DLG+12)))})`; $('dlg').style.display=dg?'block':'none';
  if(dg){T(T_DROP,'d_ty'); const lo=f>=T_DROP+3&&f<T_PICK+6, lp=E.oc(seg(f,T_DROP+3,T_DROP+11))*(1-seg(f,T_PICK+2,T_PICK+8));
   $('d_list').style.opacity=lo?lp:0; $('d_list').style.transform=`scaleY(${lerp(0.7,1,lp)})`;
   $('d_o2').style.background=f>=T_PICK-14?`rgba(33,150,243,${0.25*seg(f,T_PICK-14,T_PICK-8)})`:'none';
   if(lo) T(T_PICK,'d_o2');
   const picked=f>=T_PICK+4; $('d_tyv').textContent=picked?'تسمه تایم':'انتخاب کن'; $('d_tyv').className=picked?'':'ph';
   $('d_km').textContent=picked?kmf(KM0):''; $('d_inv').innerHTML=f<T_INT[0]?'':kmf(+typ('60000',...T_INT,f)||0).replace(/^۰$/,'')+caret(f,...T_INT);
   $('d_in').className='fld'+(f>=T_INT[0]-2?' on':'');
   const hg=Math.exp(-Math.pow((f-T_INT[1]-8)/7,2)); $('d_hint').style.background=`rgba(33,150,243,${0.18*hg})`;
   T(T_SAVE2,'d_sv');}
  // the cards
  [T_CARD1,T_CARD2].forEach((a,i)=>{const p=seg(f,a,a+12), el=$('s_c'+i); el.style.opacity=E.oc(cl(p*2)); el.style.transform=`translateY(${(1-E.oc(p))*30}px) scale(${p<=0?0.85:lerp(0.85,1,E.back(p))})`;
   const k0=km(f), [txt,bg,c,u]=svcState(i,k0), cp=$('s_cp'+i); cp.textContent=txt; cp.style.background=bg; cp.style.color=c; $('s_br'+i).style.width=(u*100)+'%'; $('s_br'+i).style.background=c;});
  $('s_empty').style.opacity=1-seg(f,T_CARD1-4,T_CARD1+2);
  // GPS on, km counts by itself while driving
  T(T_GPS,'s_tg'); const g=seg(f,T_GPS+2,T_GPS+8), tg=$('s_tg'); tg.style.background=g>0?'#2196F3':'#C9D4E4'; tg.firstChild.style.right=(4+lerp(0,30,E.io(g)))+'px';
  $('s_gi').innerHTML=svg('gps',g>0?'#2196F3':'#6E7D96',26); const gp=f>=T_GPS+8?0.5+0.5*Math.sin(f/5):0; $('s_gpsR').style.background=`rgba(33,150,243,${0.12*gp})`;
  $('s_km').textContent=kmf(Math.round(km(f)/10)*10);
  const np=seg(f,T_NOTI,T_NOTI+12), n=$('noti'); n.style.opacity=E.oc(cl(np*2)); n.style.transform=`translateY(${(1-E.oc(np))*-150}px)`;
  $('n_bell').style.transform=`rotate(${f>=T_NOTI?Math.sin((f-T_NOTI)/2.2)*16*Math.exp(-((f-T_NOTI)%60)/20):0}deg)`;
 }
 if(!tapped) $('tap').style.opacity=0;
}

/* ---------- comment CTA ---------- */
$('sheet').innerHTML=`<div style="font-weight:800;font-size:40px;text-align:center;padding-bottom:20px;border-bottom:2px solid #EEF2F8">کامنت‌ها</div>
 ${[0,1].map(i=>`<div class="cm"><span class="av" style="background:#E3EFFC"></span><div style="flex:1"><div class="ln" style="width:${[40,30][i]}%"></div><div class="ln" style="width:${[80,60][i]}%;margin-top:12px;background:#EEF2F8"></div></div></div>`).join('')}
 <div class="cm" id="cmMe" style="opacity:0"><span class="av" style="background:linear-gradient(135deg,#78CDFF,#2196F3)"></span><div><div style="font-weight:700;font-size:28px;color:#6E7D96">شما</div><div style="font-weight:900;font-size:46px">کاردیاگ</div></div></div>
 <div id="cmRe" style="opacity:0;margin-top:18px;display:flex;gap:18px;align-items:flex-start"><span class="av" style="background:#2196F3;display:flex;align-items:center;justify-content:center">${LOGO(56,'#fff',6)}</span>
  <div style="background:#E3EFFC;border-radius:28px;padding:22px 30px"><div class="ltr" style="font-weight:800;font-size:26px;color:#1565C0;text-align:right">@cardiagai</div>
   <div style="font-weight:800;font-size:38px;color:#10203C;margin-top:4px">لینک دانلود رو برات فرستادیم ✓</div></div></div>
 <div style="position:absolute;left:44px;right:44px;bottom:34px;display:flex;align-items:center;gap:16px">
  <span class="av" style="width:64px;height:64px;background:linear-gradient(135deg,#78CDFF,#2196F3)"></span>
  <div id="cmIn" style="flex:1;height:86px;border:3px solid #DEE6F2;border-radius:43px;display:flex;align-items:center;padding:0 30px;font-weight:700;font-size:36px"></div>
  <span id="cmSend" style="width:86px;height:86px;border-radius:50%;background:#2196F3;display:flex;align-items:center;justify-content:center">${svg('send','#fff',44)}</span></div>`;
function cta(f){const L0=$('ctaL'), on=f>=T_CTA-4&&f<T_END+8; L0.style.display=on?'block':'none'; if(!on) return;
 const p=seg(f,T_CTA-4,T_CTA+10); L0.style.opacity=E.oc(cl(p*2))*(1-seg(f,T_END,T_END+8)); $('sheet').style.transform=`translateY(${(1-E.oc(p))*300}px)`;
 const A=T_CTA+16, B=T_CTA+44, S=T_CTA+54; $('cmIn').innerHTML=f<A?'<span style="color:#98A3B8;font-weight:500">یه کامنت بنویس...</span>':(f<S?typ('کاردیاگ',A,B,f)+caret(f,A,B):'<span style="color:#98A3B8;font-weight:500">یه کامنت بنویس...</span>');
 $('cmIn').style.borderColor=f>=A&&f<S?'#2196F3':'#DEE6F2'; $('cmSend').style.transform=`scale(${1-0.12*Math.exp(-Math.pow((f-S)/3,2))})`;
 const m=seg(f,S+2,S+10); $('cmMe').style.opacity=E.oc(m); $('cmMe').style.transform=`translateY(${(1-E.oc(m))*40}px)`;
 const r=seg(f,S+16,S+26); $('cmRe').style.opacity=E.oc(r); $('cmRe').style.transform=`translateY(${(1-E.oc(r))*40}px) scale(${r<=0?0.8:lerp(0.8,1,E.back(r))})`;}

/* ---------- end card (free feature: no purchase line) ---------- */
$('endL').innerHTML=`<div id="eBloom" class="a" style="left:190px;top:420px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(40,160,255,.28) 0%,rgba(40,160,255,0) 68%)"></div>
 <div id="eLogo" class="a" style="left:220px;top:580px">${LOGO(640,'#2196F3',7)}</div>
 <div id="eName" class="a ltr" style="left:0;top:860px;width:1080px;text-align:center;font-weight:900;font-size:126px;color:#1565C0">CarDiag AI</div>
 <div id="eCm" class="a" style="left:0;top:1080px;width:1080px;text-align:center"><span class="chip" style="background:#E3EFFC;color:#1565C0;box-shadow:none">${svg('send','#1565C0',44)}کامنت کن: «کاردیاگ»</span></div>
 <div id="eFree" class="a" style="left:0;top:1210px;width:1080px;text-align:center"><span class="chip" style="background:#DEF6E6;color:${GRN};box-shadow:none">${svg('check',GRN,44)}رایگان، بدون دیاگ</span></div>
 <div id="eUrl" class="a ltr" style="left:0;top:1360px;width:1080px;text-align:center;font-weight:700;font-size:60px;color:#506482">cardiag.ir</div>
 <div id="eH" class="a ltr" style="left:0;top:1460px;width:1080px;text-align:center;font-weight:800;font-size:48px;color:#1565C0">@cardiagai</div>`;
const EB=[[F_HIT-33.75,.6],[F_HIT-16.875,.6],[F_HIT,1]];
function endc(f){const L0=$('endL'), on=f>=T_END; L0.style.display=on?'block':'none'; if(!on) return;
 const beat=EB.reduce((a,[b,m])=>a+m*Math.exp(-Math.pow((f-b)/(m<1?5:4),2)),0);
 const lg=$('eLogo').querySelectorAll('.lg'); lg.forEach((p,i)=>{const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L*(1-E.io(seg(f,T_END+4+i*3,T_END+30+i*3)));});
 $('eLogo').style.transform=`scale(${1+0.05*beat})`; $('eBloom').style.opacity=0.5+0.5*beat;
 [['eName',30],['eCm',44],['eFree',56],['eUrl',68],['eH',76]].forEach(([id,d])=>{const p=seg(f,T_END+d,T_END+d+12), el=$(id); el.style.opacity=E.oc(cl(p*2)); el.style.transform=`translateY(${(1-E.oc(p))*30}px)`;});}

/* ---------- titles ---------- */
const TT=[
 {w:['تسمه','تایم','<b>پاره</b>','<b>شد!</b>'],a:T_DARK+4,b:T_REMIX-8,dk:1,top:720},
 {w:['فقط','چون','<b>یادت</b>','<b>رفت</b>'],a:T_REMIX-4,b:T_LIGHT-8,dk:1,top:720},
 {w:['مانیتور','ماشینت','<b>یادت</b>','میاره'],a:T_LIGHT+2,b:T_S1-6,s:74,pl:1},
 {w:['۱.','ماشینت','رو','<b>تعریف</b>','کن'],a:T_S1-2,b:T_S2-6,s:74,pl:1},
 {w:['۲.','سرویس‌هات','رو','<b>اضافه</b>','کن'],a:T_S2-2,b:T_S3-6,s:70,pl:1},
 {w:['۳.','خودش','<b>کیلومتر</b>','میندازه'],a:T_S3-2,b:T_S4-6,s:74,pl:1},
 {w:['به','<b>موقع</b>','خبرت','می‌کنه'],a:T_S4-2,b:T_S5-6,s:74,pl:1},
 {w:['دیگه','یادت','<b>نمی‌ره</b>'],a:T_S5-2,b:T_CTA-6},
 {w:['<b>«کاردیاگ»</b>','رو','کامنت','کن'],a:T_CTA-2,b:T_END-6},
 {w:['مکانیک','تو','<b>جیبِت</b>!'],a:T_END-2,b:99999},
];
$('titles').innerHTML=TT.map((t,i)=>`<div class="ttl${t.dk?' dk':''}${t.pl?' pl':''}" id="tt${i}" style="top:${t.top||148}px"><div class="h"${t.s?` style="font-size:${t.s}px"`:""}>${t.w.map(w=>`<span class="w"><span>${w}</span></span>`).join(' ')}</div></div>`).join('');
function titles(f){TT.forEach((t,i)=>{const el=$('tt'+i), on=f>=t.a-1&&f<t.b+14; el.style.display=on?'block':'none'; if(!on) return;
 if(t.pl) el.firstChild.style.opacity=E.oc(seg(f,t.a,t.a+8))*(1-seg(f,t.b+2,t.b+10));
 [...el.querySelectorAll('.w>span')].forEach((w,k)=>{const a=t.a+4+k*3, p=seg(f,a,a+12), q=seg(f,t.b-4+k*1.5,t.b+5+k*1.5);
  w.style.transform=`translateY(${(1-E.oc(p))*115-E.ic(q)*115}%)`;});});}

function render(f){belt(f); dark(f); cockpit(f); cta(f); endc(f); titles(f);}
window.READY=document.fonts.ready.then(()=>{beltLayout();render(0);return true});
</script>
