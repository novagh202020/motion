<style>
/* CarDiag product page skin (template 3124 + product 2560). Content lives in normal Elementor widgets;
   this block only styles them, adds the sticky buy bar and the added-to-cart popup. */
.cdp,.cdp-sec,.cdp-bar,.cdp-sheet{--b:#2196F3;--d:#1565C0;--s:#E3EFFC;--n:#10203C;--sl:#6E7D96;--l:#DEE6F2;--bg:#F4F8FD;--g:#22A050;--gt:#DEF6E6;--r:#DC3232;--rt:#FFECEC;--ink:#4B3005;font-family:Vazirmatn,inherit}
.cdp,.cdp-sec{color:var(--n);direction:rtl}
.cdp *,.cdp-sec *{box-sizing:border-box}
.elementor-3124 .cdp.e-con,.elementor-2560 .cdp-sec.e-con{--padding-top:0px;--padding-bottom:0px;--padding-left:0px;--padding-right:0px}
.cdp-wrap{max-width:none;margin:0!important;width:100%}
.cdp-crumbs .woocommerce-breadcrumb{font-size:13px;color:var(--sl);margin:4px 0 10px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdp-crumbs a{color:var(--sl)!important}
/* hero */
.cdp-gal img{box-sizing:border-box;max-width:100%;width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:24px;padding:28px;background:radial-gradient(120% 90% at 50% 30%,#fff 0%,#EAF3FD 60%,#DCEBFB 100%)}
.cdp-gal{position:relative}
.cdp-badge{position:absolute;top:14px;right:14px;z-index:2;background:var(--r);color:#fff;font-weight:800;font-size:14px;padding:4px 12px;border-radius:12px;display:none}
.cdp-title .elementor-heading-title{font-size:21px!important;font-weight:900!important;line-height:1.55!important;color:var(--n)!important;margin:0}
.cdp-model p{margin:0;font-size:14px;color:var(--sl);font-weight:500}
.cdp-stock p{margin:0}
.cdp-stock .in,.cdp-stock .out{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 12px;border-radius:12px}
.cdp-stock .in{color:var(--g);background:var(--gt)}.cdp-stock .out{color:var(--r);background:var(--rt);display:none}
.instock .cdp-stock .out,.outofstock .cdp-stock .in{display:none}.outofstock .cdp-stock .out{display:inline-flex}
.cdp-buybox{background:#fff;border:1px solid var(--l)!important;border-radius:20px;padding:16px!important}
.cdp-prices{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.cdp-old .elementor-heading-title{font-size:14px!important;color:#98A3B8!important;font-weight:500!important;text-decoration:line-through}
.cdp-now .elementor-heading-title{font-size:26px!important;font-weight:900!important;color:var(--n)!important;line-height:1.3!important}
.cdp-now .woocommerce-Price-currencySymbol{font-size:14px;color:var(--sl);font-weight:700}
.cdp-save{font-size:13px;font-weight:700;color:var(--r);background:var(--rt);padding:3px 10px;border-radius:10px;white-space:nowrap;display:none}
.cdp-gift .elementor-icon-box-wrapper{display:flex!important;align-items:center;gap:12px;text-align:right!important;padding:12px 14px;border-radius:16px;background:linear-gradient(90deg,#F6CD5C 0%,#FFEA9C 55%,#F2D27A 100%)}
.cdp-gift .elementor-icon-box-icon{margin:0!important}.cdp-gift .elementor-icon{font-size:28px!important;color:var(--ink)!important;fill:var(--ink)}
.cdp-gift .elementor-icon-box-title{margin:0!important;font-size:15px!important;font-weight:900!important;color:var(--ink)!important;line-height:1.5}
.cdp-gift .elementor-icon-box-description{margin:0!important;font-size:12.5px!important;color:var(--ink)!important;line-height:1.6}
.cdp-cart{display:flex;gap:10px;margin:0}
.cdp-qty{display:flex;align-items:center;border:1px solid var(--l);border-radius:14px;height:52px;overflow:hidden;flex:none}
.cdp-qty button{width:38px;height:100%;border:0;background:var(--bg);font:inherit;font-size:20px;color:var(--n);padding:0}
.cdp-qty input{width:40px;height:100%;border:0!important;text-align:center;font:inherit;font-weight:800;font-size:16px;color:var(--n);background:#fff;padding:0!important;-moz-appearance:textfield}
.cdp-qty input::-webkit-inner-spin-button{display:none}
.cdp-btn{flex:1;height:52px;border:0;border-radius:14px;background:var(--b);color:#fff!important;font:inherit;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 18px rgba(33,150,243,.28);cursor:pointer;text-decoration:none!important;padding:0 16px}
.cdp-btn:hover{background:var(--d)}.cdp-btn[disabled]{opacity:.6;cursor:wait}
.cdp-btn.ghost{background:#fff;color:var(--d)!important;border:1.5px solid var(--b);box-shadow:none}
.outofstock .cdp-cart .cdp-btn{background:#98A3B8;pointer-events:none;box-shadow:none}
.cdp-trust .elementor-icon-list-items{display:grid!important;grid-template-columns:1fr 1fr;gap:8px;margin:0!important;padding:0!important}
.cdp-trust .elementor-icon-list-item{margin:0!important;padding:10px!important;background:var(--bg);border-radius:14px;align-items:center!important}
.cdp-trust .elementor-icon-list-item::after{display:none!important}
.cdp-trust .elementor-icon-list-text{font-size:12.5px!important;font-weight:700!important;color:var(--n)!important;line-height:1.5!important;padding-right:8px!important}
.cdp-trust .elementor-icon-list-icon i,.cdp-trust .elementor-icon-list-icon svg{color:var(--b)!important;fill:var(--b)!important;font-size:18px!important}
.cdp-fit a{text-decoration:none}
.cdp-fit .elementor-icon-box-wrapper{display:flex!important;align-items:center;gap:12px;text-align:right!important;padding:14px;border-radius:20px;background:var(--n)}
.cdp-fit .elementor-icon-box-icon{margin:0!important}.cdp-fit .elementor-icon{font-size:26px!important;color:#78CDFF!important}
.cdp-fit .elementor-icon-box-title,.cdp-fit .elementor-icon-box-title a{margin:0!important;font-size:15px!important;font-weight:800!important;color:#fff!important}
.cdp-fit .elementor-icon-box-description{margin:0!important;font-size:12.5px!important;color:#C9D6EA!important}
.cdp-lead p{font-size:14.5px;line-height:1.95;color:#33415C;margin:0}
/* section chips */
.cdp-snav{position:sticky;top:0;z-index:20;background:rgba(251,252,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--l);margin-top:20px!important}
.cdp-snav .elementor-icon-list-items{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto;gap:6px;padding:10px 0!important;margin:0!important;scrollbar-width:none}
.cdp-snav .elementor-icon-list-items::-webkit-scrollbar{display:none}
.cdp-snav .elementor-icon-list-item{margin:0!important;padding:0!important}.cdp-snav .elementor-icon-list-item::after{display:none!important}
.cdp-snav .elementor-icon-list-icon{display:none!important}
.cdp-snav a{display:block!important;white-space:nowrap;font-size:13.5px;font-weight:700;color:var(--sl)!important;padding:6px 14px;border-radius:12px;background:#fff;border:1px solid var(--l)}
.cdp-snav a.on{color:var(--d)!important;border-color:var(--b);background:var(--s)}
.cdp-snav .elementor-icon-list-text{color:inherit!important;padding:0!important}
/* content sections (product 2560) */
.cdp-body{max-width:none;margin:0!important}
.cdp-sec .elementor-widget-text-editor p{max-width:75ch}
.cdp-sec{padding:28px 0 4px!important;scroll-margin-top:64px}
.cdp-sec h2.elementor-heading-title{font-size:19px!important;font-weight:900!important;line-height:1.5!important;color:var(--n)!important;margin:0 0 6px}
.cdp-sec h2 span{color:var(--b)}
.cdp-sec .elementor-widget-text-editor{font-size:14px;line-height:1.95;color:#33415C}
.cdp-sec .elementor-widget-text-editor p:last-child{margin-bottom:0}
.cdp-show{align-items:center!important}
.cdp-show .elementor-widget-image img{width:120px;border-radius:20px;box-shadow:0 14px 30px rgba(20,40,80,.16)}
.cdp-feat .elementor-icon-box-wrapper,.cdp-tiles .elementor-icon-box-wrapper{display:flex!important;gap:10px;text-align:right!important;align-items:flex-start}
.cdp-feat .elementor-icon-box-icon,.cdp-tiles .elementor-icon-box-icon{margin:0!important}
.cdp-feat .elementor-icon,.cdp-tiles .elementor-icon{width:40px;height:40px;border-radius:12px;background:var(--s);color:var(--b)!important;font-size:18px!important;display:flex!important;align-items:center;justify-content:center;padding:0!important}
.cdp-feat .elementor-icon-box-title,.cdp-tiles .elementor-icon-box-title{margin:0!important;font-size:14.5px!important;font-weight:800!important;color:var(--n)!important;line-height:1.6}
.cdp-feat .elementor-icon-box-description,.cdp-tiles .elementor-icon-box-description{margin:0!important;font-size:13px!important;color:var(--sl)!important;line-height:1.7}
.cdp-tiles{display:grid!important;grid-template-columns:1fr 1fr;gap:10px}
.cdp-tiles>.elementor-widget{background:#fff;border:1px solid var(--l);border-radius:18px;padding:14px;margin:0!important;width:auto!important}
.cdp-tiles .elementor-icon-box-wrapper{flex-direction:column}
.cdp-video{border-radius:20px;overflow:hidden;background:#EAF3FD}
ol.cdp-steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.cdp-steps li{position:relative;padding:0 52px 20px 0;margin:0}
ol.cdp-steps li::before{counter-increment:s;content:counter(s,persian);position:absolute;right:0;top:0;width:38px;height:38px;border-radius:50%;background:var(--b);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:16px}
ol.cdp-steps li::after{content:"";position:absolute;right:18px;top:42px;bottom:4px;width:2px;background:var(--l)}
ol.cdp-steps li:last-child::after{display:none}
ol.cdp-steps b{display:block;font-size:15px;color:var(--n);line-height:2.4}
table.cdp-vs,table.cdp-spec{width:100%;border-collapse:separate;border-spacing:0 8px;margin:0;font-size:12.5px;table-layout:fixed}
table.cdp-vs th{font-size:12.5px;font-weight:800;color:var(--sl);text-align:center;padding:0 4px;border:0;background:none}
table.cdp-vs th:last-child{color:var(--d)}
table.cdp-vs td{background:#fff;border:1px solid var(--l);border-width:1px 0;padding:10px 6px;text-align:center;color:var(--sl);line-height:1.5;vertical-align:middle}
table.cdp-vs td:first-child{border-right-width:1px;border-radius:0 16px 16px 0;text-align:right;font-weight:800;color:var(--n);padding-right:12px}
table.cdp-vs td:last-child{border-left-width:1px;border-radius:16px 0 0 16px;padding-left:10px}
table.cdp-vs td:last-child span{display:inline-block;color:var(--g);font-weight:800;background:var(--gt);border-radius:10px;padding:4px 8px}
table.cdp-spec{border-spacing:0;background:#fff;border:1px solid var(--l);border-radius:20px;overflow:hidden;font-size:13.5px}
table.cdp-spec td{padding:12px 16px;border:0;border-bottom:1px solid #EEF2F8;color:var(--n);font-weight:700;text-align:left;vertical-align:top}
table.cdp-spec tr:last-child td{border-bottom:0}
table.cdp-spec td:first-child{color:var(--sl);font-weight:500;text-align:right;width:38%}
.cdp-who .elementor-icon-list-items{background:#fff;border:1px solid var(--l);border-radius:20px;padding:10px 16px!important}
.cdp-who .elementor-icon-list-item{padding:8px 0!important;align-items:flex-start!important}
.cdp-who .elementor-icon-list-text{font-size:14px!important;color:#33415C!important;padding-right:10px!important;line-height:1.8}
.cdp-who .elementor-icon-list-icon i{color:var(--g)!important;margin-top:6px}
.cdp-note p{font-size:13px;color:#33415C;background:var(--s);border-radius:16px;padding:12px 14px;margin:0}
.cdp-acc .elementor-accordion-item{background:#fff;border:1px solid var(--l)!important;border-radius:16px;margin-bottom:8px;overflow:hidden}
.cdp-acc .elementor-tab-title{padding:14px 16px!important;border:0!important;font-weight:800!important;font-size:14.5px!important;color:var(--n)!important;line-height:1.6}
.cdp-acc .elementor-tab-title a{color:var(--n)!important}
.cdp-acc .elementor-tab-title.elementor-active a{color:var(--d)!important}
.cdp-acc .elementor-accordion-icon{color:var(--sl)!important}
.cdp-acc .elementor-tab-content{padding:0 16px 14px!important;border:0!important;font-size:13.5px;color:#33415C;line-height:1.9}
.cdp-acc .elementor-tab-content ul{list-style:none;margin:0;padding:0}
.cdp-acc .elementor-tab-content li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--l)}
.cdp-acc .elementor-tab-content li:first-child{border-top:0}
.cdp-acc .elementor-tab-content li span{font-size:12px;color:var(--sl);text-align:left}
.cdp-final{margin:28px 0 8px!important;border-radius:24px;padding:22px 18px!important;background:linear-gradient(135deg,#1565C0,#2196F3);text-align:center}
.cdp-final .elementor-heading-title{color:#fff!important;font-size:20px!important;font-weight:900!important}
.cdp-final p{color:#DCEBFB;font-size:14px;margin:0}
.cdp-final .elementor-button{width:100%;background:#fff!important;color:var(--d)!important;border-radius:14px!important;font-weight:800!important;font-size:16px!important;padding:15px!important}
/* nothing inside the product page may be wider than the phone screen (a wider element makes mobile Chrome zoom the whole page out) */
.elementor-3124,.elementor-2560{max-width:100%;overflow-x:clip}
.elementor-3124 .e-con,.elementor-3124 .elementor-widget,.elementor-3124 .elementor-widget-container,.elementor-2560 .e-con,.elementor-2560 .elementor-widget,.elementor-2560 .elementor-widget-container{min-width:0!important;max-width:100%}
.elementor-3124 img,.elementor-3124 iframe,.elementor-3124 video,.elementor-3124 table,.elementor-2560 img,.elementor-2560 iframe,.elementor-2560 video,.elementor-2560 table{max-width:100%!important;min-width:0!important}
.elementor-3124 table,.elementor-2560 table{width:100%!important;table-layout:fixed!important}
.cdp-sec td,.cdp-sec th,.cdp-acc .elementor-tab-title{overflow-wrap:anywhere}
.cdp-debug{position:fixed!important;left:8px;right:8px;top:8px;z-index:2147483647;background:#10203C;color:#fff;font:600 12px/1.6 monospace;direction:ltr;text-align:left;padding:10px 12px;border-radius:12px;white-space:pre-wrap;max-height:60vh;overflow:auto}
/* sticky buy bar + popup: unique class names so theme rules for generic classes (.box, .item, .close…) can't touch them */
.cdp-bar{position:fixed!important;left:0;right:0;bottom:0;top:auto;z-index:2147483000;background:#fff;border-top:1px solid var(--l);box-shadow:0 -8px 24px rgba(20,40,80,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;direction:rtl;margin:0;transform:none}
.cdp-bar[hidden]{display:none!important}
.cdp-bar-p{line-height:1.3;color:var(--n)}.cdp-bar-p del{display:block;font-size:12px;color:#98A3B8}.cdp-bar-p b{font-size:17px;font-weight:900}
.single-product{padding-bottom:84px}
.cdp-sheet{position:fixed!important;top:0;right:0;bottom:0;left:0;z-index:2147483600;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;direction:rtl;margin:0;padding:0;transform:none;float:none}
.cdp-sheet.open{visibility:visible}
.cdp-sh-dim{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(16,32,60,.45);opacity:0;transition:opacity .2s}
.cdp-sheet.open .cdp-sh-dim{opacity:1}
.cdp-sh-box{position:relative;float:none;top:auto;left:auto;margin:0;width:100%;max-width:480px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;box-sizing:border-box;background:#fff;color:var(--n);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:grid;gap:14px;box-shadow:0 -10px 40px rgba(20,40,80,.18);text-align:right}
.cdp-sheet.open .cdp-sh-box{transform:none}
.cdp-sh-grab{width:44px;height:5px;border-radius:3px;background:var(--l);margin:0 auto 2px}
.cdp-sh-ok{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;color:var(--g);padding-left:44px}
.cdp-sh-ok i{width:30px;height:30px;border-radius:50%;background:var(--gt);display:flex;align-items:center;justify-content:center;font-style:normal;flex:none}
.cdp-sh-item{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:10px;margin:0}
.cdp-sh-item img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:12px;padding:6px;flex:none}
.cdp-sh-item b{display:block;font-size:14px;font-weight:800;line-height:1.6}.cdp-sh-item span{font-size:13px;color:var(--sl)}
.cdp-sh-gift{font-size:13px;font-weight:700;color:var(--ink);background:#FFF4D1;border-radius:12px;padding:8px 12px}
.cdp-sh-sum{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sl)}.cdp-sh-sum b{font-size:18px;font-weight:900;color:var(--n)}
.cdp-sh-acts{display:grid;gap:8px}.cdp-sh-acts .cdp-btn{flex:none;width:100%}
.cdp-sh-close{position:absolute;top:12px;left:12px;right:auto;width:36px;height:36px;border:0;border-radius:50%;background:var(--bg);color:var(--sl);font-size:20px;line-height:1;padding:0;margin:0;opacity:1;float:none}
.cdp-btn:focus-visible,.cdp-sh-close:focus-visible,.cdp-qty button:focus-visible{outline:3px solid #78CDFF;outline-offset:2px}
@media (min-width:768px){
 .cdp-title .elementor-heading-title{font-size:28px!important}
 .cdp-sec h2.elementor-heading-title{font-size:24px!important}
 .cdp-tiles{grid-template-columns:repeat(4,1fr)}
 .cdp-trust .elementor-icon-list-items{grid-template-columns:repeat(4,1fr)}
 .cdp-show .elementor-widget-image img{width:200px}
 table.cdp-vs,table.cdp-vs th{font-size:14px}
 .cdp-sheet{align-items:center}.cdp-sh-box{border-radius:24px;padding:22px 24px;transform:translateY(24px) scale(.96);opacity:0;transition:transform .2s,opacity .2s}
 .cdp-sheet.open .cdp-sh-box{opacity:1;transform:none}.cdp-sh-grab{display:none}
}
@media (min-width:1025px){
 .cdp-trust .elementor-icon-list-items{grid-template-columns:1fr 1fr}
 .cdp-gal{position:sticky!important;top:20px;align-self:flex-start}
 .cdp-bar{display:none}.single-product{padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){.cdp-sh-box,.cdp-sh-dim{transition:none}}
</style>
<div class="cdp-bar" id="cdp-bar" hidden><div class="cdp-bar-p"><del id="cdp-bar-old"></del><b id="cdp-bar-now"></b></div><button type="button" class="cdp-btn" data-cdp-add>افزودن به سبد</button></div>

 <div class="cdp-sh-dim" data-close></div>

  </div>
 </div>

<script>
(function(){
 function ready(f){document.readyState!=='loading'?f():document.addEventListener('DOMContentLoaded',f)}
 ready(function(){
  // #cdpdebug in the URL: list elements wider than the screen (for diagnosing mobile zoom-out)
  if(location.hash==='#cdpdebug'){setTimeout(function(){var W=document.documentElement.clientWidth,rows=['viewport '+W+' / page '+document.documentElement.scrollWidth+' / screen '+screen.width];
   var bad=[];[].forEach.call(document.querySelectorAll('body *'),function(e){var r=e.getBoundingClientRect();if(!r.width||e.closest('#cdp-sheet,#cdp-bar,.cdp-debug')||getComputedStyle(e).position==='fixed')return;if(r.left<-1||r.right>W+1)bad.push({e:e,r:r})});
   bad.filter(function(b){return !bad.some(function(o){return o.e!==b.e&&b.e.contains(o.e)})}).sort(function(a,b){return b.r.right-a.r.right}).forEach(function(b){var e=b.e;rows.push(e.tagName.toLowerCase()+'.'+String(e.className).trim().split(/\s+/).slice(0,4).join('.')+(e.id?'#'+e.id:'')+'  L'+Math.round(b.r.left)+' R'+Math.round(b.r.right))});
   var d=document.createElement('div');d.className='cdp-debug';d.textContent=rows.slice(0,12).join('\n');document.body.appendChild(d)},1500)}
  var form=document.querySelector('.cdp-cart'); if(!form) return;
  ['cdp-bar','cdp-sheet'].forEach(function(id){document.body.appendChild(document.getElementById(id))});
  var w=document.querySelector('.elementor-location-single[class*="post-"]'), m=document.body.className.match(/postid-(\d+)/)||(w&&w.className.match(/\bpost-(\d+)\b/)), pid=m?m[1]:'';
  form.querySelector('[name=add-to-cart]').value=pid;
  var qty=form.querySelector('input[name=quantity]');
  var digits=function(t){return (t||'').replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})};
  var num=function(t){return parseInt(digits(t).replace(/[^\d]/g,''),10)||0};
  var fmt=function(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' تومان'};
  var nowEl=document.querySelector('.cdp-now .elementor-heading-title'), oldEl=document.querySelector('.cdp-old .elementor-heading-title');
  var now=num(nowEl&&nowEl.textContent), old=num(oldEl&&oldEl.textContent);
  if(!old||old<=now){var o=document.querySelector('.cdp-old');if(o)o.style.display='none'}
  else{var pct=Math.round((old-now)/old*100);
   document.querySelectorAll('.cdp-save').forEach(function(e){e.textContent=pct+'٪ تخفیف';e.style.display='inline-block'});
   var bg=document.querySelector('.cdp-badge'); if(bg){bg.textContent=pct+'٪ تخفیف';bg.style.display='block'}
   document.getElementById('cdp-bar-old').textContent=fmt(old)}
  document.getElementById('cdp-bar-now').textContent=fmt(now);
  var bar=document.getElementById('cdp-bar'); bar.hidden=false;
  form.querySelectorAll('[data-q]').forEach(function(b){b.addEventListener('click',function(){
   var v=Math.min(99,Math.max(1,(parseInt(digits(qty.value),10)||1)+(+b.getAttribute('data-q'))));qty.value=v})});
  var sh=document.getElementById('cdp-sheet'),last=null,btn=form.querySelector('.cdp-btn');
  var title=document.querySelector('.cdp-title .elementor-heading-title'), img=document.querySelector('.cdp-gal img');
  function open(q){document.getElementById('cdp-sheet-name').textContent=title?title.textContent.trim():'';
   if(img){document.getElementById('cdp-sheet-img').src=img.currentSrc||img.src}
   document.getElementById('cdp-sheet-q').textContent=q+' عدد';document.getElementById('cdp-sheet-sum').textContent=fmt(now*q);
   sh.classList.add('open');sh.setAttribute('aria-hidden','false');document.documentElement.style.overflow='hidden';
   setTimeout(function(){document.getElementById('cdp-checkout').focus()},60)}
  function close(){sh.classList.remove('open');sh.setAttribute('aria-hidden','true');document.documentElement.style.overflow='';if(last)last.focus()}
  sh.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',close)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sh.classList.contains('open'))close()});
  var p=window.wc_add_to_cart_params, url=p&&p.wc_ajax_url?p.wc_ajax_url.toString().replace('%%endpoint%%','add_to_cart'):'/?wc-ajax=add_to_cart';
  if(p&&p.cart_url){document.getElementById('cdp-checkout').href=p.cart_url.replace(/cart\/?$/,'checkout/')}
  form.addEventListener('submit',function(e){
   if(!window.fetch||!pid) return;                       // no JS support: normal WooCommerce form post
   e.preventDefault(); last=document.activeElement; var q=parseInt(digits(qty.value),10)||1;
   btn.disabled=true; var fd=new FormData(); fd.append('product_id',pid); fd.append('quantity',q);
   fetch(url,{method:'POST',body:fd,credentials:'same-origin'}).then(function(r){return r.json()}).then(function(r){
    if(!r||r.error){window.location=(r&&r.product_url)||location.href;return}
    if(window.jQuery)jQuery(document.body).trigger('wc_fragment_refresh');   // update mini-carts without auto-opening the fly cart
    open(q)}).catch(function(){form.submit()}).then(function(){btn.disabled=false});
  });
  bar.querySelector('[data-cdp-add]').addEventListener('click',function(){last=this;if(form.requestSubmit)form.requestSubmit();else btn.click()});
  var links=[].slice.call(document.querySelectorAll('.cdp-snav a'));
  if('IntersectionObserver' in window&&links.length){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;
   links.forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id)})})},{rootMargin:'-45% 0px -50% 0px'});
   links.forEach(function(a){var t=document.getElementById((a.getAttribute('href')||'').slice(1));if(t)io.observe(t)})}
 });
})();
</script>
