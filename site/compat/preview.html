  });
}
function grid(items,fn,cls){ var g=el('div','grid'+(cls?' '+cls:'')); items.forEach(function(x){ g.appendChild(opt(esc(fa(x)),function(){fn(x)})); }); return g; }
function render(){
  setCrumbs(); body.innerHTML=''; body.className='card body';
  if(!S.t){ step(1); body.appendChild(el('p','q','خودروت ایرانیه یا خارجی؟'));
    var two=el('div','two');
    two.appendChild(opt('ایرانی<small>ایران‌خودرو، سایپا، …</small>',function(){S.t='ir';render()},'big'));
    two.appendChild(opt('خارجی<small>چینی، کره‌ای، ژاپنی، …</small>',function(){S.t='fx';render()},'big'));
    body.appendChild(two); return; }
  if(!S.m){ step(2); body.appendChild(el('p','q','برند خودرو'));
    body.appendChild(grid(Object.keys(LIST[S.t]),function(x){S.m=x;render()})); return; }
  var names=LIST[S.t][S.m], g;
  if(!S.n && FAM[S.m] && !S.f){ step(3); body.appendChild(el('p','q','مدل خودرو'));
    var fams=[]; names.forEach(function(n){ var f=famOf(S.m,n); if(fams.indexOf(f)<0) fams.push(f); });
    body.appendChild(grid(fams,function(f){ S.f=f; var v=names.filter(function(n){return famOf(S.m,n)==f});
      if(v.length==1){ S.n=v[0]; if(M[S.n].r=='x') S.y='-'; } render(); })); return; }
  if(!S.n){ step(3); body.appendChild(el('p','q',S.f?'تیپ خودرو':'مدل خودرو'));
    if(S.f) names=names.filter(function(n){return famOf(S.m,n)==S.f});
    if(names.length>10){ var f=el('input','find'); f.type='search'; f.placeholder='جستجوی مدل…'; body.appendChild(f);
      f.oninput=function(){ var q=en(f.value.trim()).toLowerCase(); g.querySelectorAll('button').forEach(function(b,i){ b.style.display=en(names[i]).toLowerCase().indexOf(q)>-1?'':'none'; }); }; }
    g=grid(names,function(x){S.n=x; if(M[x].r=='x') S.y='-'; render()}); body.appendChild(g); return; }
  if(!S.y){ step(4); body.appendChild(el('p','q','سال ساخت'));
    var c=M[S.n], ys={}, y; for(y=c.y[0];y<=c.y[1];y++) ys[y]=1; Object.keys(OK[S.n]||{}).forEach(function(k){ys[k]=1});
    body.appendChild(grid(Object.keys(ys).map(Number).sort(function(a,b){return b-a}),function(x){S.y=x;render()},'y')); return; }
  step(4); result();
}
var ICO={ok:'<path d="M9 21l7 7 15-16"/>',maybe:'<path d="M20 18v12M20 11v.5"/>',low:'<path d="M20 10v13M20 29v.5"/>',no:'<path d="M12 12l16 16M28 12L12 28"/>'};
function result(){
  var c=M[S.n], tested=S.y!='-' && OK[S.n] && OK[S.n][S.y], car=esc(fa(S.n))+(S.y!='-'?' · '+fa(S.y):''), k,t,p;
  var RET='اگه وصل نشد، طبق <a href="/terms/">مقررات سایت</a> تا یک هفته فرصت مرجوعی داری.';
  if(c.r=='x'){ k='no'; t='با این خودرو کار نمی‌کنه'; p='کاردیاگ با این خودرو سازگار نیست.'; }
  else if(tested){ k='ok'; t='تست شده و وصل شده'; p='این برند و مدل خودرو قبلاً با کاردیاگ تست شده و اتصال موفق داشته.'; }
  else if(c.r=='f'){ k='ok'; t='سازگاره'; p='کاردیاگ از خودروهای چینی و خارجی پشتیبانی می‌کنه.'; }
  else if(c.r=='p'){ k='low'; t='نرخ اتصال پراید پایینه'; p='این مدل و سال هنوز تست نشده. می‌تونی تستش کنی؛ '+RET; }
  else { k='maybe'; t='هنوز تست نشده'; p='این مدل هنوز تست نشده ولی به احتمال زیاد وصل می‌شه. '+RET; }
  body.className='card body res '+k;
  body.innerHTML='<div class="ic"><svg viewBox="0 0 40 40">'+ICO[k]+'</svg></div><h2>'+t+'</h2><span class="car">'+car+'</span><p>'+p+'</p>';
  var a=el('div','acts');
  if(k!='no'){ var b=el('a','btn','خرید کاردیاگ'); b.href=root.getAttribute('data-buy'); a.appendChild(b); }
  a.appendChild(opt('بررسی یه خودروی دیگه',function(){S={};render()},'ghost'));
  body.appendChild(a);
}

render();
var url=root.getAttribute('data-csv');
if(url) fetch(url,{cache:'no-cache'}).then(function(r){return r.ok?r.text():''}).then(function(t){ if(t){ loadSheet(t); if(S.y) render(); } }).catch(function(){});
})();
</script>
