*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#FBFCFF}
body{font-family:V,sans-serif;color:var(--navy)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,#FBFCFF 0%,#ECF3FC 100%)}
.a{position:absolute}.ltr{direction:ltr;unicode-bidi:isolate}.rtl{direction:rtl}
.L{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}

.plan .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-weight:800;font-size:23px}
.plan .bd{padding:16px 20px 18px;font-weight:600;font-size:19px;color:#33415C}
.tag{font-weight:700;font-size:15px;padding:4px 12px;border-radius:6px}

.chip .ic{width:52px;height:52px;border-radius:50%;background:#E3EFFC;display:flex;align-items:center;justify-content:center}
.it{position:absolute;right:50px;width:490px;height:124px;display:flex;align-items:center;gap:18px;padding:0 22px;direction:rtl}
.it .ib{width:76px;height:76px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none}
.it .t{font-weight:800;font-size:31px;white-space:nowrap}

.it .cn{position:absolute;left:18px;top:50%;margin-top:-30px}
.coin{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#78CDFF,#2196F3 55%,#1565C0);border:4px solid #fff;box-shadow:0 6px 14px rgba(20,40,80,.25);display:flex;align-items:center;justify-content:center}
.hdr{position:absolute;right:50px;width:490px;height:72px;border-radius:36px;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:900;font-size:32px;white-space:nowrap;direction:rtl}
.ck{display:flex;align-items:center;gap:26px;height:126px;padding:0 10px;font-weight:800;font-size:44px;color:var(--navy);white-space:nowrap}
.ck+.ck{border-top:2px solid #EEF2F8}
.ck .c{width:72px;height:72px;border-radius:50%;background:var(--greenT);display:flex;align-items:center;justify-content:center;flex:none}

let F=0;
function layer(id,a,b){const el=$(id); if(F<a||F>=b){el.style.display='none';return 0} el.style.display='block'; return 1}
const pop=(el,p,dy=40,s0=0.85)=>{el.style.opacity=E.oc(cl(p*2)); el.style.transform=`translateY(${(1-E.oc(p))*dy}px) scale(${p<=0?s0:lerp(s0,1,E.back(p))})`};
const kick=f=>KICK.reduce((a,k)=>a+Math.exp(-Math.pow((f-k)/4,2)),0);

function sCase(f){ if(!layer('sCase',0,T_DIAG+20)) return;
 const c=$('case'), pin=seg(f,8,30), out=seg(f,150,176);
 c.style.opacity=E.oc(seg(f,8,16))*(1-out); c.style.transform=`translateY(${(1-E.oc(pin))*80+E.ic(out)*120}px) scale(${(pin<=0?0.7:lerp(0.7,1,E.back(pin)))*(1+0.02*kick(f))})`;
 $('cBloom').style.opacity=0.8*seg(f,20,50)*(1-out);
 // zip runs round the case on the beats, then the lid flips up
 const zp=$('zpath'), L=zp.getTotalLength(), z=E.io(seg(f,38,104)), pt=zp.getPointAtLength(z*L*0.96);
 $('pull').setAttribute('transform',`translate(${pt.x} ${pt.y})`);
 const zo=$('zopen'); zo.style.strokeDasharray=`${z*L*0.96} ${L}`;
 const lid=$('lid'), lo=E.io(seg(f,104,124)); lid.style.transform=`perspective(1400px) rotateX(${lo*86}deg) translateY(${-lo*20}px)`; lid.style.opacity=1-seg(f,118,126);
 // items lift out: the diag goes to the hero spot, the card slides away (it comes back in part 2)
 const lift=E.io(seg(f,126,150)); $('inDiag').style.opacity=1-seg(f,140,150);
 $('inCard').style.transform=`translate(${lift*500}px,${-lift*300}px) rotate(${lift*20}deg)`; $('inCard').style.opacity=1-seg(f,140,152);
}
function sDiag(f){ if(!layer('sDiag',126,T_CARD+10)) return;
 const h=$('hero'); const w0=310, w1=600, l=E.io(seg(f,126,156));
 // hero: from the case to centre, gentle float; on bar 5 it drops into the OBD port
 let x=lerp(180+70+155,540,l), y=lerp(740+110+112,880,l), w=lerp(w0,w1,l), r=0;
 y+=Math.sin(f/14)*6*seg(f,156,170);
 const pl=E.io(seg(f,T_PLUG,T_PLUG+22)); x=lerp(x,540,pl); y=lerp(y,1360,pl); w=lerp(w,380,pl); r=lerp(0,0,pl);
 const hit=f>=T_PLUG+22?Math.exp(-(f-T_PLUG-22)/5):0;
 h.style.width=w+'px'; h.style.left=(x-w/2)+'px'; h.style.top=(y-w*0.36)+'px'; h.style.transform=`scale(${1+0.04*hit})`;
 h.style.opacity=1-seg(f,T_CARD-4,T_CARD+6);
 DCH.forEach((c,i)=>{const a=T_DIAG+6+i*2*BEAT, p=seg(f,a,a+12), el=$('dc'+i); pop(el,p,30); el.style.opacity=E.oc(cl(p*2))*(1-seg(f,T_PLUG-8,T_PLUG));});
 $('port').style.opacity=E.oc(seg(f,T_PLUG,T_PLUG+10))*(1-seg(f,T_CARD-4,T_CARD+6));
 let r2=''; if(f>=T_PLUG+24&&f<T_CARD+6){for(let i=0;i<3;i++){const ph=((f-T_PLUG-24)/16+i/3)%1,R=lerp(160,380,ph);

 $('bt').innerHTML=r2;
 const cn=$('conn'), cp=seg(f,T_PLUG+30,T_PLUG+42); pop(cn,cp,20,0.7); cn.style.opacity=E.oc(cl(cp*2))*(1-seg(f,T_CARD-4,T_CARD+4)); cn.style.top='760px';

function sCred(f){ if(!layer('sCred',T_CRED-4,T_PLANS+4)) return;
