<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>CarDiag Wholesale</title>
<style>
@font-face{font-family:V;font-weight:500;src:url(fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:700;src:url(fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(fonts/Vazirmatn-FD-Black.ttf)}
:root{--blue:#2196F3;--deep:#1565C0;--navy:#10203C;--slate:#6E7D96;--url:#506482;--hair:#DEE6F2;--track:#E6EBF2;--device:#181C24;--edge:#5F6878}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#FBFCFF}
body{font-family:V,sans-serif;color:var(--navy)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,#FBFCFF 0%,#ECF3FC 100%)}
.a{position:absolute}.ltr{direction:ltr;unicode-bidi:isolate}.rtl{direction:rtl}
#titles{position:absolute;left:0;top:0;width:1080px;height:400px;z-index:50}
.ttl{position:absolute;left:0;width:1080px;text-align:center;direction:rtl;opacity:0}
.ttl .h{font-weight:900;font-size:86px;line-height:1.15;color:var(--navy);white-space:nowrap;display:inline-block}
.ttl .s{font-weight:500;font-size:40px;color:var(--slate);margin-top:10px;white-space:nowrap}
.card{position:absolute;background:#fff;border:3px solid var(--hair);border-radius:40px;direction:rtl;
 box-shadow:0 30px 60px rgba(20,40,80,.16),0 8px 18px rgba(20,40,80,.08)}
.ic{width:96px;height:96px;border-radius:28px;background:#E3EFFC;display:flex;align-items:center;justify-content:center;flex:none}
#phone{position:absolute;left:0;top:0;width:622px;height:1312px;border-radius:80px;background:var(--device);border:3px solid var(--edge);transform-origin:0 0;
 box-shadow:0 50px 90px rgba(20,40,80,.28),0 12px 26px rgba(20,40,80,.18);z-index:10}
#phone img{position:absolute;left:8px;top:8px;width:600px;height:1290px;border-radius:70px}
.chip{position:absolute;left:90px;width:900px;height:132px;display:flex;align-items:center;gap:30px;padding:0 34px;font-weight:800;font-size:48px;white-space:nowrap}
.tc{position:absolute;width:432px;height:370px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.tc .t1{font-weight:800;font-size:46px;line-height:1.25}
.tc .t2{font-weight:500;font-size:38px;color:var(--slate)}
.gold{display:inline-flex;align-items:center;height:76px;padding:0 30px;border-radius:38px;background:linear-gradient(180deg,#FFEA9C 0%,#F6CD5C 45%,#E0A82C 100%);
 color:#4B3005;font-weight:800;font-size:40px;box-shadow:0 8px 18px rgba(224,168,44,.35)}
.row{display:flex;align-items:center;gap:26px;height:122px;font-weight:800;font-size:48px;white-space:nowrap}
.row+.row{border-top:2px solid #EEF2F8}
.row .k{font-weight:500;color:var(--slate);font-size:40px}
</style>
</head>
<body>
<div id="stage">
 <!-- heartbeat line (scene 1 and end card) -->
 <svg id="pulseSvg" class="a" style="left:0;top:0;z-index:3" width="1080" height="1920">
  <defs><filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter></defs>
  <g id="pulseG">
   <path id="pulseGlow" d="" fill="none" stroke="#78CDFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)" opacity=".55"/>
   <path id="pulse" d="" fill="none" stroke="#2196F3" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
 </svg>

 <!-- bluetooth waves diag -> phone -->
 <svg id="bt" class="a" style="left:0;top:0;z-index:6" width="1080" height="1920"><g id="btG"></g></svg>

 <div id="bloom" class="a" style="width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(40,160,255,.30) 0%,rgba(40,160,255,.10) 42%,rgba(40,160,255,0) 70%);z-index:4"></div>
 <div id="diag" class="a" style="width:908px;height:656px;transform-origin:50% 50%;z-index:8">
  <div style="position:absolute;left:12%;top:84%;width:76%;height:18%;border-radius:50%;background:radial-gradient(ellipse,rgba(20,40,80,.32),rgba(20,40,80,0) 70%)"></div>
  <img src="assets/diag_front.png" style="position:absolute;left:0;top:0;width:100%;height:100%">
 </div>

 <!-- scene 1: sales stat -->
 <div id="stat" class="card" style="left:140px;top:1360px;width:800px;height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:12;opacity:0">
  <div style="display:flex;align-items:baseline;gap:18px"><span id="statN" style="font-weight:900;font-size:70px;color:var(--blue)">+۵٬۰۰۰</span><span style="font-weight:800;font-size:50px">دستگاه فروش</span></div>
  <div style="font-weight:500;font-size:40px;color:var(--slate);margin-top:8px">فقط در ۳ ماه گذشته</div>
 </div>

 <!-- scene 2: phone + feature chips -->
 <div id="phone"><img src="assets/app_home.png"></div>
 <div id="chips"></div>

 <!-- scene 3: trust grid -->
 <div id="trust"></div>

 <!-- scene 4: wholesale price -->
 <div id="price" class="card" style="left:90px;top:540px;width:900px;height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;opacity:0">
  <div style="font-weight:500;font-size:40px;color:var(--slate)">قیمت عمده هر دستگاه</div>
  <div style="display:flex;align-items:baseline;gap:20px;margin-top:14px"><span id="priceN" style="font-weight:900;font-size:70px;color:var(--navy)">۱٬۱۹۰٬۰۰۰</span><span style="font-weight:800;font-size:50px;color:var(--slate)">تومان</span></div>
  <div style="width:640px;height:14px;border-radius:7px;background:var(--track);margin-top:36px;overflow:hidden;direction:ltr"><div id="priceBar" style="height:14px;border-radius:7px;background:var(--blue);width:0"></div></div>
 </div>
 <div id="terms" class="card" style="left:90px;top:1030px;width:900px;padding:14px 44px;z-index:20;opacity:0"></div>

 <!-- end card -->
 <div id="ecBrand" class="a ltr" style="left:0;top:1000px;width:1080px;text-align:center;font-weight:900;font-size:126px;color:var(--deep);opacity:0;z-index:30">CarDiag AI</div>
 <div id="ecSub" class="a rtl" style="left:0;top:1170px;width:1080px;text-align:center;font-weight:900;font-size:74px;color:var(--navy);opacity:0;z-index:30">فروش عمده و همکاری</div>
 <div id="ecTel" class="a" style="left:190px;top:1310px;width:700px;height:120px;border-radius:60px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;gap:22px;opacity:0;z-index:30;box-shadow:0 18px 40px rgba(33,150,243,.35)"></div>
 <div id="ecUrl" class="a ltr" style="left:0;top:1470px;width:1080px;text-align:center;font-weight:700;font-size:60px;color:var(--url);opacity:0;z-index:30">cardiag.ir</div>

 <div id="titles"></div>
</div>

<script>
/* ===== editable ===== */
const PHONE='۰۹۱۲ ۰۰۰ ۰۰۰۰';          // sample number: replace before publishing

const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(f,a,b)=>cl((f-a)/(b-a)), lerp=(a,b,t)=>a+(b-a)*t;
const E={oc:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,ic:t=>t*t*t,back:t=>{const c1=1.55,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}};
const FA='۰۱۲۳۴۵۶۷۸۹', fa=s=>String(s).replace(/[0-9]/g,d=>FA[d]);
const grp=n=>fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'٬'));
const IC={
 warn:'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z',
 wrench:'M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z',
 car:'M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z',
 shield:'M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z',
 undo:'M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z',
 box:'M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4l16-.02V7z',
 cash:'M19 14V6c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zm-9-1c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-6v11c0 1.1-.9 2-2 2H4v-2h17V7h2z',
 phone:'M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z',
 route:'M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z'};
const sv=(p,c='#2196F3',s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${c}" d="${IC[p]}"/></svg>`;

/* ===== music grid (song/song_wh.wav) =====
   bar k downbeat = 67.5k, beat = 16.875. 0-3 groove A, 4-5 groove B, 6 break, 7-8 outro, final hit 607.5 */
const BAR=67.5, BEAT=16.875, B=k=>BAR*k;
const T_APP=B(2), T_CHIP=B(3), T_TRUST=B(4), T_PRICE=B(6), T_TERMS=B(7), T_END=B(8), T_HIT=B(9);
const BEATS=[[0,.5],[B(1),.5],[T_END,.7],[T_END+2*BEAT,.5],[T_HIT,1]];
const beatAt=f=>BEATS.reduce((a,[b,m])=>a+m*Math.exp(-Math.pow((f-b)/(m<1?5:4),2)),0);

const TITLES=[
 {h:'محصولی که خودش فروش می‌ره', s:'دیاگ بلوتوثی کاردیاگ', a:4, b:T_APP-3},
 {h:'دیاگ بلوتوثی + اپ فارسی', s:'عیب‌یاب هوش مصنوعی روی گوشی', a:T_APP+2, b:T_TRUST-3},
 {h:'خیال مشتری‌ات راحته', a:T_TRUST+2, b:T_PRICE-3},
 {h:'قیمت ویژه همکار', s:'برای فروشگاه‌ها و خریداران عمده', a:T_PRICE+2, b:T_END-3},
];
TITLES.forEach((t,i)=>{const d=document.createElement('div');d.className='ttl';d.id='t'+i;
 d.innerHTML=`<div class="h">${t.h}</div>`+(t.s?`<div class="s">${t.s}</div>`:''); d.style.top=(t.s?150:185)+'px'; $('titles').appendChild(d);});
function fitTitles(){document.querySelectorAll('.ttl .h').forEach(h=>{const w=h.scrollWidth;if(w>960)h.style.transform=`scale(${960/w})`;})}

const CHIPS=[['warn','خطایابی <span class="ltr">ECU</span> به فارسی'],['wrench','عیب‌یاب هوش مصنوعی'],['route','گزارش سفر و مانیتورینگ زنده']];
$('chips').innerHTML=CHIPS.map((c,i)=>`<div class="card chip" id="ch${i}" style="top:${1390+i*156}px;z-index:14">
 <span class="ic">${sv(c[0],'#2196F3',54)}</span><span>${c[1]}</span></div>`).join('');

const TRUST=[
 ['shield','۶ ماه گارانتی','تعویض، از طرف شرکت'],
 ['undo','۵ روز مرجوعی','اگه به ماشین وصل نشد'],
 ['car','بیش از ۵۰ مدل','ایرانی، چینی و خارجی'],
 ['gift','','همراه هر دستگاه']];
IC.gift='M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z';
$('trust').innerHTML=TRUST.map((c,i)=>`<div class="card tc" id="tc${i}" style="left:${i%2?90:558}px;top:${720+Math.floor(i/2)*410}px;z-index:14">
 <span class="ic">${sv(c[0],i==3?'#E0A82C':'#2196F3',58)}</span>
 ${i==3?'<span class="gold">اشتراک طلایی هدیه</span>':`<div class="t1">${c[1]}</div>`}<div class="t2">${c[2]}</div></div>`).join('');

$('terms').innerHTML=[['box','حداقل سفارش','۳۰ عدد'],['cash','شرایط پرداخت','نقدی']].map((r,i)=>
 `<div class="row" id="tr${i}"><span class="ic" style="width:80px;height:80px;border-radius:24px">${sv(r[0],'#2196F3',46)}</span><span class="k">${r[1]}</span><span style="margin-right:auto">${r[2]}</span></div>`).join('');
$('ecTel').innerHTML=`${sv('phone','#fff',58)}<span style="font-weight:700;font-size:60px;direction:ltr;unicode-bidi:isolate">${PHONE}</span>`;

/* ===== heartbeat line ===== */
const P1='M-20 1000 L250 1000 L290 1000 L312 960 L332 1000 L360 1000 L392 820 L430 1150 L462 950 L482 1010 L500 1000 L1100 1000';
const P_END='M-20 1700 L360 1700 L390 1700 L410 1670 L430 1700 L456 1700 L486 1600 L516 1790 L544 1660 L560 1715 L576 1700 L1100 1700';
let curP=''; function setPulse(d){if(curP===d)return;curP=d;$('pulse').setAttribute('d',d);$('pulseGlow').setAttribute('d',d)}

/* bluetooth arcs: 3 rings travelling from the diag to the phone */
$('btG').innerHTML=[0,1,2].map(i=>`<path id="bw${i}" d="" fill="none" stroke="#2196F3" stroke-width="10" stroke-linecap="round"/>`).join('');

/* diag + phone keyframes: [frame, cx, cy, width] */
const DK=[[0,540,-500,640],[10,540,-500,640],[26,540,960,640],[T_APP,540,960,640],[T_APP+14,270,900,400],[T_TRUST-4,270,900,400],[T_TRUST+10,270,-600,400],[T_TRUST+11,540,2300,560],
 [T_PRICE-2,540,2300,560],[T_PRICE+16,540,1570,560],[T_END-4,540,1570,560],[T_END+14,540,720,520]];
function key(K,f){let i=0;while(i<K.length-1&&f>K[i+1][0])i++;const A=K[i],Bk=K[Math.min(i+1,K.length-1)];
 const t=Bk[0]===A[0]?1:E.io(seg(f,A[0],Bk[0]));return A.map((v,j)=>j?lerp(v,Bk[j],t):f);}

function render(f){
 TITLES.forEach((t,i)=>{const el=$('t'+i); const pin=E.oc(seg(f,t.a,t.a+9)), pout=E.ic(seg(f,t.b-6,t.b));
  const o=pin*(1-pout); el.style.opacity=o; el.style.transform=`translateY(${(1-pin)*28-pout*14}px)`; el.style.display=o<=0.001?'none':'block';});

 /* pulse */
 const pe=$('pulse'), pg=$('pulseG');
 if(f<T_APP+10){ setPulse(P1); const L=pe.getTotalLength(), d=E.io(seg(f,0,30));
  [pe,$('pulseGlow')].forEach(p=>{p.style.strokeDasharray=L;p.style.strokeDashoffset=L*(1-d)});
  const kick=Math.max(...[0,1,2,3,4,5,6,7].map(k=>Math.exp(-Math.pow((f-k*BEAT)/4,2))*(k%4?0.35:0.8)));
  $('pulseGlow').style.opacity=0.3+0.6*kick; pg.style.opacity=1-seg(f,T_APP,T_APP+10);
 } else if(f>=T_END+6){ setPulse(P_END); const L=pe.getTotalLength(), d=E.io(seg(f,T_END+6,T_END+36));
  [pe,$('pulseGlow')].forEach(p=>{p.style.strokeDasharray=L;p.style.strokeDashoffset=L*(1-d)});
  $('pulseGlow').style.opacity=0.3+0.7*beatAt(f); pg.style.opacity=1;
 } else pg.style.opacity=0;

 /* diag */
 const [,cx,cy,w]=key(DK,f), land=f<40?Math.sin(Math.PI*seg(f,26,38))*0.06:0, pump=0.04*beatAt(f);
 const dg=$('diag'), s=w/908*(1-land*0.5+pump);
 dg.style.left=(cx-454)+'px'; dg.style.top=(cy-328)+'px'; dg.style.transform=`scale(${s}) scaleY(${1-land})`;
 dg.style.display=(cy<-300||cy>2200)?'none':'block';
 const bl=$('bloom'), bs=w/640; bl.style.left=(cx-450)+'px'; bl.style.top=(cy-450)+'px';
 bl.style.transform=`scale(${bs*(1+0.08*beatAt(f))})`; bl.style.opacity=(f<T_TRUST?seg(f,20,40):seg(f,T_PRICE+4,T_PRICE+20))*((cy<-300||cy>2200)?0:1);

 /* stat card */
 const so=E.oc(seg(f,B(1)-6,B(1)+8))*(1-E.ic(seg(f,T_APP-2,T_APP+8))), sp=E.back(seg(f,B(1)-6,B(1)+10));
 const st=$('stat'); st.style.opacity=so; st.style.display=so<=0.001?'none':'flex';
 st.style.transform=`translateY(${(1-sp)*90}px) scale(${lerp(0.9,1,sp)})`;
 $('statN').textContent='+'+grp(5000*E.oc(seg(f,B(1),B(1)+40)));

 /* phone: rises on bar 2, leaves with the diag */
 const ph=$('phone'), pr=E.oc(seg(f,T_APP+2,T_APP+18)), px=548, py=lerp(1950,560,pr)-lerp(0,1500,E.io(seg(f,T_TRUST-4,T_TRUST+10)));
 ph.style.display=(f<T_APP||f>T_TRUST+12)?'none':'block'; ph.style.transform=`translate(${px}px,${py}px) scale(0.62)`;

 /* bluetooth waves between diag (420,860) and phone (548,960) */
 const bo=seg(f,T_APP+16,T_APP+22)*(1-seg(f,T_TRUST-6,T_TRUST));
 for(let i=0;i<3;i++){const u=((f-T_APP)/30+i/3)%1, x=lerp(400,535,u), r=lerp(30,90,u);
  const el=$('bw'+i); el.setAttribute('d',`M${x} ${880-r} A ${r} ${r} 0 0 1 ${x} ${880+r}`); el.setAttribute('opacity',bo*Math.sin(Math.PI*u));}

 /* chips: one per beat on bar 3 */
 CHIPS.forEach((_,i)=>{const a=T_CHIP+i*BEAT*1.2, p=E.back(seg(f,a,a+12)), o=E.oc(seg(f,a,a+6))*(1-E.ic(seg(f,T_TRUST-4,T_TRUST+6)));
  const el=$('ch'+i); el.style.opacity=o; el.style.display=o<=0.001?'none':'flex'; el.style.transform=`translateX(${(1-p)*-160}px)`;});

 /* trust cards: one every two beats */
 TRUST.forEach((_,i)=>{const a=T_TRUST+6+i*BEAT*1.6, p=E.back(seg(f,a,a+12)), o=E.oc(seg(f,a,a+6))*(1-E.ic(seg(f,T_PRICE-4,T_PRICE+4)));
  const el=$('tc'+i); el.style.opacity=o; el.style.display=o<=0.001?'none':'flex'; el.style.transform=`scale(${lerp(0.6,1,p)})`;});

 /* price (break): counts up, then terms on the outro */
 const po=E.oc(seg(f,T_PRICE+2,T_PRICE+12))*(1-E.ic(seg(f,T_END-6,T_END+4))), pp=E.back(seg(f,T_PRICE+2,T_PRICE+16));
 const pc=$('price'); pc.style.opacity=po; pc.style.display=po<=0.001?'none':'flex'; pc.style.transform=`scale(${lerp(0.8,1,pp)})`;
 const cnt=E.oc(seg(f,T_PRICE+6,T_PRICE+52)); $('priceN').textContent=grp(Math.round(1190000*cnt/10000)*10000); $('priceBar').style.width=(cnt*100)+'%';
 const to=E.oc(seg(f,T_TERMS-4,T_TERMS+6))*(1-E.ic(seg(f,T_END-6,T_END+4))), tm=$('terms');
 tm.style.opacity=to; tm.style.display=to<=0.001?'none':'block';
 [0,1].forEach(i=>{const a=T_TERMS+i*2*BEAT, p=E.oc(seg(f,a-2,a+10)); $('tr'+i).style.opacity=p; $('tr'+i).style.transform=`translateX(${(1-p)*-80}px)`;});

 /* end card */
 [['ecBrand',0],['ecSub',6],['ecTel',2*BEAT],['ecUrl',2*BEAT+8]].forEach(([id,d])=>{const a=T_END+10+d, p=E.oc(seg(f,a,a+12)), el=$(id);
  el.style.opacity=p; el.style.transform=`translateY(${(1-p)*40}px)`+(id==='ecTel'?` scale(${1+0.05*Math.exp(-Math.pow((f-T_HIT)/4,2))})`:'');});
}

window.READY=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{fitTitles();render(0)});
window.render=render;
</script>
