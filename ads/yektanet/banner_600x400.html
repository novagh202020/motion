<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>CarDiag Yektanet 600x400</title>
<style>
/* Peyda / IRANSans اگر در fonts/ گذاشته شوند اولویت دارند؛ در غیر این صورت Vazirmatn FD */
@font-face{font-family:Peyda;font-weight:900;src:local("Peyda Black"),local("Peyda-Black"),url(../../fonts/Peyda-Black.ttf)}
@font-face{font-family:Peyda;font-weight:700;src:local("Peyda Bold"),local("Peyda-Bold"),url(../../fonts/Peyda-Bold.ttf)}
@font-face{font-family:IRANSans;font-weight:500;src:local("IRANSans Medium"),local("IRANSansWeb_Medium"),url(../../fonts/IRANSans-Medium.ttf)}
@font-face{font-family:V;font-weight:500;src:url(../../fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:700;src:url(../../fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(../../fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(../../fonts/Vazirmatn-FD-Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:600px;height:400px;overflow:hidden;background:#2793eb}
#c{position:relative;width:600px;height:400px;overflow:hidden;direction:rtl;color:#fff;
  background:radial-gradient(circle at 26% 58%,#4FB0FF 0%,rgba(79,176,255,0) 46%),#2793eb}
.a{position:absolute}
.ring{border:2px solid rgba(255,255,255,.12);border-radius:50%}
.h{font-family:Peyda,V,sans-serif}
.b{font-family:IRANSans,V,sans-serif}
#prod{left:-8px;top:38px;width:330px;height:330px;background:url(product_cutout.png) center/contain no-repeat;
  filter:drop-shadow(0 14px 18px rgba(20,40,80,.28))}
#chip{right:28px;top:40px;height:40px;padding:0 10px 0 16px;border-radius:20px;background:#fff;
  display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:#10203C;
  box-shadow:0 6px 14px rgba(20,40,80,.18)}
#chip i{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFC446,#F28012);
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(242,128,18,.18)}
#title{right:28px;top:96px;width:300px;font-weight:900;font-size:35px;line-height:1.32;text-shadow:0 2px 10px rgba(16,32,60,.18)}
#sub{right:28px;top:196px;width:290px;font-weight:500;font-size:16px;line-height:1.65;color:#E6F3FF}
#cta{right:28px;top:270px;height:52px;padding:0 24px;border-radius:26px;background:#fff;color:#1565C0;
  display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;box-shadow:0 10px 22px rgba(20,40,80,.25)}
#cta svg{transform:translateY(1px)}
#url{right:28px;top:344px;font-weight:700;font-size:15px;color:rgba(255,255,255,.85);direction:ltr;font-family:V,sans-serif;letter-spacing:.3px}
</style></head><body>
<div id="c">
  <div class="a ring" style="left:-60px;top:20px;width:420px;height:420px"></div>
  <div class="a ring" style="left:10px;top:90px;width:280px;height:280px"></div>
  <div id="prod" class="a"></div>

  <div id="chip" class="a h"><i><svg width="18" height="14" viewBox="0 0 24 18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M5 5h3V2h7v3h3l2 3h2v5h-2l-2 3H8L5 13H2V7h3z"/></svg></i>چراغ چک روشن شده؟</div>

  <div id="title" class="a h">قبل از تعمیرگاه،<br>علتش رو خودت بفهم</div>
  <div id="sub" class="a b">دیاگ بلوتوثی کاردیاگ رو وصل کن؛ کد خطا و راه‌حل رو فارسی، روی گوشیت ببین.</div>

  <div id="cta" class="a h">خرید دیاگ کاردیاگ
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1565C0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></div>
  <div id="url" class="a">cardiag.ir</div>
</div>
</body></html>
