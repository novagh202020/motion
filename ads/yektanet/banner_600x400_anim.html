<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>CarDiag Yektanet GIF</title>
<style>
/* Peyda / IRANSans اگر در fonts/ گذاشته شوند اولویت دارند؛ در غیر این صورت Vazirmatn FD */
@font-face{font-family:Peyda;font-weight:900;src:local("Peyda Black"),local("Peyda-Black"),url(../../fonts/Peyda-Black.ttf)}
@font-face{font-family:Peyda;font-weight:700;src:local("Peyda Bold"),local("Peyda-Bold"),url(../../fonts/Peyda-Bold.ttf)}
@font-face{font-family:IRANSans;font-weight:500;src:local("IRANSans Medium"),local("IRANSansWeb_Medium"),url(../../fonts/IRANSans-Medium.ttf)}
@font-face{font-family:V;font-weight:500;src:url(../../fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:700;src:url(../../fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(../../fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(../../fonts/Vazirmatn-FD-Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:600px;height:400px;overflow:hidden;background:#2793eb}
#c{position:relative;width:600px;height:400px;overflow:hidden;color:#fff;
  background:radial-gradient(circle at 24% 55%,#4AACFA 0%,rgba(74,172,250,0) 48%),#2793eb}
.a{position:absolute}
.h{font-family:Peyda,V,sans-serif}.b{font-family:IRANSans,V,sans-serif}
.rtl{direction:rtl}.ltr{direction:ltr;unicode-bidi:isolate}
.ring{border:2px solid rgba(255,255,255,.11);border-radius:50%}

/* phone mockup */
#phone{left:46px;top:24px;width:168px;height:352px;border-radius:30px;background:#181C24;
  box-shadow:inset 0 0 0 2px #5F6878,0 18px 30px rgba(20,40,80,.35);transform:rotate(-6deg);transform-origin:50% 60%}
#scr{left:7px;top:7px;width:154px;height:338px;border-radius:24px;overflow:hidden;background:#ECEDF1}
#scr img{position:absolute;left:0;top:10px;width:154px}
#sb{left:0;top:0;width:154px;height:18px;font:700 7px V;color:#10203C;display:flex;justify-content:space-between;align-items:center;padding:3px 16px 0}
#isl{left:55px;top:5px;width:44px;height:12px;border-radius:7px;background:#181C24}
/* status patch over «قطع شده» (source px 535–668 × 276–328, scale 154/900) */
#st{left:91px;top:56px;width:24px;height:10px;background:#F3F3F4;font:800 7.4px V;color:#22A050;text-align:right;line-height:10px;direction:rtl}

/* error card popping over the phone */
#card{left:34px;top:140px;width:168px;padding:9px 11px 10px;border-radius:16px;background:#fff;border:1.5px solid #DEE6F2;
  box-shadow:0 12px 26px rgba(20,40,80,.28);direction:rtl;transform-origin:50% 100%}
#card .t{font:800 12px V;color:#10203C;display:flex;align-items:center;gap:6px}
#card .t i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFC446,#F28012);display:inline-block}
#card .code{margin-top:7px;display:inline-block;background:#FFECEC;color:#DC3232;border-radius:9px;padding:1px 10px;font:700 21px 'DejaVu Sans',Arial,sans-serif;letter-spacing:.5px;direction:ltr}
#card .s{margin-top:5px;font:500 11px V;color:#6E7D96}
#ok{margin-top:7px;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 10px;border-radius:11px;background:#DEF6E6;color:#22A050;font:700 11px V}

#diag{left:152px;top:266px;width:134px}
#bt{left:0;top:0;overflow:visible}

/* copy (static: always readable) */
#chip{right:26px;top:56px;height:38px;padding:0 9px 0 15px;border-radius:19px;background:#fff;
  display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:#10203C;direction:rtl;
  box-shadow:0 6px 14px rgba(20,40,80,.18);overflow:hidden}
#chip i{position:relative;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFC446,#F28012);
  display:flex;align-items:center;justify-content:center}
#halo{position:absolute;inset:0;border-radius:50%;border:2px solid #F28012}
#shine{position:absolute;top:0;width:40px;height:38px;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0))}
#title{right:26px;top:110px;white-space:nowrap;font-weight:900;font-size:35px;line-height:1.35;direction:rtl;text-shadow:0 2px 10px rgba(16,32,60,.18)}
#title u{text-decoration:none;position:relative}
#title u b{position:absolute;right:0;bottom:4px;height:5px;border-radius:3px;background:rgba(255,255,255,.45)}
#sub{right:26px;top:226px;width:285px;font-weight:500;font-size:16px;line-height:1.7;color:#E6F3FF;direction:rtl}
#brand{right:26px;top:318px;display:flex;align-items:center;gap:10px;direction:ltr}
#brand .n{font:900 18px V;color:#fff}
#brand .u{font:700 14px V;color:rgba(255,255,255,.82)}
#brand .d{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.6)}
</style></head><body>
<div id="c">
  <div class="a ring" style="left:-70px;top:10px;width:430px;height:430px"></div>
  <div class="a ring" style="left:0;top:80px;width:290px;height:290px"></div>

  <div id="phone" class="a"><div id="scr" class="a">
    <img src="app_home.jpg" alt="">
    <div id="sb" class="a"><span>۱۲:۳۴</span><span>۱۰۰٪</span></div>
    <div id="isl" class="a"></div>
    <div id="st" class="a">متصل</div>
  </div></div>

  <svg id="bt" class="a" width="600" height="400"></svg>
  <img id="diag" class="a" src="diag.png" alt="">

  <div id="card" class="a">
    <div class="t"><i></i>کد خطا پیدا شد</div>
    <div class="code">P0301</div>
    <div class="s">احتراق ناقص سیلندر ۱</div>
    <div id="ok">✓ علت و راه‌حل آماده‌ست</div>
  </div>

  <div id="chip" class="a h"><i><span id="halo"></span><svg width="17" height="13" viewBox="0 0 24 18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M5 5h3V2h7v3h3l2 3h2v5h-2l-2 3H8L5 13H2V7h3z"/></svg></i>چراغ چک روشن شده؟<span id="shine"></span></div>
  <div id="title" class="a h">قبل از تعمیرگاه،<br>علتش رو <u>خودت ببین<b id="ul"></b></u></div>
  <div id="sub" class="a b">دیاگ بلوتوثی کاردیاگ رو وصل کن؛ کد خطا و راه‌حل رو فارسی، روی گوشیت ببین.</div>
  <div id="brand" class="a"><span class="n">CarDiag AI</span><span class="d"></span><span class="u">cardiag.ir</span></div>
</div>
<script>
// one seamless loop: frame(t) for t in [0, DUR)
const DUR=6;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const back=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const seg=(t,a,b)=>cl((t-a)/(b-a));
const ulW=$('title').querySelector('u').offsetWidth;
function frame(t){
  // diag floats
  const f=Math.sin(t/DUR*2*Math.PI);
  $('diag').style.transform=`translateY(${Math.round(f*3)}px)`;
  $('phone').style.transform=`rotate(-6deg)`;
  // check-engine halo: pulse every 1.5s
  const p=(t%1.5)/1.5;
  $('halo').style.transform=`scale(${1+p*0.9})`;$('halo').style.opacity=(1-p)*.8;
  // chip shine 0.2–0.9s
  const s=seg(t,.2,.9);$('shine').style.right=(-50+s*260)+'px';$('shine').style.opacity=s>0&&s<1?1:0;
  // underline under «خودت ببین»: grows 0.3–1.1, holds, retracts 5.5–5.9
  const u=io(seg(t,.3,1.1))*(1-io(seg(t,5.5,5.9)));$('ul').style.width=(u*ulW)+'px';
  // bluetooth arcs from diag to phone 0.8–2.6
  const ox=196,oy=276;let svg='';
  for(let k=0;k<3;k++){const q=seg(t,.8+k*.35,1.9+k*.35);if(q<=0||q>=1)continue;
    const r=14+q*58,o=Math.sin(q*Math.PI);
    const d=`M${ox-r*Math.cos(.25)} ${oy-r*Math.sin(.25)} A${r} ${r} 0 0 1 ${ox-r*Math.sin(.35)} ${oy-r*Math.cos(.35)}`;
    svg+=`<path d="${d}" stroke="#fff" stroke-opacity="${o}" stroke-width="8" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#2196F3" stroke-opacity="${o}" stroke-width="4" fill="none" stroke-linecap="round"/>`;}
  $('bt').innerHTML=svg;
  // status «قطع شده» → «متصل» at 2.1, back at 5.8
  $('st').style.opacity=t>=2.1&&t<5.8?1:0;
  // card pops 2.3, OK chip 3.3, card leaves 5.3–5.7
  const ci=back(seg(t,2.3,2.75)),co=io(seg(t,5.3,5.7));
  $('card').style.opacity=cl(seg(t,2.3,2.5)-co);
  $('card').style.transform=`translateY(${(1-ci)*16+co*10}px) scale(${.85+.15*ci-co*.06})`;
  const k=back(seg(t,3.3,3.65));
  $('ok').style.opacity=seg(t,3.3,3.45);$('ok').style.transform=`scale(${.7+.3*k})`;
}
window.DUR=DUR;window.frame=frame;frame(0);
</script>
</body></html>
