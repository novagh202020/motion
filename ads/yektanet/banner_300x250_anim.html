<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>CarDiag Yektanet 300x250</title>
<style>
/* Peyda / IRANSans اگر در fonts/ گذاشته شوند اولویت دارند؛ در غیر این صورت Vazirmatn FD */
@font-face{font-family:Peyda;font-weight:900;src:local("Peyda Black"),local("Peyda-Black"),url(../../fonts/Peyda-Black.ttf)}
@font-face{font-family:V;font-weight:700;src:url(../../fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(../../fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(../../fonts/Vazirmatn-FD-Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden;background:#2793eb}
#c{position:relative;width:300px;height:250px;overflow:hidden;color:#fff;
  background:radial-gradient(circle at 22% 50%,#4AACFA 0%,rgba(74,172,250,0) 50%),#2793eb}
.a{position:absolute}
.h{font-family:Peyda,V,sans-serif}
.ring{border:1.5px solid rgba(255,255,255,.11);border-radius:50%}

#phone{left:12px;top:30px;width:88px;height:184px;border-radius:16px;background:#181C24;
  box-shadow:inset 0 0 0 1.2px #5F6878,0 10px 16px rgba(20,40,80,.35);transform:rotate(-6deg);transform-origin:50% 60%}
#scr{left:4px;top:4px;width:80px;height:176px;border-radius:12px;overflow:hidden;background:#ECEDF1}
#scr img{position:absolute;left:0;top:5px;width:80px}
#isl{left:29px;top:3px;width:22px;height:6px;border-radius:4px;background:#181C24}
#st{left:47px;top:29px;width:13px;height:5.4px;background:#F3F3F4;font:800 3.9px V;color:#22A050;text-align:right;line-height:5.4px;direction:rtl}

#card{left:6px;top:110px;width:98px;padding:5px 5px 6px;border-radius:10px;background:#fff;border:1px solid #DEE6F2;
  box-shadow:0 8px 16px rgba(20,40,80,.3);direction:rtl;transform-origin:50% 100%;text-align:center}
#card .code{display:inline-block;background:#FFECEC;color:#DC3232;border-radius:6px;padding:0 7px;font:700 15px 'DejaVu Sans',Arial,sans-serif;letter-spacing:.3px;direction:ltr}
#card .t{font:800 8.5px V;color:#10203C;margin-bottom:4px}
#ok{margin-top:4px;display:inline-flex;align-items:center;height:14px;padding:0 5px;border-radius:7px;background:#DEF6E6;color:#22A050;font:700 7px V;white-space:nowrap}

#diag{left:176px;top:128px;width:104px}
#bt{left:0;top:0;overflow:visible}

/* prominent: check-engine pill */
#chip{right:10px;top:10px;height:30px;padding:0 5px 0 11px;border-radius:15px;
  background:linear-gradient(180deg,#FFC446,#F28012);color:#10203C;
  display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px;direction:rtl;white-space:nowrap;
  box-shadow:0 5px 12px rgba(20,40,80,.25),inset 0 0 0 1.5px rgba(255,255,255,.55);overflow:hidden}
#chip i{position:relative;width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
#halo{position:absolute;inset:0;border-radius:50%;border:2px solid #fff}
#shine{position:absolute;top:0;width:28px;height:30px;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.8),rgba(255,255,255,0))}

#title{right:10px;top:48px;white-space:nowrap;font-weight:900;font-size:22px;line-height:1.38;direction:rtl;text-align:right;text-shadow:0 2px 8px rgba(16,32,60,.2)}
#title u{text-decoration:none;position:relative}
#title u b{position:absolute;right:0;bottom:3px;height:3.5px;border-radius:2px;background:rgba(255,255,255,.5)}

/* prominent: brand strip */
#brand{left:0;top:214px;width:300px;height:36px;background:#1565C0;display:flex;align-items:center;justify-content:center;gap:9px;direction:ltr;
  box-shadow:0 -4px 12px rgba(20,40,80,.18)}
#brand .n{font:900 17px V;color:#fff;letter-spacing:.2px}
#brand .u{font:900 16px V;color:#fff}
#brand .d{width:5px;height:5px;border-radius:50%;background:#78CDFF}
</style></head><body>
<div id="c">
  <div class="a ring" style="left:-50px;top:10px;width:230px;height:230px"></div>

  <div id="phone" class="a"><div id="scr" class="a">
    <img src="app_home.jpg" alt="">
    <div id="isl" class="a"></div>
    <div id="st" class="a">متصل</div>
  </div></div>

  <svg id="bt" class="a" width="300" height="250"></svg>
  <img id="diag" class="a" src="diag.png" alt="">

  <div id="card" class="a">
    <div class="t">کد خطا پیدا شد</div>
    <div class="code">P0301</div><br>
    <div id="ok">✓ علت و راه‌حل آماده‌ست</div>
  </div>

  <div id="chip" class="a h"><i><span id="halo"></span><svg width="14" height="11" viewBox="0 0 24 18" fill="none" stroke="#F28012" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5 5h3V2h7v3h3l2 3h2v5h-2l-2 3H8L5 13H2V7h3z"/></svg></i>چراغ چک روشن شده؟<span id="shine"></span></div>
  <div id="title" class="a h">قبل از تعمیرگاه،<br>علتش رو <u>خودت ببین<b id="ul"></b></u></div>
  <div id="brand" class="a"><span class="n">CarDiag AI</span><span class="d"></span><span class="u">cardiag.ir</span></div>
</div>
<script>
const DUR=6,W=300,H=250;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const back=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const seg=(t,a,b)=>cl((t-a)/(b-a));
const ulW=$('title').querySelector('u').offsetWidth;
function frame(t){
  const f=Math.sin(t/DUR*2*Math.PI);
  $('diag').style.transform=`translateY(${Math.round(f*2)}px)`;
  const p=(t%1.5)/1.5;
  $('halo').style.transform=`scale(${1+p*0.9})`;$('halo').style.opacity=(1-p)*.9;
  const s=seg(t,.2,.9);$('shine').style.right=(-36+s*220)+'px';$('shine').style.opacity=s>0&&s<1?1:0;
  const u=io(seg(t,.3,1.1))*(1-io(seg(t,5.5,5.9)));$('ul').style.width=(u*ulW)+'px';
  // bluetooth arcs from diag toward phone
  const ox=196,oy=150;let svg='';
  for(let k=0;k<3;k++){const q=seg(t,.8+k*.35,1.9+k*.35);if(q<=0||q>=1)continue;
    const r=8+q*40,o=Math.sin(q*Math.PI);
    const d=`M${ox-r*Math.cos(.25)} ${oy-r*Math.sin(.25)} A${r} ${r} 0 0 1 ${ox-r*Math.sin(.35)} ${oy-r*Math.cos(.35)}`;
    svg+=`<path d="${d}" stroke="#fff" stroke-opacity="${o}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#2196F3" stroke-opacity="${o}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;}
  $('bt').innerHTML=svg;
  $('st').style.opacity=t>=2.1&&t<5.8?1:0;
  const ci=back(seg(t,2.3,2.75)),co=io(seg(t,5.3,5.7));
  $('card').style.opacity=cl(seg(t,2.3,2.5)-co);
  $('card').style.transform=`translateY(${(1-ci)*10+co*6}px) scale(${.85+.15*ci-co*.06})`;
  const k=back(seg(t,3.3,3.65));
  $('ok').style.opacity=seg(t,3.3,3.45);$('ok').style.transform=`scale(${.7+.3*k})`;
}
window.DUR=DUR;window.W=W;window.H=H;window.frame=frame;frame(0);
</script>
</body></html>
