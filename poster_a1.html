@page{size:594mm 841mm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2245px;height:3179px;overflow:hidden;background:#0F57B5}
body{font-family:V,sans-serif;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#c{position:relative;width:2245px;height:3179px;overflow:hidden;
 background:linear-gradient(180deg,#2793EB 0%,#0F57B5 100%)}
.a{position:absolute}.rtl{direction:rtl}.ltr{direction:ltr;unicode-bidi:isolate}


/* brand row */
#brand{left:0;top:120px;width:2245px;display:flex;justify-content:center;align-items:center;gap:40px}
#brand .en{font-weight:900;font-size:96px;color:#fff;letter-spacing:1px}
#brand .en b{color:#FFCD11;font-weight:900}
#brand .sep{width:4px;height:96px;background:rgba(255,255,255,.55);border-radius:2px}
#brand .fa{font-weight:900;font-size:96px;color:#fff}

/* headline */
#title,#titleF{left:0;top:330px;width:2245px;text-align:center;font-weight:900;font-size:186px;line-height:1.24;white-space:nowrap}
#title span,#titleF span{display:block}
/* back layer: outline + extruded shadow; front layer: gradient fill */
#title{color:#0A2A6B;-webkit-text-stroke:28px #0A2A6B;
 text-shadow:0 4px 0 #0A2A6B,0 8px 0 #0A2A6B,0 12px 0 #08235A,0 16px 0 #08235A,0 20px 0 #071D4A,0 40px 60px rgba(0,10,40,.55)}
#titleF span{background:linear-gradient(180deg,#FFF6A8 0%,#FFE03A 38%,#FFC400 62%,#FF9F0A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
body.t-a #title,body.t-a #titleF{font-family:Lalezar;font-weight:400;font-size:218px;line-height:1.2;top:300px}
body.t-b #title,body.t-b #titleF{font-family:Baloo;font-weight:800;font-size:200px;line-height:1.18;top:330px}
/* Peyda options */
body.t-p1 #title,body.t-p1 #titleF,body.t-p2 #title,body.t-p2 #titleF,body.t-p3 #title,body.t-p3 #titleF{font-family:Peyda;font-weight:800;font-size:200px;line-height:1.22;top:315px}
body.t-p1 #title,body.t-p2 #title{-webkit-text-stroke:0;color:transparent;text-shadow:0 14px 40px rgba(5,25,80,.55),0 4px 10px rgba(5,25,80,.35)}
body.t-p1 #titleF span,body.t-p2 #titleF span{background:none;color:#FFCD11}
body.t-p2 #titleF .l2{color:#fff}
body.t-p3 #title{-webkit-text-stroke:16px #0A2A6B;text-shadow:0 10px 0 #0A2A6B,0 30px 50px rgba(0,10,40,.45)}
body.t-p3 #titleF span{background:linear-gradient(180deg,#FFE45C 0%,#FFCD11 55%,#FFB300 100%);-webkit-background-clip:text;background-clip:text}
body.t-b #titleF .l1{background:linear-gradient(180deg,#FFFFFF 0%,#FFFFFF 50%,#D6EBFF 100%);-webkit-background-clip:text;background-clip:text}
#sub{left:0;top:860px;width:2245px;text-align:center;font-weight:700;font-size:64px;color:#fff}

/* features box */
#feat{left:200px;top:1140px;width:1845px;height:330px;border:5px solid rgba(255,255,255,.92);border-radius:56px}
#featRow{left:200px;top:1040px;width:1845px;display:flex;justify-content:space-around;direction:rtl}
.f{width:400px;display:flex;flex-direction:column;align-items:center}
.f .ib{width:200px;height:200px;display:flex;align-items:center;justify-content:center;
 border-radius:50%;background:#1E7ED8}
.f .t{margin-top:26px;text-align:center;font-weight:800;font-size:56px;line-height:1.32;color:#fff;white-space:nowrap}

/* stage */
#podium{left:-200px;top:2420px;width:2645px;height:620px;border-radius:50%;
 background:radial-gradient(ellipse at 50% 30%,#2C74CF 0%,#15509F 40%,#0B3474 75%);box-shadow:0 -6px 0 rgba(173,214,250,.25) inset}
#podTop{left:-60px;top:2400px;width:2365px;height:420px;border-radius:50%;
 background:radial-gradient(ellipse at 50% 40%,#4A9BEA 0%,#2468C4 45%,#134A99 80%);border-top:3px solid rgba(173,214,250,.5)}
.ring{position:absolute;border-radius:50%;border:0 solid #2196F3}
#ring1{left:-260px;top:2640px;width:2765px;height:420px;border-bottom-width:26px;filter:drop-shadow(0 0 30px #2196F3) drop-shadow(0 0 10px #78CDFF)}
#ring2{left:-360px;top:2720px;width:2965px;height:460px;border-bottom-width:20px;border-color:#1E7BE0;filter:drop-shadow(0 0 28px #2196F3);opacity:.85}

/* phone */
#phone{left:190px;top:1580px;width:572px;height:1270px;border-radius:78px;background:#181C24;border:4px solid #5F6878;
 transform-origin:0 0;transform:scale(.96) rotate(-4deg);

#screen{position:absolute;left:11px;top:11px;width:542px;height:1240px;border-radius:66px;overflow:hidden;background:#EEF2F8;direction:rtl;color:#10203C}
#notch{position:absolute;left:50%;top:16px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#0b0e13;z-index:5}
.sbar{height:52px;display:flex;justify-content:space-between;align-items:center;padding:8px 44px 0;font-weight:700;font-size:20px;direction:ltr;color:#10203C}
.card{background:#fff;border:2px solid #DEE6F2;border-radius:26px;margin:10px 18px 14px;padding:22px 22px;box-shadow:0 6px 16px rgba(20,40,80,.05)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.tile{background:#fff;border:2px solid #DEE6F2;border-radius:24px;height:152px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:22px;white-space:nowrap}
.ic{width:70px;height:70px;border-radius:20px;background:#E3EFFC;display:flex;align-items:center;justify-content:center}

/* diag */
#prodShadow{left:600px;top:2560px;width:700px;height:130px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,15,.65),rgba(0,0,15,0) 70%);filter:blur(6px)}
#prodGlow{left:540px;top:2040px;width:900px;height:620px;border-radius:50%;background:radial-gradient(ellipse,rgba(40,160,255,.45),rgba(40,160,255,0) 68%)}
#prod{left:640px;top:2090px;width:690px;filter:drop-shadow(0 30px 40px rgba(0,0,20,.45))}

/* business-card box (right): physical 14 x 7 cm pocket glued at #box, vertical cards stick out 2 cm above it.
   final: box area left as background; ?guide=1 outlines it; ?mock=1 shows box face + card; ?box=1 = box face print file */
#box{left:1446px;top:1776px;width:529px;height:265px;display:none;z-index:3}
#cardTop{left:1606px;top:1700px;width:208px;height:321px;display:none;z-index:2}
body.guide #box,body.guide #cardTop{display:block;border:4px dashed #FFCD11;border-radius:10px}
body.guide #box::after{content:"باکس ۱۴ × ۷ سانتی‌متر";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-weight:800;font-size:40px;color:#FFCD11;direction:rtl}
body.guide #cardTop{border-color:#fff;height:76px;background:none;box-shadow:none}
body.guide #cardTop svg{display:none}
body.mock #box,body.box #box{display:flex}
body.guide #box{background:none!important;box-shadow:none}
body.guide #box>*{display:none}
#slits{display:none;z-index:4}
body.guide #slits{display:block}
body.mock #cardTop{display:block}
#box{align-items:center;justify-content:center;gap:26px;direction:rtl;background:linear-gradient(180deg,#FFD633 0%,#FFCD11 55%,#F2BC00 100%);
 border-radius:10px;color:#10203C;box-shadow:0 18px 40px rgba(5,25,70,.45)}
#box .pc{font-weight:900;font-size:150px;line-height:1;letter-spacing:-2px}
#box .tx{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding-top:6px}
#box .l1{font-weight:800;font-size:46px;line-height:1.15}
#box .l2{font-weight:900;font-size:66px;line-height:1.1;color:#1565C0}
#box .l3{font-weight:700;font-size:34px;line-height:1.25}
#cardTop{border-radius:10px;background:#1565C0;box-shadow:0 10px 24px rgba(5,25,70,.4)}
#cardTop svg{position:absolute;left:24px;top:16px}
body.box{width:529px;height:265px}
body.box #c{width:529px;height:265px;background:none}
body.box #c>*:not(#box){display:none!important}
body.box #box{left:0;top:0;border-radius:0;box-shadow:none}

/* address under the box */
#addr{left:1290px;top:2085px;width:840px;text-align:center;direction:rtl}
#addr .h{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:900;font-size:64px;color:#FFCD11;line-height:1.2}
#addr .b{font-weight:700;font-size:46px;color:#fff;line-height:1.45;margin-top:6px}

/* bottom: QR + app name */
#dl{left:0;top:2680px;width:2245px;display:flex;align-items:center;justify-content:center;gap:90px;padding-left:640px}
#url{display:flex;align-items:center;gap:30px;height:150px;padding:0 60px 0 22px;border-radius:75px;direction:ltr;
 background:rgba(8,38,100,.45);border:4px solid rgba(255,255,255,.75);box-shadow:0 18px 50px rgba(5,25,70,.35)}
#url .gl{width:106px;height:106px;border-radius:50%;background:#FFCD11;display:flex;align-items:center;justify-content:center}
#url .u{font-weight:800;font-size:84px;color:#fff;letter-spacing:2px;line-height:1}
#qrBox{display:flex;flex-direction:column;align-items:center;gap:22px}
#qr{width:270px;height:270px;background:#fff;border-radius:30px;padding:20px;box-shadow:0 18px 50px rgba(5,25,70,.4)}
#qr img{width:230px;height:230px;display:block;image-rendering:pixelated}
#qrBox .cap{font-weight:800;font-size:44px;color:#fff;direction:rtl;white-space:nowrap}
</style></head><body>
