<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>CarDiag Periodic Service</title>
<style>
@font-face{font-family:V;font-weight:400;src:url(fonts/Vazirmatn-FD-Regular.ttf)}
@font-face{font-family:V;font-weight:500;src:url(fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:600;src:url(fonts/Vazirmatn-FD-SemiBold.ttf)}
@font-face{font-family:V;font-weight:700;src:url(fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(fonts/Vazirmatn-FD-Black.ttf)}
:root{--blue:#2196F3;--deep:#1565C0;--navy:#10203C;--slate:#6E7D96;--hair:#DEE6F2;--appbg:#EEF2F8;--red:#DC3232;--green:#22A050}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#FBFCFF}
body{font-family:V,sans-serif;color:#10203C}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#FBFCFF 0%,#ECF3FC 100%)}
.a{position:absolute}.rtl{direction:rtl}.ltr{direction:ltr;unicode-bidi:isolate}
.ttl{position:absolute;left:0;width:1080px;text-align:center;direction:rtl;z-index:50;opacity:0}
.ttl .h{font-weight:900;font-size:84px;line-height:1.15;color:#10203C;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:12px;height:76px;padding:0 32px;border-radius:38px;background:#DEF6E6;color:#22A050;font-weight:700;font-size:40px;white-space:nowrap}

/* ---------- phone ---------- */
#phone{position:absolute;left:240px;top:390px;width:600px;height:1290px;border-radius:78px;background:#181C24;border:3px solid #5F6878;transform-origin:50% 0;
 box-shadow:0 50px 90px rgba(20,40,80,.28),0 12px 26px rgba(20,40,80,.18);z-index:10;display:none}
#screen{position:absolute;left:11px;top:11px;width:572px;height:1262px;border-radius:66px;overflow:hidden;clip-path:inset(0 round 66px);isolation:isolate;background:var(--appbg)}
#notch{position:absolute;left:50%;top:14px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#0b0e13;z-index:30}
.scr{position:absolute;left:0;top:0;width:572px;height:1262px;background:var(--appbg);direction:rtl;overflow:hidden;font-family:V;display:none}
.sbar{height:48px;display:flex;justify-content:space-between;align-items:center;padding:6px 40px 0;font-weight:700;font-size:19px;direction:ltr}
.appbar{background:var(--blue);color:#fff}
.abar{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;direction:rtl}
.abar .t{font-weight:800;font-size:29px;display:flex;align-items:center;gap:14px}
.abar .help{font-weight:500;font-size:19px;display:flex;align-items:center;gap:6px}
.tabs{height:62px;display:flex;background:#F7F8FC}
.tabs div{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#98A3B8;position:relative}
.tabs div.on{color:var(--blue)}
.tabs div.on:after{content:"";position:absolute;bottom:0;width:90px;height:4px;border-radius:3px;background:var(--blue)}
.card{background:#fff;border:2px solid var(--hair);border-radius:24px;margin:14px 18px;padding:18px 20px;box-shadow:0 6px 16px rgba(20,40,80,.05)}
.btn{height:62px;border-radius:31px;background:var(--blue);color:#fff;font-weight:700;font-size:23px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.o{background:#fff;border:2px solid var(--hair);color:var(--slate)}
.nav{position:absolute;left:0;bottom:0;width:572px;height:96px;background:var(--blue);display:flex;padding-bottom:6px;z-index:5}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:500;font-size:17px;gap:4px}
.nav .pillon{width:84px;height:38px;border-radius:19px;background:rgba(255,255,255,.26);display:flex;align-items:center;justify-content:center}
.tapdot{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:5px solid rgba(33,150,243,.9);background:rgba(33,150,243,.15);opacity:0;z-index:40}
.tile{background:#fff;border:2px solid var(--hair);border-radius:24px;height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:20px;white-space:nowrap}
.tile .ib{width:62px;height:62px;border-radius:18px;background:#E3EFFC;display:flex;align-items:center;justify-content:center}
.row{height:112px;display:flex;align-items:center;gap:14px;padding:0 18px;direction:rtl}
.row .nm{font-weight:800;font-size:23px;color:#C62828;direction:ltr;text-align:right}
.row .mac{font-weight:500;font-size:16px;color:#6E7D96;direction:ltr;text-align:right;margin-top:2px}
.row .tg{font-weight:800;font-size:15px;color:#fff;border-radius:8px;padding:3px 10px;text-align:center}
/* ---------- floating cards ---------- */
.fc{position:absolute;left:110px;top:1430px;width:860px;background:#fff;border:3px solid var(--hair);border-radius:40px;
 box-shadow:0 30px 60px rgba(20,40,80,.20),0 8px 18px rgba(20,40,80,.10);direction:rtl;padding:30px 40px;opacity:0;z-index:20;transform-origin:50% 100%;display:none}
.fc .ct{font-weight:800;font-size:50px;color:var(--navy);line-height:1.2}
.fc .sub{font-weight:500;font-size:38px;color:var(--slate);line-height:1.35}
.big{font-weight:900;font-size:70px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:10px;height:66px;padding:0 26px;border-radius:33px;font-weight:700;font-size:40px;white-space:nowrap}
</style></head><body>
<div id="stage">
<style>
.qa{background:#fff;border:2px solid var(--hair);border-radius:24px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:20px;white-space:nowrap}
.qa .ib{width:74px;height:74px;border-radius:20px;background:#E3EFFC;display:flex;align-items:center;justify-content:center}
.fld{position:relative;border:2px solid #98A3B8;border-radius:8px;height:70px;margin-top:22px;display:flex;align-items:center;padding:0 20px;font-weight:500;font-size:22px;color:#10203C}
.fld .lb{position:absolute;top:-14px;right:16px;background:#ECE8F1;padding:0 8px;font-weight:500;font-size:16px;color:#6E7D96}
.svc{background:#fff;border:2px solid var(--hair);border-radius:24px;margin:14px 16px 0;padding:18px 18px 16px;display:flex;gap:14px;direction:rtl}
.svc .ic{width:70px;height:70px;border-radius:18px;background:#E3EFFC;display:flex;align-items:center;justify-content:center;flex:none}
.svc .st{display:inline-block;margin-top:8px;border-radius:10px;padding:5px 14px;font-weight:800;font-size:16px;white-space:nowrap}
.svc .pb{height:6px;border-radius:3px;background:#E6EBF2;margin-top:10px;overflow:hidden;direction:ltr}
.svc .pb div{height:6px;border-radius:3px}
.ntf{position:absolute;direction:rtl;background:#fff;border-radius:26px;box-shadow:0 20px 50px rgba(20,40,80,.28);display:flex;gap:14px;align-items:flex-start}
</style>
 <!-- ===== hook: odometer keeps climbing, the oil-change note is forgotten ===== -->
 <div id="hk" class="a" style="left:0;top:0;width:1080px;height:1920px;opacity:0;transform-origin:540px 960px">
  <svg width="1080" height="1920" class="a" style="left:0;top:0">
   <defs><linearGradient id="pan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A3650"/><stop offset="1" stop-color="#1B2438"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#142850" flood-opacity=".28"/></filter>
    <radialGradient id="amb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFC446" stop-opacity=".75"/><stop offset=".45" stop-color="#F28012" stop-opacity=".28"/><stop offset="1" stop-color="#F28012" stop-opacity="0"/></radialGradient></defs>
   <rect x="60" y="640" width="960" height="560" rx="120" fill="url(#pan)" filter="url(#sh)"/>
   <rect x="100" y="656" width="880" height="10" rx="5" fill="#3A4866"/>
   <!-- oil lamp -->
   <g transform="translate(830 920)"><circle id="oilHalo" r="150" fill="url(#amb)" opacity="0"/>
    <g transform="translate(-60 -60) scale(5)"><path id="oilIcon" fill="#3A4866" d="M2 10h5.5l1.5-1.5h3l1.5 1.5h4l3.5-2.5 1 1.2-3.5 3.3v5H2zM20.5 14.5c0 .9.7 1.6 1.5 1.6s1.5-.7 1.5-1.6c0-.8-1.5-2.6-1.5-2.6s-1.5 1.8-1.5 2.6zM8 6h4v1.5H8z"/></g></g>
  </svg>
  <div class="a" style="left:150px;top:820px;width:520px;text-align:center">
   <div style="font-weight:700;font-size:30px;color:#6E7D96">کیلومتر</div>
   <div id="odo" class="ltr" style="margin-top:8px;height:120px;border-radius:24px;background:#0E1422;border:3px solid #33415C;color:#78CDFF;font-weight:900;font-size:84px;line-height:116px;letter-spacing:4px"></div>
  </div>
  <div id="note" class="a rtl" style="left:200px;top:1290px;width:520px;background:#fff;border-radius:10px;box-shadow:0 18px 40px rgba(20,40,80,.18);padding:30px 34px 34px;transform-origin:50% 0;opacity:0">
   <div style="position:absolute;top:-20px;left:200px;width:120px;height:40px;background:#ADD6FA;opacity:.8;transform:rotate(-4deg)"></div>
   <div style="font-weight:800;font-size:46px;color:#10203C">تعویض روغن کِی بود؟</div>
   <div style="font-weight:500;font-size:34px;color:#6E7D96;margin-top:8px">فکر کنم ۳۵۱ هزار…</div>
  </div>
 </div>

 <!-- ===== phone ===== -->
 <div id="side"></div>
 <div id="phone"><div id="notch"></div><div id="screen"></div><div class="tapdot" id="tap"></div></div>
 <div id="fcs"></div>
 <div id="titles"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(f,a,b)=>cl((f-a)/(b-a)), lerp=(a,b,t)=>a+(b-a)*t;
const E={oc:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,ic:t=>t*t*t,back:t=>{const c1=1.55,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}};
const imp=(f,k,d=4)=>f>=k?Math.exp(-(f-k)/d):0;
const FA='۰۱۲۳۴۵۶۷۸۹', fa=s=>String(s).replace(/[0-9]/g,d=>FA[d]);
const vis=(el,o)=>{el.style.opacity=o; el.style.display=o<=0.001?'none':'block';};

/* ---------- timeline (frames @30fps; bar = 67.5, beat = 16.875, groove downbeat at 210) ---------- */
const B=k=>210+67.5*k, BT=n=>210+16.875*n;
/* ---------- icons ---------- */

const svg=(p,c='#2196F3',s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${c}" d="${IC[p]}"/></svg>`;
/* brand mark (car outline + pulse) as on the splash */
const LOGO=(w,c,sw=7)=>`<svg width="${w}" height="${w*0.36}" viewBox="0 0 400 144"><path class="lg" d="M8 92 L58 92 Q66 92 72 80 Q92 40 140 38 L176 38 Q214 38 236 74 L248 92 L262 92 L280 60 L304 128 L330 30 L350 92 L392 92" fill="none" stroke="${c}" stroke-width="${sw*1.6}" stroke-linecap="round" stroke-linejoin="round"/>

/* ---------- screens ---------- */
const ST_W=`<div class="sbar" style="color:#fff"><span>۱۲:۳۴</span><span>●●● ▮ ۱۰۰٪</span></div>`;
const ST_D=`<div class="sbar" style="color:#10203C"><span>۱۲:۳۴</span><span>●●● ▮ ۱۰۰٪</span></div>`;
const NAV=`<div class="nav"><div><span class="pillon">${svg('home','#fff',28)}</span><span>خانه</span></div><div>${svg('add','#fff',36)}<span>افزودن خودرو</span></div><div>${svg('more','#fff',34)}<span>بیشتر</span></div></div>`;
const bar=(t,help)=>`<div class="appbar">${ST_W}<div class="abar"><div class="t">${svg('arrow','#fff',32)}<span>${t}</span></div><div class="help">${help}</div></div></div>`;
const HEALTH=72, LG='#5CBF6E';          // health value + light green (per brief)
const tile=(id,ic,l)=>`<div class="tile" id="${id}"><div class="ib">${svg(ic,'#2196F3',36)}</div><span>${l}</span></div>`;
const S={};
S.splash=`<div class="scr" id="sc_splash" style="background:#2196F3">${ST_W}
 <div id="sp_logo" style="position:absolute;left:96px;top:470px">${LOGO(380,'#fff')}</div>
 <div id="sp_t1" style="position:absolute;left:0;right:0;top:690px;text-align:center;color:#fff;font-weight:600;font-size:27px">عیب‌یاب خودرو با هوش مصنوعی</div>
 <div id="sp_t2" class="ltr" style="position:absolute;left:0;right:0;top:744px;text-align:center;color:#ADD6FA;font-weight:700;font-size:32px;letter-spacing:4px">CarDiag AI</div></div>`;
S.home=`<div class="scr" id="sc_home">${ST_D}
 <div class="card" style="margin:6px 16px 0;padding:20px 20px 22px">
  <div style="height:66px;border:3px solid #2196F3;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 22px"><span style="font-weight:900;font-size:30px">۲۰۶</span>${svg('down','#2196F3',40)}</div>
  <div style="margin-top:16px;font-weight:500;font-size:22px;color:#6E7D96">وضعیت اتصال: <b id="h_stat" style="font-weight:800;color:#DC3232">قطع شده</b></div>

   <div style="position:absolute;inset:0;border-radius:20px;background:#E6EBF2"></div>
   <div style="position:absolute;left:0;top:0;height:40px;width:${HEALTH}%;border-radius:20px;overflow:hidden">

   <div style="position:absolute;left:${HEALTH}%;top:-4px;width:48px;height:48px;margin-left:-24px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(20,40,80,.25);display:flex;align-items:center;justify-content:center"><div style="width:22px;height:22px;border-radius:50%;background:${LG}"></div></div>
  </div>
  <div style="display:flex;justify-content:space-between;width:470px;margin:6px auto 0;direction:ltr;font-weight:500;font-size:15px;color:#98A3B8"><span>۰٪</span><span>۱۰۰٪</span></div>
  <div style="display:flex;gap:16px;margin-top:22px">
   <div class="btn" id="h_conn" style="flex:1;height:60px">${svg('plug','#fff',28)}<span>اتصال</span></div>
   <div class="btn o" id="h_disc" style="flex:1;height:60px;color:#98A3B8">${svg('close','#E57373',30)}<span>قطع اتصال</span></div></div>

 const r=$(id).getBoundingClientRect(), pg=$(id).closest('.scr').getBoundingClientRect(), sc=$('screen').getBoundingClientRect(), k=sc.width/572;
 el.style.left=(11+(r.left+r.width/2-pg.left)/k)+'px'; el.style.top=(11+(r.top+r.height/2-pg.top)/k)+'px';
 el.style.opacity=t<0?seg(t,-4,0):1-seg(t,4,14); el.style.transform=`scale(${t<0?1.2-0.2*seg(t,-4,0):1+0.6*seg(t,0,14)})`; return true;}

  <div style="width:110px;height:110px;border-radius:28px;background:#2196F3;display:flex;align-items:center;justify-content:center;flex:none">${LOGO(84,'#fff',6)}</div>
  <div style="flex:1"><div style="display:flex;justify-content:space-between;font-weight:600;font-size:30px;color:#6E7D96"><span class="ltr">CarDiag AI</span><span>الان</span></div>
   <div class="ct" style="font-size:46px;margin-top:6px;display:flex;align-items:center;gap:12px">${svg('bell',AMB,46)}تعویض روغن موتور</div>
   <div class="sub" style="color:#10203C;font-weight:600;margin-top:6px">۳۰۰ کیلومتر دیگه باید روغن عوض بشه</div></div></div></div>`;
/* side chips during the time-lapse: GPS + calendar */
$('side').innerHTML=`<div id="sG" class="a rtl" style="left:40px;top:470px;width:250px;background:#fff;border:3px solid #DEE6F2;border-radius:30px;box-shadow:0 16px 36px rgba(20,40,80,.14);padding:18px 22px;opacity:0">
  <div style="display:flex;align-items:center;gap:10px;font-weight:800;font-size:28px">${svg('pin','#2196F3',34)}<span class="ltr">GPS</span></div><div style="font-weight:600;font-size:24px;color:#6E7D96;margin-top:6px">ثبت خودکار</div></div>
 <div id="sC" class="a rtl" style="left:790px;top:470px;width:250px;background:#fff;border:3px solid #DEE6F2;border-radius:30px;box-shadow:0 16px 36px rgba(20,40,80,.14);padding:18px 22px;opacity:0">
  <div style="display:flex;align-items:center;gap:10px;font-weight:800;font-size:28px">${svg('cal','#2196F3',34)}تاریخ</div><div id="sCv" style="font-weight:900;font-size:36px;margin-top:6px"></div></div>`;

/* ---------- titles ---------- */
const TT=[
 {h:'یادت رفت روغن عوض کنی؟',a:10,b:T_TILE-4},
 {h:'یه بار ثبتش کن',a:T_TILE-2,b:T_LAP0},
 {h:'کیلومتر خودکار ثبت می‌شه',a:T_LAP0+2,b:T_NOTIF-2},
 {h:'سر وقت خبرت می‌کنه',a:T_NOTIF,b:T_LIST-2},
 {h:'همه سرویس‌ها یه جا',a:T_LIST,b:T_END-4},
 {h:'دیاگ سری <b class="ltr" style="color:#2196F3">C</b>',a:T_END-2,b:99999},
];
$('titles').innerHTML=TT.map((t,i)=>`<div class="ttl" id="tt${i}" style="top:148px"><div class="h">${t.h}</div></div>`).join('');

/* ---------- scenes ---------- */
function hook(f){
 const h=$('hk'); const o=E.oc(seg(f,-8,10))*(1-seg(f,132,146)); if(o<=0){h.style.display='none';return} h.style.display='block'; h.style.opacity=o;
 h.style.transform=`scale(${lerp(1.06,1,E.oc(seg(f,0,24)))*(1-0.08*E.ic(seg(f,130,146)))})`;
 // odometer climbs fast, slows near the end (the forgotten change is long overdue)
 const km=Math.round(lerp(351004,356420,1-Math.pow(1-seg(f,0,120),2.2))); $('odo').textContent=g3(km);
 const n=$('note'), np=seg(f,14,28), fade=seg(f,60,110);
 n.style.opacity=E.oc(np)*(1-0.7*fade); n.style.filter=`blur(${fade*3}px)`;
 n.style.transform=`rotate(${-4+fade*6}deg) translateY(${(1-E.oc(np))*40+fade*30}px)`;
 const on=f>=96, bl=on?0.6+0.4*Math.cos((f-96)/3):0;
 $('oilIcon').setAttribute('fill',on&&bl>0.45?'#FFC446':'#3A4866'); $('oilHalo').setAttribute('opacity',on?bl:0);
}
function screens(f){
 let x={};
 if(f<T_TILE+3) x={sc_qa:0}; else x=slide(f,T_TILE+3,'sc_qa','sc_svc',1);
 SCR.forEach(s=>{const el=$(s); if(x[s]===undefined){el.style.display='none'}else{el.style.display='block';el.style.transform=`translateX(${x[s]}px)`;el.style.opacity=1}});
}
const shrinkK=f=>E.io(seg(f,T_LAP0-6,T_LAP0+10))*(1-E.io(seg(f,T_NOTIF+40,T_NOTIF+56)));
function phone(f){
 const ph=$('phone'); let py=0,ps=1,po=1,show=f>=T_PH;
 if(f<T_PH+18) py=lerp(1600,0,E.oc(seg(f,T_PH,T_PH+18)));
 if(f>=T_END-10){po=1-seg(f,T_END-10,T_END); if(po<=0) show=false;}
 const k=shrinkK(f); ps=lerp(1,0.78,k); py+=lerp(0,-40,k);
 ph.style.display=show?'block':'none'; ph.style.opacity=po; ph.style.transform=`translateY(${py}px) scale(${ps})`;
 if(!show) return;
 screens(f);
 let tapped=false; const T=(a,id)=>{tapped=tapAt(f,a,id)||tapped; press(id,f,a)};
 T(T_TILE,'q_svc');
 if(f>=T_TILE){
  $('s_km').textContent=g3(kmNow(f))+' کیلومتر';
  T(T_ADD,'s_add');
  // dialog
  const din=seg(f,T_ADD+4,T_ADD+14), dout=seg(f,T_SAVE+4,T_SAVE+12), dv=f>=T_ADD+4&&f<T_SAVE+12;
  const o=dv?E.oc(din)*(1-E.ic(dout)):0; $('s_dim').style.opacity=o; $('s_dlg').style.opacity=o;
  $('s_dlg').style.transform=`translateY(${(1-E.oc(din))*60+E.ic(dout)*30}px) scale(${lerp(0.94,1,E.oc(din))})`;
  const V=['تعویض روغن موتور','۱۴۰۵/۰۷/۲۶',fa(KM0),fa(INT)];
  V.forEach((v,i)=>{const el=$('d'+i), p=seg(f,T_FLD[i],T_FLD[i]+6); el.querySelector('.v').textContent=f>=T_FLD[i]?v:''; el.querySelector('.v').style.opacity=E.oc(p);
   el.style.borderColor=(f>=T_FLD[i]&&f<T_FLD[i]+12)||i==1?'#2196F3':'#98A3B8';});
  const nc=Math.round(NOTE.length*seg(f,T_TYPE0,T_TYPE1)); $('d4').querySelector('.v').textContent=NOTE.slice(0,nc);
  $('d4').style.borderColor=f>=T_TYPE0-2?'#2196F3':'#98A3B8'; $('d4c').style.opacity=f>=T_TYPE0-2&&Math.floor(f/8)%2==0?1:0;
  if(o>0.5) T(T_SAVE,'d_save'); $('d_save').style.background=Math.abs(f-T_SAVE-2)<5?'rgba(33,150,243,.15)':'none';
  // list
  const saved=f>=T_SAVE+8; vis($('s_empty'),saved?0:1);
  const c0=$('sv0'), cp=seg(f,T_SAVE+8,T_SAVE+20); c0.style.display=saved?'flex':'none'; c0.style.opacity=E.oc(cp); c0.style.transform=`translateY(${(1-E.oc(cp))*30}px) scale(${lerp(0.9,1,E.back(cp))})`;
  const L=left(f), warn=L<=WARN, sh=warn?Math.sin((f-T_LAP1)*1.8)*8*Math.exp(-(f-T_LAP1)/6):0;
  if(saved){const st=$('sv0_st'); st.textContent=warn?`نزدیک سرویس — ${g3(L)} کیلومتر مانده`:`سالم — ${g3(L)} کیلومتر تا سرویس بعدی`;
   st.style.color=warn?AMB:GRN; st.style.background=warn?'#FFF4E5':'#DEF6E6'; c0.style.borderColor=warn?'#F9C88A':'';
   $('sv0_pb').style.width=((INT-L)/INT*100)+'%'; $('sv0_pb').style.background=warn?AMB:GRN; if(warn) c0.style.transform=`translateX(${sh}px)`;}
  [1,2,3].forEach(i=>{const el=$('sv'+i), p=seg(f,T_LIST+i*6,T_LIST+i*6+10); el.style.display=f>=T_LIST+i*6?'flex':'none'; el.style.opacity=E.oc(p); el.style.transform=`translateY(${(1-E.oc(p))*30}px)`;});
  $('s_add').style.opacity=f>=T_LIST?0:1;
  // GPS toggle pulse while driving
  $('s_gps').style.boxShadow=f>=T_LAP0&&f<T_LAP1?`0 0 0 ${6*(0.5+0.5*Math.sin(f/4))}px rgba(33,150,243,.2)`:'none';
  // notification drop-down
  const ni=seg(f,T_NOTIF,T_NOTIF+10), no=seg(f,T_LIST-14,T_LIST-4); const ntf=$('s_ntf');
  ntf.style.opacity=f>=T_NOTIF?E.oc(ni)*(1-no):0; ntf.style.transform=`translateY(${(1-E.oc(ni))*-160}px)`;
 }
 if(!tapped) $('tap').style.opacity=0;
}
const DATES=['۲۶ مهر','۳ آبان','۱۲ آبان','۲۰ آبان','۲۹ آبان','۷ آذر','۱۵ آذر'];
function floats(f){
 const show=(id,a,b)=>{const el=$(id); if(f<a-1||f>b+1){el.style.display='none';return 0}
  el.style.display='block'; const pin=seg(f,a,a+14), pout=seg(f,b-9,b);
  el.style.opacity=E.oc(seg(f,a,a+6))*(1-E.ic(pout)); el.style.transform=`translateY(${(1-E.oc(pin))*60+E.ic(pout)*30}px) scale(${lerp(0.86,1,E.back(pin))})`; return 1};
 if(show('fL',T_LAP0+4,T_NOTIF+2)){const L=left(f), warn=L<=WARN;
  $('fLv').textContent=g3(L); $('fLv').style.color=warn?AMB:GRN; $('fLp').style.width=((INT-L)/INT*100)+'%'; $('fLp').style.background=warn?AMB:GRN;
  $('fLs').textContent=warn?'نزدیک سرویس':'سالم'; $('fLs').style.color=warn?'#fff':GRN; $('fLs').style.background=warn?AMB:'#DEF6E6';
  if(warn){const el=$('fL'); el.style.borderColor='#F9C88A'; el.style.transform+=` translateX(${Math.sin((f-T_LAP1)*1.8)*10*Math.exp(-(f-T_LAP1)/6)}px)`;}}
 show('fN',T_NOTIF+8,T_LIST-2);
 const so=E.oc(seg(f,T_LAP0+6,T_LAP0+16))*(1-seg(f,T_NOTIF-8,T_NOTIF)); ['sG','sC'].forEach(id=>{$(id).style.opacity=so; $(id).style.display=so>0?'block':'none';});
 if(so>0){$('sCv').textContent=DATES[Math.min(6,Math.floor(lapP(f)*6.99))]; $('sG').style.boxShadow=`0 0 0 ${8*(0.5+0.5*Math.sin(f/4))}px rgba(33,150,243,.16),0 16px 36px rgba(20,40,80,.14)`;}
}
function render(f){
 hook(f); phone(f); floats(f);
 TT.forEach((t,i)=>{const el=$('tt'+i);const pin=E.oc(seg(f,t.a,t.a+9)),pout=E.ic(seg(f,t.b-6,t.b));const o=pin*(1-pout);
  vis(el,o); el.style.transform=`translateY(${(1-pin)*28-pout*14}px)`;});
 renderEnd(f);
}

</script>
<script src="endcard.js"></script>

initEnd(null,{health:HEALTH,healthColor:LG});
window.READY=document.fonts.ready.then(()=>{render(0);return true});
