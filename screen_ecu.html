*{margin:0;padding:0;box-sizing:border-box}
/* the app's ECU screen after clearing the codes, at the phone's native 1080x2400, for compositing into the cover photo */
html,body{width:1080px;height:2400px;overflow:hidden;background:#F4F6FA;font-family:V,sans-serif;color:#10203C;direction:rtl}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:Inter,sans-serif}
.sb{height:96px;background:#2196F3;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 64px 0;font-weight:700;font-size:38px;direction:ltr}
.hd{height:200px;background:#2196F3;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 54px}
.hd .t{display:flex;align-items:center;gap:26px;font-weight:900;font-size:80px}
.hd .h{display:flex;align-items:center;gap:12px;font-weight:700;font-size:38px}
.tabs{height:120px;background:#fff;display:flex}
.tabs div{flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:40px;color:#98A3B8;position:relative}
.tabs .on{color:#2196F3}.tabs .on:after{content:"";position:absolute;bottom:0;width:180px;height:8px;border-radius:4px;background:#2196F3}
.body{padding:40px 50px 0}
.btn{height:120px;border-radius:60px;background:#2196F3;color:#fff;font-weight:900;font-size:44px;display:flex;align-items:center;justify-content:center;gap:16px}
.card{background:#fff;border:3px solid #DEE6F2;border-radius:40px;padding:34px 40px;margin-top:34px}
.cnt{display:flex;text-align:center;margin-top:20px}.cnt div{flex:1}.cnt b{display:block;font-weight:900;font-size:90px;color:#22A050;line-height:1.2}.cnt span{font-weight:700;font-size:36px}
.dtc{display:flex;align-items:center;justify-content:space-between;margin-top:34px;padding:30px 40px;border-radius:32px;background:#fff;border:3px solid #DEE6F2}
</style></head><body>
