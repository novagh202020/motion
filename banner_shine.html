<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>CarDiag Shine Banner</title>
<style>
/* wall banner 100 x 200 cm for Shine car wash. Designed at 2245 x 4490 px (A1 poster scale), printed via PDF scale. render: python3 banner.py */
@font-face{font-family:V;font-weight:500;src:url(fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:700;src:url(fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(fonts/Vazirmatn-FD-Black.ttf)}
@font-face{font-family:Peyda;font-weight:800;src:url(fonts/Peyda-ExtraBold.ttf)}
@page{size:1000mm 2000mm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2245px;height:4490px;overflow:hidden;background:#0F57B5}
body{font-family:V,sans-serif;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#c{position:relative;width:2245px;height:4490px;overflow:hidden;
 background:linear-gradient(180deg,#2793EB 0%,#0F57B5 100%)}
.a{position:absolute}.rtl{direction:rtl}.ltr{direction:ltr;unicode-bidi:isolate}


/* brand row */
#brand{left:0;top:190px;width:2245px;display:flex;justify-content:center;align-items:center;gap:46px;direction:rtl}
#brand .fa{font-family:Peyda;font-weight:800;font-size:116px;line-height:1;color:#fff;padding-bottom:10px}
#brand .mark{height:104px;display:block}

/* headline */
#title,#titleF{left:0;top:330px;width:2245px;text-align:center;font-weight:900;font-size:186px;line-height:1.24;white-space:nowrap}
#title span,#titleF span{display:block}
/* back layer: outline + extruded shadow; front layer: gradient fill */
#title{color:#0A2A6B;-webkit-text-stroke:28px #0A2A6B;
 text-shadow:0 4px 0 #0A2A6B,0 8px 0 #0A2A6B,0 12px 0 #08235A,0 16px 0 #08235A,0 20px 0 #071D4A,0 40px 60px rgba(0,10,40,.55)}
#titleF span{background:linear-gradient(180deg,#FFF6A8 0%,#FFE03A 38%,#FFC400 62%,#FF9F0A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
body.t-p2 #title,body.t-p2 #titleF{font-family:Peyda;font-weight:800;font-size:178px;line-height:1.22;top:395px}
body.t-p2 #title{-webkit-text-stroke:0;color:transparent;text-shadow:0 14px 40px rgba(5,25,80,.55),0 4px 10px rgba(5,25,80,.35)}
body.t-p2 #titleF span{background:none;color:#FFCD11}
body.t-p2 #titleF .l2{color:#fff}
#sub{left:0;top:900px;width:2245px;text-align:center;font-weight:700;font-size:64px;color:#fff}

/* features box */
#feat{left:260px;top:1180px;width:1725px;height:330px;border:5px solid rgba(255,255,255,.92);border-radius:56px}
#featRow{left:260px;top:1080px;width:1725px;display:flex;justify-content:space-around;direction:rtl}
.f{width:400px;display:flex;flex-direction:column;align-items:center}
.f .ib{width:200px;height:200px;display:flex;align-items:center;justify-content:center;
 border-radius:50%;background:#1E7ED8}
.f .t{margin-top:26px;text-align:center;font-weight:800;font-size:56px;line-height:1.32;color:#fff;white-space:nowrap}

/* stage */
#podium{left:-200px;top:2690px;width:2645px;height:620px;border-radius:50%;
 background:radial-gradient(ellipse at 50% 30%,#2C74CF 0%,#15509F 40%,#0B3474 75%);box-shadow:0 -6px 0 rgba(173,214,250,.25) inset}
#podTop{left:-60px;top:2670px;width:2365px;height:420px;border-radius:50%;
 background:radial-gradient(ellipse at 50% 40%,#4A9BEA 0%,#2468C4 45%,#134A99 80%);border-top:3px solid rgba(173,214,250,.5)}
.ring{position:absolute;border-radius:50%;border:0 solid #2196F3}
#ring1{left:-260px;top:2910px;width:2765px;height:420px;border-bottom-width:26px;filter:drop-shadow(0 0 30px #2196F3) drop-shadow(0 0 10px #78CDFF)}
#ring2{left:-360px;top:2990px;width:2965px;height:460px;border-bottom-width:20px;border-color:#1E7BE0;filter:drop-shadow(0 0 28px #2196F3);opacity:.85}

/* phone */
#phone{left:430px;top:1700px;width:572px;height:1270px;border-radius:78px;background:#181C24;border:4px solid #5F6878;
 transform-origin:0 0;transform:scale(.96) rotate(-4deg);
 box-shadow:0 70px 140px rgba(0,0,20,.55),0 0 0 2px rgba(120,205,255,.25),0 0 120px rgba(40,160,255,.35)}
#screen{position:absolute;left:11px;top:11px;width:542px;height:1240px;border-radius:66px;overflow:hidden;background:#EEF2F8;direction:rtl;color:#10203C}
#notch{position:absolute;left:50%;top:16px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#0b0e13;z-index:5}
.sbar{height:52px;display:flex;justify-content:space-between;align-items:center;padding:8px 44px 0;font-weight:700;font-size:20px;direction:ltr;color:#10203C}
.card{background:#fff;border:2px solid #DEE6F2;border-radius:26px;margin:10px 18px 14px;padding:22px 22px;box-shadow:0 6px 16px rgba(20,40,80,.05)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.tile{background:#fff;border:2px solid #DEE6F2;border-radius:24px;height:152px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:22px;white-space:nowrap}
.ic{width:70px;height:70px;border-radius:20px;background:#E3EFFC;display:flex;align-items:center;justify-content:center}

/* diag */
#prodShadow{left:960px;top:2860px;width:760px;height:130px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,15,.65),rgba(0,0,15,0) 70%);filter:blur(6px)}
#prodGlow{left:900px;top:2340px;width:900px;height:640px;border-radius:50%;background:radial-gradient(ellipse,rgba(40,160,255,.45),rgba(40,160,255,0) 68%)}
#prod{left:990px;top:2400px;width:720px;filter:drop-shadow(0 30px 40px rgba(0,0,20,.45))}

/* white price box: blank area for a stick-on price label (prices change) */
#price{left:1240px;top:1780px;width:745px;height:340px;background:#fff;border-radius:34px;box-shadow:0 24px 60px rgba(5,25,70,.4);overflow:hidden;direction:rtl}
#price .h{height:110px;background:#10203C;color:#fff;display:flex;align-items:center;justify-content:center;gap:18px;font-weight:900;font-size:62px}
#price .h b{color:#FFCD11;font-weight:900}

/* Shine car-wash offer: yellow -> orange, 10% code shine + coupon QR */
#shine{left:260px;top:3080px;width:1725px;display:flex;align-items:center;justify-content:space-between;gap:60px;direction:rtl;
 padding:56px 64px 56px 56px;border-radius:48px;background:linear-gradient(160deg,#FFDA3A 0%,#FFC107 45%,#FF9800 100%);color:#10203C;
 box-shadow:0 30px 70px rgba(5,25,70,.45)}
#shine .tx{display:flex;flex-direction:column;align-items:flex-start}
#shine .k{font-weight:800;font-size:64px;line-height:1.3;white-space:nowrap}
#shine .k b{font-family:Peyda;font-weight:800;font-size:84px;color:#0D47A1;direction:ltr;unicode-bidi:isolate}
#shine .big{display:flex;align-items:center;gap:28px;margin-top:6px}
#shine .pc{font-weight:900;font-size:220px;line-height:1;letter-spacing:-3px}
#shine .pt{font-weight:900;font-size:96px;line-height:1}
#shine .code{display:flex;align-items:center;gap:18px;margin-top:22px;padding:10px 36px 14px;border-radius:22px;background:#10203C;color:#fff;
 font-weight:700;font-size:48px;line-height:1.2;border:3px dashed rgba(255,205,17,.75)}
#shine .code b{font-weight:900;font-size:66px;color:#FFCD11;letter-spacing:6px;direction:ltr;unicode-bidi:isolate}
#shine .qrw{flex:none;display:flex;flex-direction:column;align-items:center;gap:16px}
#shine .qr{width:400px;height:400px;background:#fff;border-radius:32px;padding:30px}
#shine .qr img{width:340px;height:340px;display:block}
#shine .cap{font-weight:800;font-size:36px;white-space:nowrap}

/* free test + address, phone, site */
#addr{left:260px;top:3740px;width:1725px;text-align:center;direction:rtl}
#addr .h{display:flex;align-items:center;justify-content:center;gap:20px;font-weight:900;font-size:88px;color:#FFCD11;line-height:1.2}
#addr .b{font-weight:700;font-size:58px;color:#fff;line-height:1.45;margin-top:8px}
#tel{left:0;top:3980px;width:2245px;display:flex;justify-content:center}
#tel .p{display:flex;align-items:center;gap:30px;height:140px;padding:0 60px 0 18px;border-radius:70px;direction:ltr;
 background:rgba(8,38,100,.45);border:4px solid rgba(255,255,255,.75)}
#tel .gl{width:104px;height:104px;border-radius:50%;background:#FFCD11;display:flex;align-items:center;justify-content:center}
#tel .n{font-weight:900;font-size:80px;color:#fff;letter-spacing:3px;line-height:1}
#dl{left:0;top:4140px;width:2245px;display:flex;justify-content:center}
#url{display:flex;align-items:center;gap:30px;height:150px;padding:0 60px 0 22px;border-radius:75px;direction:ltr;
 background:rgba(8,38,100,.45);border:4px solid rgba(255,255,255,.75);box-shadow:0 18px 50px rgba(5,25,70,.35)}
#url .gl{width:106px;height:106px;border-radius:50%;background:#FFCD11;display:flex;align-items:center;justify-content:center}
#url .u{font-weight:800;font-size:84px;color:#fff;letter-spacing:2px;line-height:1}
</style></head><body>
<div id="c">
 <div id="brand" class="a">
  <span class="fa">کاردیاگ</span>
  <img class="mark" src="assets/logo_mark_white.png">
 </div>

 <div id="title" class="a rtl"><span class="l1">عیب‌یاب هوش مصنوعی</span><span class="l2">خودروهای ایرانی و خارجی</span></div>
 <div id="titleF" class="a rtl"></div>
 <div id="sub" class="a rtl">دیاگ بلوتوثی + اپلیکیشن فارسی کاردیاگ؛ مکانیک تو جیبِت!</div>

 <div id="feat" class="a"></div>
 <div id="featRow" class="a"></div>

 <div id="podium" class="a"></div>
 <div id="ring2" class="ring"></div>
 <div id="ring1" class="ring"></div>
 <div id="podTop" class="a"></div>

 <div id="phone" class="a"><div id="notch"></div><div id="screen"></div></div>
 <div id="prodGlow" class="a"></div>
 <div id="prodShadow" class="a"></div>
 <img id="prod" class="a" src="assets/diag_front_hd.png">

 <div id="price" class="a"><div class="h">قیمت</div></div>

 <div id="shine" class="a">
  <div class="tx">
   <div class="k">تخفیف ویژه کارواش <b>Shine</b> به مشتریان</div>
   <div class="big"><div class="pc">۱۰٪</div><div class="pt">تخفیف</div></div>
   <div class="code">کد تخفیف:<b>shine</b></div>
  </div>
  <div class="qrw"><div class="qr"><img src="assets/qr_shine.svg"></div><div class="cap">اسکن کن، تخفیف خودکار اعمال میشه</div></div>
 </div>

 <div id="addr" class="a">
  <div class="h"><svg width="80" height="80" viewBox="0 0 24 24"><path fill="#FFCD11" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>تست رایگان حضوری</div>
  <div class="b">نمایندگی قزوین: ولیعصر، مجتمع تجاری نیایش، طبقه منفی ۱</div>
 </div>

 <div id="tel" class="a"><div class="p"><span class="gl"><svg width="60" height="60" viewBox="0 0 24 24"><path fill="#0B3A80" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></span>
  <span class="n">021-91099389</span></div></div>

 <div id="dl" class="a">
  <div id="url"><span class="gl"><svg width="66" height="66" viewBox="0 0 24 24" fill="none" stroke="#0B3A80" stroke-width="2" stroke-linecap="round">
   <circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5M12 2.5C9.4 5.3 8.1 8.5 8.1 12s1.3 6.7 3.9 9.5"/></svg></span>
   <span class="u">cardiag.ir</span></div>
 </div>
</div>
<script>
document.getElementById('titleF').innerHTML=document.getElementById('title').innerHTML;
document.body.classList.add('t-p2');


// feature icons (white line art, 24-unit grid)
const L=(d)=>`<svg width="150" height="150" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const FI={
 ai:L('<rect x="13" y="13" width="22" height="22" rx="4"/><path d="M19 13V7M24 13V7M29 13V7M19 41v-6M24 41v-6M29 41v-6M13 19H7M13 24H7M13 29H7M41 19h-6M41 24h-6M41 29h-6"/><path d="M18.5 29.5l3-11h1l3 11M19.6 26h4.8M29 18.5v11"/>'),
 trip:L('<path d="M8 34a17 17 0 1 1 32 0"/><path d="M24 31l8-11"/><circle cx="24" cy="31" r="3"/><path d="M12 22l2.5 1.5M24 15v3M36 22l-2.5 1.5"/><path d="M6 40h36"/>'),
 ecu:L('<path d="M9 21h4l3-4h10l3 4h4v4h3v-3h3v12h-3v-3h-3v5h-5l-3 3H17l-4-4H9z"/><path d="M5 23v10"/><path d="M23 23v5M23 31.5v.5"/>'),
 bat:L('<rect x="6" y="15" width="36" height="24" rx="4"/><path d="M12 15v-4h6v4M30 15v-4h6v4"/><path d="M12 25h6M15 22v6M30 25h6"/><path d="M25 19l-4 8h6l-4 8" stroke="#FFCD11"/>'),
};
const FEAT=[['ai','عیب‌یابی خودرو<br>با هوش مصنوعی'],['trip','تحلیل خودرو<br>در حال حرکت'],['ecu','اسکن و حذف<br>خطاهای <span class="ltr">ECU</span>'],['bat','تست سلامت<br>باتری و دینام']];
document.getElementById('featRow').innerHTML=FEAT.map(([k,t])=>`<div class="f"><div class="ib">${FI[k]}</div><div class="t">${t}</div></div>`).join('');

// app home screen (same layout as the app)
const I={
 warn:'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z',
 eye:'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z',
 car:'M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z',
 wrench:'M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z',
 bat:'M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z',
 trend:'M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z',
 speed:'M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.27-10.44zm-9.79 6.84a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z',
 sub:'M20 2H4c-1.11 0-2 .89-2 2v11c0 1.11.89 2 2 2h4v5l4-2 4 2v-5h4c1.11 0 2-.89 2-2V4c0-1.11-.89-2-2-2zm0 13H4v-2h16v2zm0-5H4V4h16v6z',
 plug:'M16 7V3h-2v4h-4V3H8v4h-.01C6.9 6.99 6 7.89 6 8.98v5.52L9.5 18v3h5v-3l3.5-3.51v-5.5c0-1.1-.9-2-2-2z',
 down:'M7 10l5 5 5-5z',
};
const sv=(p,c,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${c}" d="${I[p]}"/></svg>`;
const T=[['car','سفر'],['warn','خطایابی <span class="ltr">ECU</span>'],['wrench','عیب‌یاب هوش مصنوعی'],['eye','مانیتورینگ خودرو'],['bat','تست باتری و دینام'],
 ['trend','روند سلامت خودرو'],['speed','داشبورد'],['speed','اصالت کیلومتر'],['car','سرویس دوره‌ای'],['sub','مدیریت اشتراک']];
document.getElementById('screen').innerHTML=`<div class="sbar"><span>۱۲:۳۴</span><span>●●● ▮ ۱۰۰٪</span></div>
 <div class="card">
  <div style="height:64px;border:3px solid #2196F3;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 20px">
   <span style="font-weight:800;font-size:28px">۲۰۶</span>${sv('down','#2196F3',38)}</div>
  <div style="margin-top:14px;font-weight:500;font-size:22px;color:#6E7D96">وضعیت اتصال: <b style="font-weight:800;color:#22A050">متصل</b></div>
  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:10px">
   <span style="font-weight:700;font-size:22px;color:#6E7D96">سلامت خودرو</span><span style="font-weight:900;font-size:48px;color:#22A050;line-height:1.1">۹۲٪</span></div>
  <div class="ltr" style="position:relative;margin:8px 4px 4px;height:24px;border-radius:12px;background:#E6EBF2;overflow:hidden">
   <div style="position:absolute;left:0;top:0;height:24px;width:92%;border-radius:12px;background:linear-gradient(90deg,#E63C3C 0%,#F59628 35%,#D7C832 65%,#32B455 100%);background-size:466px 24px"></div></div>
  <div style="display:flex;gap:12px;margin-top:18px">
   <div style="flex:1;height:60px;border-radius:30px;background:#2196F3;color:#fff;font-weight:700;font-size:23px;display:flex;align-items:center;justify-content:center;gap:8px">${sv('plug','#fff',26)}اتصال</div>
   <div style="flex:1;height:60px;border-radius:30px;border:2px solid #DEE6F2;color:#6E7D96;font-weight:700;font-size:23px;display:flex;align-items:center;justify-content:center">قطع اتصال</div></div>
 </div>
 <div class="grid">${T.map(([i,t])=>`<div class="tile"><div class="ic">${sv(i,'#2196F3',40)}</div><span>${t}</span></div>`).join('')}</div>`;
</script>
</body></html>
