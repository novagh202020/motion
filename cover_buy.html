<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>CarDiag Buying Cover</title>
<style>
@font-face{font-family:V;font-weight:500;src:url(fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:700;src:url(fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(fonts/Vazirmatn-FD-Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:V,sans-serif;color:#10203C;background:#FBFCFF}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,#FBFCFF 0%,#ECF3FC 100%)}
.a{position:absolute}.rtl{direction:rtl}.ltr{direction:ltr;unicode-bidi:isolate}
#title{left:0;top:214px;width:1080px;text-align:center;font-weight:900;font-size:134px;line-height:1.1;color:#fff;white-space:nowrap;text-shadow:0 6px 22px rgba(16,32,60,.28)}
#title b{display:inline-block;color:#1565C0;font-weight:900;background:#fff;border-radius:34px;padding:0 30px;line-height:1.18;text-shadow:none;box-shadow:0 12px 30px rgba(16,32,60,.25)}
#sub{left:0;top:712px;width:1080px;text-align:center;font-weight:700;font-size:44px;color:#DCEBFB}
.card{position:absolute;direction:rtl;background:#fff;border:3px solid #DEE6F2;border-radius:40px;box-shadow:0 24px 54px rgba(20,40,80,.18)}
.row{display:flex;align-items:center;gap:18px;font-weight:800;font-size:38px;padding:14px 0;border-top:2px solid #EEF2F8}
.ck{width:52px;height:52px;border-radius:50%;background:#DEF6E6;display:flex;align-items:center;justify-content:center;flex:none}
#brand{left:0;top:1590px;width:1080px;text-align:center;font-weight:900;font-size:62px;color:#1565C0}
#url{left:0;top:1660px;width:1080px;text-align:center;font-weight:700;font-size:36px;color:#506482}
</style></head><body>
<div id="c">
 <!-- bold blue band: makes this cover stand out next to the light ones -->
 <svg class="a" style="left:0;top:0" width="1080" height="980">
  <defs><linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1565C0"/><stop offset="1" stop-color="#2196F3"/></linearGradient></defs>
  <path d="M0 0 H1080 V790 Q820 880 540 840 Q260 800 0 880 Z" fill="url(#bl)"/>
  <g stroke="#78CDFF" stroke-width="6" fill="none" opacity=".35" stroke-linecap="round" stroke-linejoin="round"><path d="M40 130 L260 130 L288 92 L316 176 L344 70 L372 130 L1040 130"/></g>
 </svg>
 <div id="title" class="a rtl">بدون <b>کاردیاگ</b><br>ماشین دست دوم<br>نخر!</div>
 <div id="sub" class="a rtl">هوش مصنوعی، مثل کارشناس کنارته</div>

 <!-- seller's claim -->
 <div class="a rtl" style="right:500px;top:792px;text-align:right">
  <div style="display:inline-block;background:#fff;border:3px solid #DEE6F2;border-radius:36px 36px 36px 10px;box-shadow:0 18px 40px rgba(20,40,80,.16);padding:12px 34px 16px;font-weight:800;font-size:46px;line-height:1.3"><div style="font-weight:700;font-size:26px;color:#6E7D96">فروشنده</div>فنی سالمِ سالم!</div>
 </div>

 <svg class="a" style="left:0;top:40px;overflow:visible" width="1080" height="1920">
  <defs>
   <filter id="sh" x="-20%" y="-40%" width="140%" height="190%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#142850" flood-opacity=".2"/></filter>
   <clipPath id="lens"><circle cx="300" cy="1010" r="118"/></clipPath>
  </defs>
  <ellipse cx="560" cy="1176" rx="420" ry="26" fill="#142850" opacity=".08"/>
  <!-- car for sale -->
  <g transform="translate(580 1060) scale(1.18)">
   <g filter="url(#sh)"><path d="M-300 70 L-300 18 Q-300 -4 -276 -8 L-196 -16 L-138 -70 Q-124 -84 -100 -84 L118 -84 Q142 -84 156 -66 L202 -14 L250 -8 Q276 -2 276 24 L276 70 Q276 86 260 86 L-284 86 Q-300 86 -300 70 Z" fill="#2196F3"/></g>
   <path d="M-120 -14 L-92 -60 L-8 -60 L-8 -14 Z M10 -60 L106 -60 L144 -14 L10 -14 Z" fill="#ADD6FA"/>
   <rect x="-302" y="16" width="26" height="16" rx="5" fill="#FFEA9C"/><rect x="254" y="16" width="22" height="16" rx="5" fill="#DC3232" opacity=".85"/>
   <rect x="-40" y="10" width="34" height="8" rx="4" fill="#1565C0"/>
   <g transform="translate(66 -38)"><rect x="-46" y="-18" width="92" height="36" rx="6" fill="#fff" stroke="#10203C" stroke-width="2"/>
    <text y="10" text-anchor="middle" font-family="V" font-weight="900" font-size="23" fill="#10203C">فروشی</text></g>
   <g transform="translate(-170 86)"><circle r="50" fill="#10203C"/><circle r="26" fill="#E6EBF2"/><circle r="7" fill="#6E7D96"/></g>
   <g transform="translate(160 86)"><circle r="50" fill="#10203C"/><circle r="26" fill="#E6EBF2"/><circle r="7" fill="#6E7D96"/></g>
  </g>
  <!-- magnifier over the engine: the pulse inside = CarDiag sees the engine -->
  <g>
   <circle cx="300" cy="1010" r="118" fill="#fff" opacity=".9"/>
   <g clip-path="url(#lens)"><path d="M170 1010 L236 1010 L256 966 L282 1062 L306 940 L330 1040 L348 1010 L440 1010" fill="none" stroke="#2196F3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>
   <circle cx="300" cy="1010" r="118" fill="none" stroke="#10203C" stroke-width="18"/>
   <path d="M384 1094 L470 1180" stroke="#10203C" stroke-width="34" stroke-linecap="round"/>
  </g>
 </svg>

 <!-- AI verdict card -->
 <div class="card" style="left:150px;top:1272px;width:780px;padding:26px 36px 14px">
  <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:14px">
   <div style="display:flex;align-items:center;gap:16px;font-weight:900;font-size:44px"><svg width="52" height="52" viewBox="0 0 24 24"><path fill="#2196F3" d="M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zM7.5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S9.83 13 9 13s-1.5-.67-1.5-1.5zM16 17H8v-2h8v2zm-1-4c-.83 0-1.5-.67-1.5-1.5S14.17 10 15 10s1.5.67 1.5 1.5S15.83 13 15 13z"/></svg>حکم نهایی</div>
   <span style="display:inline-flex;align-items:center;gap:12px;height:62px;padding:0 24px;border-radius:31px;background:#FFF4E5;color:#F28012;font-weight:800;font-size:34px"><span style="width:26px;height:26px;border-radius:50%;background:#FFC446"></span>با احتیاط</span>
  </div>
  <div class="row"><span class="ck"><svg width="34" height="34" viewBox="0 0 24 24"><path fill="#22A050" d="M9 16.17L4.83 12l-1.42 1.42L9 19 21 7l-1.41-1.41z"/></svg></span>ایرادهایی که پول می‌خواهد</div>
  <div class="row"><span class="ck"><svg width="34" height="34" viewBox="0 0 24 24"><path fill="#22A050" d="M9 16.17L4.83 12l-1.42 1.42L9 19 21 7l-1.41-1.41z"/></svg></span>سر چی چونه بزنی</div>
 </div>

 <div id="brand" class="a ltr">CarDiag AI</div>
 <div id="url" class="a ltr">cardiag.ir</div>
</div>
</body></html>
