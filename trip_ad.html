<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(f,a,b)=>cl((f-a)/(b-a)), lerp=(a,b,t)=>a+(b-a)*t;
const E={oc:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,ic:t=>t*t*t,back:t=>{const c1=1.55,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}};
const imp=(f,k,d=4)=>f>=k?Math.exp(-(f-k)/d):0;
const FA='۰۱۲۳۴۵۶۷۸۹', fa=s=>String(s).replace(/[0-9]/g,d=>FA[d]);
const vis=(el,o)=>{el.style.opacity=o; el.style.display=o<=0.001?'none':'block';};

/* ---------- timeline (frames @30fps; bar = 67.5, beat = 16.875, groove downbeat at 210) ---------- */
const B=k=>210+67.5*k, BT=n=>210+16.875*n;
const T_PH=196;                         // phone enters with splash
const T_HOME=244;                       // splash -> home
/* very fast connect (≈2 s) */
const T_CONN=BT(2.75);
const T_SEARCH=BT(3.5);
const T_DEV=[BT(4),BT(4.15),BT(4.3),BT(4.45),BT(4.6)];
const T_PICK=BT(5);
const T_BACK=T_PICK+4;
const T_STEP=[T_BACK+6,BT(5.75),BT(6.25)];
const T_OK=BT(6.75);
const T_TILE=BT(9);                     // tap "سفر" (home stays a moment after "connected")
const T_SCAN=BT(13);                    // tap "اسکن ECU" after the guide was readable -> PID cards appear
const T_GO=BT(17);                      // tap "شروع سفر"
const T_FIN=BT(29);                     // 20:00 reached
const T_REP=BT(31);                     // full report document grows out of the phone
const T_RECAP=B(13), T_END=T_RECAP+67.5;// song: 5 extra groove bars (song/extend.py) -> recap and end card 11.25 s later
const NF=Math.ceil(T_END+82.5);         // 1238 frames ≈ 41.3 s
const T_DOC0=T_REP+22, N_DOC=11, T_DOC=i=>T_DOC0+i*(T_RECAP-62-T_DOC0)/(N_DOC-1);   // report document: 11 scroll stops, the last ('what to do') holds ~1.6 s
const T_SHRINK=T_GO+10, T_PULL=T_GO+26, T_BACKIN=T_FIN-16;
const TRIP=1200;                        // seconds (20 min)

/* ---------- drive profile (trip seconds s) ---------- */
const sm=(x,a,b)=>{const t=cl((x-a)/(b-a));return t*t*(3-2*t)};
const tripS=f=>f<T_GO?0:TRIP*Math.pow(seg(f,T_GO,T_FIN-8),1.3);
function V(f){
 const s=tripS(f), run=f>=T_GO, hw=sm(s,520,600)*(1-sm(s,880,960));
 let spd=run?Math.max(0,38+30*Math.sin(s/41)+12*Math.sin(s/13)):0;
 spd=lerp(spd,72+6*Math.sin(s/23),hw); if(s<15||s>1188) spd=0; spd=Math.min(spd,79);
 const acc=Math.max(0,Math.sin(s/7.3))*(spd>2?1:0);
 const rpm=spd<2?820+25*Math.sin(f*0.7):Math.min(2950,1150+spd*20+520*acc);
 const load=cl(19+0.42*spd+38*acc+2*Math.sin(f*0.9),15,88)+(run?0:50);
 const map=Math.round(26+0.78*load);
 const L=sm(s,260,720);                                     // lean drift
 const sw=0.5+0.5*Math.tanh(3.2*Math.sin(f*0.62+0.8*Math.sin(f*0.17)));
 const o21=0.1+(0.8-0.5*L)*Math.pow(sw,1+1.6*L)+0.015*Math.sin(f*3.1);
 const o22=0.62-0.26*L+0.02*Math.sin(f*0.21);
 const ltft=4+14*sm(s,180,1000), stft=6+3*Math.sin(f*0.37)+1.2*L;
 const ect=25+64*E.oc(seg(s,0,540)), iat=31+13*seg(s,0,700);
 const adv=8+0.006*rpm+3*Math.sin(f*0.5), thr=cl(3+0.7*(load-18)*(run?1:0),3,85);
 const km=14.2*seg(s,0,TRIP)*(1-0.04*Math.sin(s/150));
 return {s,spd,rpm,load,map,o21,o22,ltft,stft,ect,iat,adv,thr,km,L};
}
const f1=v=>fa(v.toFixed(1)).replace('.','٫'), f2=v=>fa(v.toFixed(2)).replace('.','٫'), f0=v=>fa(Math.round(v));
const sg=v=>(v>=0?'+':'−')+f0(Math.abs(v));
const PIDS=[['04','بار موتور','load',v=>f0(v)+'٪'],['05','دمای آب موتور','ect',v=>f0(v)+' °C'],['06','تریم سوخت کوتاه‌مدت','stft',v=>sg(v)+'٪'],

 ['11','دریچه گاز','thr',v=>f0(v)+'٪'],['14','سنسور اکسیژن ۱','o21',v=>f2(v)+' V'],['15','سنسور اکسیژن ۲','o22',v=>f2(v)+' V'],['21','مسافت با چراغ چک','km',v=>'۰ km']];
const mmss=s=>{s=Math.min(TRIP,Math.floor(s));return fa(String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'))};

/* ---------- icons ---------- */
const IC={
