<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>CarDiag Product Shot</title>
<style>
@font-face{font-family:V;font-weight:500;src:url(fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:700;src:url(fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(fonts/Vazirmatn-FD-Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1000px;height:1000px;overflow:hidden;background:#FFFFFF}
body{font-family:V,sans-serif;color:#10203C}
.a{position:absolute}
/* phone */
#phoneWrap{left:92px;top:66px;width:600px;height:1290px;transform-origin:0 0;transform:scale(.655) rotate(-5deg)}
#phone{position:absolute;inset:0;border-radius:84px;background:linear-gradient(135deg,#2A303C 0%,#0E1117 45%,#1C212B 100%);
 box-shadow:inset 0 0 0 3px #4A5262,inset 0 0 0 7px #0B0D12,0 60px 80px -30px rgba(20,40,80,.35),0 30px 60px -20px rgba(20,40,80,.25)}
.btnside{position:absolute;background:linear-gradient(90deg,#3A4150,#1A1E26);border-radius:4px}
#screen{position:absolute;left:16px;top:16px;width:568px;height:1258px;border-radius:70px;overflow:hidden;background:#EEF2F8;direction:rtl}
#island{position:absolute;left:50%;top:22px;width:120px;height:34px;margin-left:-60px;border-radius:17px;background:#05070A;z-index:5}
#glare{position:absolute;left:16px;top:16px;width:568px;height:1258px;border-radius:70px;pointer-events:none;
 background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 70%,rgba(255,255,255,.05) 100%)}
.sbar{height:64px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 46px 6px;font-weight:700;font-size:20px;direction:ltr;color:#10203C}
.card{background:#fff;border:2px solid #DEE6F2;border-radius:24px;margin:10px 18px;padding:18px 20px}
.tile{background:#fff;border:2px solid #DEE6F2;border-radius:22px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:20px;text-align:center;line-height:1.3}
.ic{width:66px;height:66px;border-radius:18px;background:#E3EFFC;display:flex;align-items:center;justify-content:center}
.nav{position:absolute;left:0;bottom:0;width:100%;height:100px;background:#2196F3;display:flex;padding-bottom:10px}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:500;font-size:17px;gap:4px}
/* diag */
#diag{left:548px;top:596px;width:420px}
#diagShadow{left:570px;top:862px;width:390px;height:60px;border-radius:50%;background:radial-gradient(ellipse,rgba(20,40,80,.30),rgba(20,40,80,0) 70%);filter:blur(3px)}
#phoneShadow{left:60px;top:880px;width:470px;height:70px;border-radius:50%;background:radial-gradient(ellipse,rgba(20,40,80,.22),rgba(20,40,80,0) 70%);filter:blur(4px)}
#refl{left:548px;top:892px;width:420px;opacity:.10;transform:scaleY(-1);transform-origin:50% 0;
 -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,1),rgba(0,0,0,0) 35%);mask-image:linear-gradient(to bottom,rgba(0,0,0,1),rgba(0,0,0,0) 35%)}
#glow{left:480px;top:590px;width:560px;height:380px;border-radius:50%;background:radial-gradient(ellipse,rgba(40,160,255,.10),rgba(40,160,255,0) 70%)}
</style></head><body>
<div id="phoneShadow" class="a"></div>
<div id="phoneWrap" class="a">
 <div id="phone"></div>
 <div class="btnside" style="left:-7px;top:250px;width:7px;height:70px"></div>
 <div class="btnside" style="left:-7px;top:350px;width:7px;height:110px"></div>
 <div class="btnside" style="right:-7px;top:300px;width:7px;height:150px"></div>
 <div id="screen"></div>
 <div id="island"></div>
 <div id="glare"></div>
</div>
<div id="glow" class="a"></div>
<div id="diagShadow" class="a"></div>
<img id="refl" class="a" src="assets/diag_front.png">
<img id="diag" class="a" src="assets/diag_front.png">
<script>
const I={
 warn:'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z',
 eye:'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z',
 gauge:'M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.27-10.44zm-9.79 6.84a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z',
 car:'M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z',

 down:'M7 10l5 5 5-5z', plug:'M16 7V3h-2v4h-4V3H8v4h-.01C6.9 6.99 6 7.89 6 8.98v5.52L9.5 18v3h5v-3l3.5-3.51v-5.5c0-1.1-.9-2-2-2z',
};
const sv=(p,c,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${c}" d="${I[p]}"/></svg>`;
const T=[['car','سفر'],['warn','خطایابی <span style="direction:ltr;unicode-bidi:isolate">ECU</span>'],['wrench','عیب‌یاب هوش مصنوعی'],['eye','مانیتورینگ خودرو'],['batt','تست باتری و دینام'],['gauge','اصالت کیلومتر'],['gauge','داشبورد'],['cal','سرویس دوره‌ای']];
document.getElementById('screen').innerHTML=`
 <div class="sbar"><span>۱۲:۳۴</span><span>●●● ▮ ۱۰۰٪</span></div>
 <div class="card">
  <div style="height:64px;border:3px solid #2196F3;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 18px"><span style="font-weight:800;font-size:28px">۲۰۶</span>${sv('down','#2196F3',38)}</div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px">
   <div style="font-weight:500;font-size:21px;color:#6E7D96">وضعیت اتصال: <b style="font-weight:800;color:#22A050">متصل</b></div>
   <div><span style="font-weight:900;font-size:44px;color:#22A050">۹۲٪</span></div></div>
  <div style="position:relative;margin:10px 4px 2px;height:24px;border-radius:12px;background:#E6EBF2;overflow:hidden;direction:ltr">
   <div style="position:absolute;left:0;top:0;height:24px;width:92%;border-radius:12px;background:linear-gradient(90deg,#E63C3C 0%,#F59628 35%,#D7C832 65%,#32B455 100%);background-size:448px 24px"></div>
   <div style="position:absolute;inset:0;text-align:center;line-height:24px;font-weight:800;font-size:15px;color:#fff;direction:rtl;text-shadow:0 1px 2px rgba(20,40,80,.35)">سلامت خودرو</div></div>
  <div style="display:flex;gap:12px;margin-top:16px">
   <div style="flex:1;height:56px;border-radius:28px;background:#2196F3;color:#fff;font-weight:700;font-size:21px;display:flex;align-items:center;justify-content:center;gap:8px">${sv('plug','#fff',26)}اتصال</div>
   <div style="flex:1;height:56px;border-radius:28px;border:2px solid #DEE6F2;color:#6E7D96;font-weight:700;font-size:21px;display:flex;align-items:center;justify-content:center">قطع اتصال</div></div>
 </div>
 <div style="padding:6px 28px 8px;font-weight:700;font-size:21px;color:#98A3B8">دسترسی سریع</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px">${T.map(t=>`<div class="tile"><div class="ic">${sv(t[0],'#2196F3',36)}</div><span>${t[1]}</span></div>`).join('')}</div>
 <div class="nav"><div style="">${sv('home','#fff',30)}<span>خانه</span></div><div>${sv('add','#fff',36)}<span>افزودن خودرو</span></div><div>${sv('more','#fff',34)}<span>بیشتر</span></div></div>`;
</script>
</body></html>
