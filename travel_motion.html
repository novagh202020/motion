 [...el.querySelectorAll('.w>span')].forEach((w,k)=>{const a=t.a+5+k*3, p=seg(f,a,a+12), q=seg(f,t.b-4+k*1.5,t.b+5+k*1.5);

/* ---------- phone: flips in, leans a little per step; pages zoom out of the tile that opens them ---------- */
const ZO={};
function zoomOrigins(){const ph=$('phone'); ph.style.display='block'; ph.style.transform='none';
 [['sc_home',['h_conn','h_bat','h_ecu','h_trip','h_ai']],['sc_ai',['a_go']]].forEach(([s,ids])=>{const sc=$(s); sc.style.display='block'; sc.style.transform='none';
  const p=sc.getBoundingClientRect(); ids.forEach(id=>{const r=$(id).getBoundingClientRect(); ZO[id]=[r.left-p.left+r.width/2, r.top-p.top+r.height/2];}); sc.style.display='none';});
 ph.style.display='none';}
function zoomT(f,a,from,to,org,back){const p=E.io(seg(f,a,a+13)), o={};
 if(p>=1) return {[to]:{s:1,o:1}};
 if(!back){o[from]={s:1-0.06*p,o:1,dim:p}; o[to]={s:lerp(0.12,1,p),o:cl(p*2.5),org,z:3,r:1};}
 else {o[to]={s:0.94+0.06*p,o:1,dim:1-p}; o[from]={s:lerp(1,0.12,p),o:1-cl((p-0.45)/0.55),org,z:3,r:1};}
 return o}
function screens(f){
 const Z=(a,fr,to,id,b)=>zoomT(f,a,fr,to,ZO[id],b); let x;
 if(f<T_HOME) x={sc_splash:{s:1,o:1}};
 else if(f<T_HOME+10) x={sc_splash:{s:1,o:1-E.io(seg(f,T_HOME,T_HOME+10)),z:2},sc_home:{s:1,o:1}};
 else if(f<T_CONN+3) x={sc_home:{s:1,o:1}};
 else if(f<T_BACK) x=Z(T_CONN+3,'sc_home','sc_conn','h_conn');
 else if(f<T_BAT+3) x=Z(T_BACK,'sc_conn','sc_home','h_conn',1);
 else if(f<T_BB) x=Z(T_BAT+3,'sc_home','sc_bat','h_bat');
 else if(f<T_ECU+3) x=Z(T_BB,'sc_bat','sc_home','h_bat',1);
 else if(f<T_EB) x=Z(T_ECU+3,'sc_home','sc_ecu','h_ecu');
 else if(f<T_TRIP+3) x=Z(T_EB,'sc_ecu','sc_home','h_ecu',1);
 else if(f<T_TB) x=Z(T_TRIP+3,'sc_home','sc_trip','h_trip');
 else if(f<T_AI+3) x=Z(T_TB,'sc_trip','sc_home','h_trip',1);
 else if(f<T_INSP+3) x=Z(T_AI+3,'sc_home','sc_ai','h_ai');
 else x=Z(T_INSP+3,'sc_ai','sc_chat','a_go');
 SCR.forEach(s=>{const el=$(s), v=x[s]; if(!v){el.style.display='none';return} el.style.display='block';
  el.style.transformOrigin=v.org?`${v.org[0]}px ${v.org[1]}px`:'50% 50%'; el.style.transform=`scale(${v.s})`; el.style.opacity=v.o; el.style.zIndex=v.z||1;
  el.style.filter=v.dim?`brightness(${1-0.25*v.dim})`:'none'; el.style.borderRadius=v.r&&v.s<1?`${Math.min(240,36/v.s)}px`:'0';});
}
function phone(f){
 const ph=$('phone'), show=f>=T_PH&&f<T_REP+14;
 ph.style.display=show?'block':'none'; if(!show) return;
 const ent=E.oc(seg(f,T_PH,T_PH+22)); let yaw=0; [[T_BAT,-7],[T_ECU,7],[T_TRIP,-7],[T_AI,6]].forEach(([t,v])=>{yaw=lerp(yaw,v,E.io(seg(f,t-4,t+14)))});
 ph.style.opacity=f>=T_REP?1-seg(f,T_REP+4,T_REP+14):1; ph.style.transformOrigin='50% 50%';
 ph.style.transform=`perspective(2400px) translateY(${(1-ent)*260}px) rotateY(${lerp(-88,0,ent)+yaw}deg) scale(${lerp(0.85,1,ent)})`;
 screens(f);
 let tapped=false; const T=(a,id)=>{tapped=tapAt(f,a,id)||tapped; press(id,f,a)};
 if(f<T_HOME+10){const lg=[...document.querySelectorAll('#sp_logo .lg')];
  lg.forEach((p,i)=>{const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L*(1-E.io(seg(f,T_PH+6+i*3,T_PH+30+i*3)));});
  $('sp_t1').style.opacity=E.oc(seg(f,T_PH+22,T_PH+32)); $('sp_t2').style.opacity=E.oc(seg(f,T_PH+28,T_PH+38));}
 /* home */
 if(f>=T_HOME&&f<T_AI+16){
  T(T_CONN,'h_conn');
  const conn=f>=T_OK; $('h_stat').textContent=conn?'متصل':'قطع شده'; $('h_stat').style.color=conn?'#22A050':'#DC3232';

  $('h_conn').querySelector('path').setAttribute('fill',conn?'#98A3B8':'#fff'); $('h_disc').style.color=conn?'#1565C0':'#98A3B8';
  const pin=seg(f,T_BACK+6,T_BACK+16), pout=seg(f,T_OK+8,T_OK+14);
  const po2=f>=T_BACK+6&&f<T_OK+14?E.oc(pin)*(1-E.ic(pout)):0;
  $('h_dim').style.opacity=po2; const pop=$('h_pop'); pop.style.opacity=po2; pop.style.transform=`scale(${lerp(0.86,1,E.back(pin))*(1-0.06*E.ic(pout))})`;
  const STEPS=['اتصال بلوتوث...','راه‌اندازی دیاگ...','شناسایی <span class="ltr">ECU</span>...'];
  let si=0; T_STEP.forEach((t,i)=>{if(f>=t)si=i}); const st=$('p_step');
  if(f<T_OK){st.innerHTML=STEPS[si]; const k=f-T_STEP[si]; st.style.opacity=E.oc(seg(k,0,5)); st.style.transform=`translateY(${(1-E.oc(seg(k,0,6)))*10}px)`;}
  else {st.innerHTML='دیاگ آماده‌ست'; st.style.opacity=1; st.style.transform='none';}
  $('p_ttl').textContent=f<T_OK?'در حال اتصال':'متصل شد'; $('p_ttl').style.color=f<T_OK?'#10203C':'#22A050';
  $('p_spin').style.transform=`rotate(${f*14}deg)`; $('p_spin').style.opacity=f<T_OK?1:0;
  const ok=seg(f,T_OK,T_OK+8); $('p_ok').style.opacity=E.oc(ok); $('p_ok').style.transform=`scale(${ok<=0?0.4:lerp(0.4,1,E.back(ok))})`;
  $('h_toast').style.opacity=E.oc(seg(f,T_OK+4,T_OK+8))*(1-seg(f,T_BAT-4,T_BAT+2));
  T(T_BAT,'h_bat'); T(T_ECU,'h_ecu'); T(T_TRIP,'h_trip'); T(T_AI,'h_ai');
 }
 /* connection screen (fast: no permission dialog) */
 if(f>=T_CONN&&f<T_BACK+14){
  T(T_SEARCH,'c_search'); const TA=T_SEARCH+2;
  const scanning=f>=TA&&f<T_DEV[4]+4;
  $('c_stat').textContent=f<TA?'برای پیدا کردن دیاگ، جستجو را بزنید':(f<T_DEV[4]+4?'در حال جستجو...':'جستجو کامل شد. ۵ دیاگ یافت شد');
  $('c_search').style.background=scanning?'#90CAF9':'#2196F3'; $('c_stop').style.color=scanning?'#10203C':'#98A3B8';
  $('c_prog').style.width=(f<TA?0:E.io(seg(f,TA,T_DEV[4]+4))*100)+'%';
  $('c_dim').style.opacity=0; $('c_perm').style.opacity=0;
  vis($('c_empty'),1-seg(f,T_DEV[0]-2,T_DEV[0]+4));
  let rr=''; if(f>=TA){for(let i=0;i<3;i++){const ph2=((f-TA)/14+i/3)%1; rr+=`<circle cx="268" cy="226" r="${lerp(50,250,ph2)}" fill="none" stroke="#2196F3" stroke-width="${5-3*ph2}" opacity="${(1-ph2)*0.6*seg(f,TA,TA+4)}"/>`;}}
  $('c_radar').innerHTML=rr; $('c_emptyT').textContent=f<TA?'هنوز دستگاهی پیدا نشده':'در حال جستجوی دیاگ...';
  DEV.forEach((d,i)=>{const r=$('c_r'+i); const p=seg(f,T_DEV[i],T_DEV[i]+8); r.style.opacity=E.oc(seg(f,T_DEV[i],T_DEV[i]+4));
   r.style.transform=`translateY(${(1-E.oc(p))*26}px) scale(${p<=0?0.9:lerp(0.9,1,E.back(p))})`;});
  T(T_PICK,'c_r0'); const hl=Math.exp(-Math.pow((f-T_PICK-3)/5,2)); $('c_r0').style.boxShadow=`inset 0 0 0 ${3*hl}px rgba(33,150,243,${hl})`;
 }
 /* step 1: battery & alternator */
 if(f>=T_BAT&&f<T_BB+14){T(T_BGO,'b_start'); const on=f>=T_BGO+2, done=f>=T_BROW[3]+8;
  $('b_start').style.background=on&&!done?'#90CAF9':'#2196F3';
  $('b_v').textContent=done?'باتری و دینام سالم‌اند':(on?'در حال سنجش...':'منتظر شروع'); $('b_v').style.color=done?GRN:'#98A3B8';
  T_BROW.forEach((a,i)=>{const p=seg(f,a,a+10), el=$('b_r'+i); el.style.opacity=E.oc(seg(f,a,a+5)); el.style.transform=`translateY(${(1-E.oc(p))*24}px)`;});}
 /* step 2: ECU scan, nothing found */
 if(f>=T_ECU&&f<T_EB+14){T(T_ESCAN,'e_scan'); const p=E.io(seg(f,T_ESCAN+2,T_ESCAN+14)); $('e_prog').style.width=(p*100)+'%'; $('e_prog').style.opacity=p<1?1:0;
  const k=seg(f,T_ESCAN+14,T_ESCAN+24); $('e_n1').style.color=k>0?GRN:'#98A3B8';
  $('e_dtc').style.opacity=E.oc(k); $('e_dtc').style.transform=`translateY(${(1-E.oc(k))*24}px)`;}
 /* step 3: 20-minute trip; coolant climbs to 104 in traffic */
 if(f>=T_TRIP&&f<T_TB+14){$('t_time').textContent=mmss(1200*Math.pow(seg(f,T_TRIP+10,T_TB-20),1.15)); $('t_time').style.color=f>=T_TB-20?'#22A050':'#2196F3';
  const hot=COOL(f)>100; TPID.forEach((q,i)=>{const el=$('tp'+i); el.textContent=q[2](f); el.style.color=i==1&&hot?AMB:'#10203C';});
  $('tc1').style.borderColor=hot?'#F9C88A':'';}
 /* step 4: AI troubleshooter -> "troubleshoot", type the question */
 if(f>=T_AI&&f<T_INSP+16){
  const o=$('a_fix'), on=f>=T_OPT; o.style.background=on?'#CFE3FA':'#ECE6F0'; o.style.color=on?'#1E88E5':'#33415C';
  const glow=f>=T_AI+16&&f<T_OPT?0.5+0.5*Math.sin((f-T_AI)/4):0; o.style.boxShadow=`0 0 0 ${3+6*glow}px rgba(33,150,243,${0.25+0.35*glow})`;
  T(T_OPT,'a_fix'); $('a_desc').style.opacity=E.oc(seg(f,T_OPT+2,T_OPT+10));
  const n=Math.round(QTXT.length*seg(f,T_TYPE0,T_TYPE1)), tx=$('a_txt');
  tx.innerHTML=f<T_TYPE0?'مثال: موقع ترمز از جلو صدای تق‌تق میاد...':`<span style="color:#10203C;font-weight:600">${QTXT.slice(0,n)}</span><span style="display:inline-block;width:2px;height:24px;margin-right:2px;background:#2196F3;vertical-align:middle;opacity:${(Math.floor(f/8))%2?0:1}"></span>`;
  tx.style.borderColor=f>=T_TYPE0?'#2196F3':'#98A3B8';
  [['a_err',T_TYPE1-6],['a_trip',T_TYPE1]].forEach(([id,a])=>{const h=Math.exp(-Math.pow((f-a-6)/6,2)); $(id).style.boxShadow=`0 0 0 ${8*h}px rgba(34,160,80,${0.35*h})`;});
  T(T_INSP,'a_go');
 }
 /* chat: the question, typing, first line of the answer */
 if(f>=T_INSP){
  const u=seg(f,T_INSP+12,T_INSP+20); $('c_u').style.opacity=E.oc(u); $('c_u').style.transform=`translateY(${(1-E.oc(u))*24}px)`;

  if(f<T_REP+2){const r0=$('c_card').getBoundingClientRect(); if(r0.width>0) SC0=r0;}
 }
 if(!tapped) $('tap').style.opacity=0;
}
