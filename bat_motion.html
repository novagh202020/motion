<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(f,a,b)=>cl((f-a)/(b-a)), lerp=(a,b,t)=>a+(b-a)*t;
const E={oc:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,ic:t=>t*t*t,back:t=>{const c1=1.55,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}};
const imp=(f,k,d=4)=>f>=k?Math.exp(-(f-k)/d):0;
const FA='۰۱۲۳۴۵۶۷۸۹', fa=s=>String(s).replace(/[0-9]/g,d=>FA[d]);
const vis=(el,o)=>{el.style.opacity=o; el.style.display=o<=0.001?'none':'block';};

/* ---------- timeline (frames @30fps; bar = 67.5, beat = 16.875, groove downbeat at 210) ---------- */
const B=k=>210+67.5*k, BT=n=>210+16.875*n;
const KICK=[7.5,24.4,41.25,75,91.9,108.75,125.6], STALL=58.1;      // song intro kicks; missing beat -> stall
const T_PH=196;                         // phone enters with splash
const T_HOME=244;                       // splash -> home
const CR0=50, CR1=124;                  // slow crank ("کش اومدن") from CR0, engine catches at CR1 (song kick 125.6)
const CRANK=(()=>{const a=[];let t=CR0,p=5.2;while(t<CR1-3){a.push(t);t+=p;p+=0.22;}return a})();   // compression strokes, slowing down
/* fast connect (≈3 s): tap connect -> search -> OBDII -> popup -> connected */
const T_CONN=BT(3);
const T_SEARCH=BT(4);
const T_DEV=[BT(4.75),BT(5),BT(5.25),BT(5.5),BT(5.75)];
const T_PICK=BT(6.25);
const T_BACK=T_PICK+4;
const T_STEP=[T_BACK+6,BT(7.25),BT(7.75)];
const T_OK=BT(8.25);
const T_TILE=BT(9.25);                  // tap "تست باتری و دینام"
const T_START=BT(11);                   // tap "شروع تست"
const T_R=[BT(14),BT(17),BT(20),BT(23)];// tap "ثبت این مرحله" ×4
const T_RES=T_R[3]+4;                   // result
const T_RECAP=B(8), T_END=817.5;
/* test values (V) */
const VS=[12.6,10.4,13.1,12.7];
const vf=v=>fa(v.toFixed(1)).replace('.','٫');
function volt(f){                       // live socket voltage seen by the diag
 const n=0.015*Math.sin(f*1.7)+0.01*Math.sin(f*0.63);
 if(f<T_R[1]-14) return 12.6+n;
 if(f<T_R[1]+6){const d=E.oc(seg(f,T_R[1]-14,T_R[1]-6)); return lerp(12.6,10.4,d)+0.12*Math.sin(f*2.6)*d;}   // cranking dip
 if(f<T_R[2]) return lerp(10.4,13.1,E.oc(seg(f,T_R[1]+6,T_R[1]+18)))+n;                                     // engine runs, alternator weak
 return lerp(13.1,12.7,E.oc(seg(f,T_R[2]+2,T_R[2]+14)))+n;                                                    // lights + heater: sags
}

/* ---------- icons ---------- */
const IC={

const svg=(p,c='#2196F3',s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${c}" d="${IC[p]}"/></svg>`;
/* brand mark (car outline + pulse) as on the splash */
const LOGO=(w,c,sw=7)=>`<svg width="${w}" height="${w*0.36}" viewBox="0 0 400 144"><path class="lg" d="M8 92 L58 92 Q66 92 72 80 Q92 40 140 38 L176 38 Q214 38 236 74 L248 92 L262 92 L280 60 L304 128 L330 30 L350 92 L392 92" fill="none" stroke="${c}" stroke-width="${sw*1.6}" stroke-linecap="round" stroke-linejoin="round"/>

const pol=(r,deg)=>[r*Math.cos(deg*Math.PI/180), r*Math.sin(deg*Math.PI/180)];
const arc=(r,a,b)=>{const [x0,y0]=pol(r,a),[x1,y1]=pol(r,b);return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${b-a>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`};
function gaugeSvg(id,label){
 let t=''; for(let i=0;i<=24;i++){const d=A0+SW*i/24, big=i%4==0; const [x0,y0]=pol(G_R-14,d),[x1,y1]=pol(G_R-(big?40:28),d);

 return `<circle r="${G_R+14}" fill="#121A2B" stroke="#33415C" stroke-width="6"/>${t}
  <path d="${arc(G_R-2,A0,A0+SW)}" fill="none" stroke="#24304A" stroke-width="10" stroke-linecap="round"/>
  <path id="${id}A" fill="none" stroke="#2196F3" stroke-width="10" stroke-linecap="round"/>

  <g id="${id}N"><path d="M-7 0 L0 -${G_R-34} L7 0 Z" fill="#78CDFF"/></g><circle r="20" fill="#2A3650" stroke="#2196F3" stroke-width="5"/>`;
}

$('fcs').innerHTML=FC.map(c=>`<div class="fc" id="${c.id}">${c.html}</div>`).join('');

/* ---------- titles ---------- */
const TT=[
 {h:'باتری نو، باز خوابید؟',a:10,b:204},
 {h:'اول وصل شو',a:212,b:T_OK-2},
 {h:'وصل شد!',a:T_OK,b:T_TILE+8},
 {h:'باتری و دینام رو تست کن',a:T_TILE+10,b:T_START+34},
 {h:'ولتاژ رو لحظه‌به‌لحظه ببین',a:T_START+36,b:T_RES-2},
 {h:'باتری سالمه، دینام نه!',a:T_RES,b:T_RECAP-2},
 {h:'اول تست، بعد خرید',a:T_RECAP+4,b:T_END-4},
 {h:'دیاگ سری <b class="ltr" style="color:#2196F3">C</b>',a:T_END-2,b:99999},
];
$('titles').innerHTML=TT.map((t,i)=>`<div class="ttl" id="tt${i}" style="top:148px"><div class="h">${t.h}</div></div>`).join('');

/* ---------- helpers ---------- */
function tapAt(f,a,id){const t=f-a; const el=$('tap'); if(t<-4||t>14) return false;
 // position inside the page (ignores the page's own slide), so the ring stays where the finger was
 const r=$(id).getBoundingClientRect(), pg=$(id).closest('.scr').getBoundingClientRect(), sc=$('screen').getBoundingClientRect(), k=sc.width/572;
 el.style.left=(11+(r.left+r.width/2-pg.left)/k)+'px'; el.style.top=(11+(r.top+r.height/2-pg.top)/k)+'px';
 el.style.opacity=t<0?seg(t,-4,0):1-seg(t,4,14); el.style.transform=`scale(${t<0?1.2-0.2*seg(t,-4,0):1+0.6*seg(t,0,14)})`; return true;}
const press=(id,f,a)=>{$(id).style.transform=`scale(${1-0.05*Math.exp(-Math.pow((f-a-1)/3,2))})`};
// forward navigation: old page moves right, new page comes from the left (RTL); back is the reverse
function slide(f,a,from,to,dir){const p=E.io(seg(f,a,a+12)); const o={}; o[from]=dir*p*572; o[to]=dir*(p-1)*572; return p>=1?{[to]:0}:o}

function screens(f){
 let x={};
 if(f<T_HOME) x={sc_splash:0};
 else if(f<T_HOME+10) x={sc_splash:0,sc_home:0};
 else if(f<T_CONN+3) x={sc_home:0};
 else if(f<T_BACK) x=slide(f,T_CONN+3,'sc_home','sc_conn',1);
 else if(f<T_TILE+3) x=slide(f,T_BACK,'sc_conn','sc_home',-1);
 else x=slide(f,T_TILE+3,'sc_home','sc_bat',1);
 SCR.forEach(s=>{const el=$(s); if(x[s]===undefined){el.style.display='none'}else{el.style.display='block';el.style.transform=`translateX(${x[s]}px)`;el.style.opacity=1}});
 if(f>=T_HOME&&f<T_HOME+10){$('sc_splash').style.zIndex=2;$('sc_splash').style.opacity=1-E.io(seg(f,T_HOME,T_HOME+10));}
}

/* ---------- scenes ---------- */
function cluster(f){
 // visible in intro (0..150) and recap (T_RECAP..T_END)
 const inI=f<152, inR=f>=T_RECAP-6&&f<T_END+4; const c=$('clu');
 const nb=$('newBat'); const nbo=E.oc(seg(f,4,16))*(1-E.ic(seg(f,128,142)));
 nb.style.opacity=nbo; nb.style.display=nbo>0?'flex':'none';
 nb.style.transform=`translateY(${(1-E.oc(seg(f,4,18)))*60}px) scale(${lerp(0.9,1,E.back(seg(f,4,18)))})`;
 const xb=seg(f,CR0+30,CR0+40); $('newBatX').style.opacity=E.oc(xb); $('newBatX').style.transform=`scale(${xb<=0?0.4:lerp(0.4,1,E.back(xb))})`;
 if(!inI&&!inR){c.style.display='none';return} c.style.display='block';
 let o,z=1;
 if(inI){o=E.oc(seg(f,-8,10))*(1-seg(f,142,150)); z=lerp(1.06,1,E.oc(seg(f,0,20)))*(1+0.9*E.ic(seg(f,134,150)));}
 else {o=E.oc(seg(f,T_RECAP-6,T_RECAP+8))*(1-E.ic(seg(f,T_END-8,T_END+4))); z=lerp(1.12,1,E.oc(seg(f,T_RECAP-6,T_RECAP+14)));}
 c.style.opacity=o; c.style.transformOrigin='540px 960px';
 // cranking: every compression stroke pulls the battery down -> whole cluster dims and shakes
 let dim=0, shake=0, rpm=0, on;
 if(inI){
  on=seg(f,24,28);
  if(f>=CR0&&f<CR1){const k=CRANK.filter(t=>t<=f).pop()??CR0; const ph=f-k;
   dim=(0.30+0.25*seg(f,CR0,CR1))*Math.exp(-ph/2.5)+0.18*seg(f,CR0,CR0+4);
   shake=Math.exp(-ph/2)*3; rpm=0.02+0.05*Math.exp(-ph/2.2);}
  else if(f>=CR1){rpm=lerp(0.02,0.30,E.oc(seg(f,CR1,CR1+8)))+0.25*Math.exp(-(f-CR1)/5)+0.012*Math.sin(f/2.4); shake=Math.exp(-(f-CR1)/4)*5;}
 } else {on=1; rpm=0.28+0.01*Math.sin(f/5);}
 c.style.transform=`translate(${shake*Math.sin(f*7.3)}px,${shake*Math.cos(f*5.1)}px) scale(${z})`;
 c.style.filter=dim>0.01?`brightness(${1-dim})`:'none';
 setGauge('gl',0); setGauge('gr',rpm);
 const ic=$('celIcon'); ic.setAttribute('fill', on>0.5?'#FFC446':'#3A4866');
 // battery light: on with key-on, stays on after the engine runs (alternator not charging) -> stronger pulse
 const pulse=f>=CR1||inR?0.5+0.5*Math.cos((f-CR1)/4):0;
 const blink=(0.75+0.25*Math.cos(f/5))*(1+0.3*pulse);
 $('celHalo').setAttribute('opacity',on*blink*(1-0.6*dim)); $('celHalo').setAttribute('transform',`scale(${1+0.18*pulse})`);
 const rp=(((f-CR1)/22)%1+1)%1; $('celRing').setAttribute('r',70+rp*90); $('celRing').setAttribute('opacity',(f>=CR1||inR)?on*0.7*(1-rp):0);
 $('okRing').setAttribute('opacity',0);$('okHalo').setAttribute('opacity',0);
 const ck=seg(f,T_RECAP+14,T_RECAP+28); const chip=$('okChip'); chip.style.opacity=inR?E.oc(seg(f,T_RECAP+14,T_RECAP+20)):0;
 chip.style.transform=`scale(${ck<=0?0.6:lerp(0.6,1,E.back(ck))})`;
}

function dash(f){
 const B0=seg(f,140,150), out=1-seg(f,200,214), d=$('dash');
 if(B0<=0||out<=0){d.style.display='none';return}
 d.style.display='block'; d.style.opacity=B0*out;
 const z=lerp(1.15,1,E.oc(seg(f,140,156))); d.style.transform=`scale(${z})`;
 const PLUG=168;
 const m=E.io(seg(f,148,PLUG)); const push=f>=PLUG? -Math.sin(seg(f,PLUG,PLUG+6)*Math.PI)*8 : 0;
 const dx=lerp(1250,395,m)+push, dy=lerp(1000,964,m);
 const w=$('diagWrap'); w.style.left=(dx-280)+'px'; w.style.top=(dy-209)+'px';
 w.style.transform=`rotate(${lerp(-10,0,m)}deg) scale(${lerp(1.08,1,m)})`;
 $('flash').style.opacity=f>=PLUG?Math.exp(-(f-PLUG)/5)*0.9:0;
 let r='';if(f>=PLUG+4){for(let i=0;i<3;i++){const ph=((f-PLUG-4)/16+i/3)%1;const R=lerp(180,420,ph);
   r+=`<path d="M${dx-R*0.8} ${dy-R*0.6} A${R} ${R} 0 0 1 ${dx+R*0.8} ${dy-R*0.6}" fill="none" stroke="#2196F3" stroke-width="${8-4*ph}" stroke-linecap="round" opacity="${(1-ph)*0.85}"/>`}}
 $('bt').innerHTML=r;
}

function phone(f){
 const ph=$('phone'); let py=0,ps=1,po=1,show=true;
 if(f<T_PH) show=false;
 else if(f<T_PH+18){py=lerp(1600,0,E.oc(seg(f,T_PH,T_PH+18)));}
 else if(f>=T_RECAP-4){const m=E.io(seg(f,T_RECAP-4,T_RECAP+12)); ps=lerp(1,0.55,m); py=lerp(0,260,m); po=1-E.ic(seg(f,T_RECAP-2,T_RECAP+12)); if(po<=0) show=false;}
 ph.style.display=show?'block':'none'; ph.style.opacity=po; ph.style.transform=`translateY(${py}px) scale(${ps})`;
 if(!show) return;
 screens(f);
 let tapped=false; const T=(a,id)=>{tapped=tapAt(f,a,id)||tapped; press(id,f,a)};

 /* splash: logo draws in */
 if(f<T_HOME+10){const lg=[...document.querySelectorAll('#sp_logo .lg')];
  lg.forEach((p,i)=>{const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L*(1-E.io(seg(f,T_PH+6+i*3,T_PH+30+i*3)));});
  $('sp_t1').style.opacity=E.oc(seg(f,T_PH+22,T_PH+32)); $('sp_t2').style.opacity=E.oc(seg(f,T_PH+28,T_PH+38));
 }
 /* home */
 if(f>=T_HOME&&f<T_TILE+16){
  T(T_CONN,'h_conn');
  const conn=f>=T_OK; $('h_stat').textContent=conn?'متصل':'قطع شده'; $('h_stat').style.color=conn?'#22A050':'#DC3232';
  $('h_conn').style.background=conn?'#E6EBF2':'#2196F3'; $('h_conn').style.color=conn?'#98A3B8':'#fff';
  $('h_conn').querySelector('path').setAttribute('fill',conn?'#98A3B8':'#fff');
  $('h_disc').style.color=conn?'#1565C0':'#98A3B8';
  // connection popup
  const pin=seg(f,T_BACK+6,T_BACK+16), pout=seg(f,T_OK+8,T_OK+14);
  const vis2=f>=T_BACK+6&&f<T_OK+14; const po2=vis2?E.oc(pin)*(1-E.ic(pout)):0;
  $('h_dim').style.opacity=po2; const pop=$('h_pop'); pop.style.opacity=po2;
  pop.style.transform=`scale(${lerp(0.86,1,E.back(pin))*(1-0.06*E.ic(pout))})`;
  const STEPS=['اتصال بلوتوث...','راه‌اندازی دیاگ...','شناسایی <span class="ltr">ECU</span>...'];
  let si=0; T_STEP.forEach((t,i)=>{if(f>=t)si=i}); const st=$('p_step');
  if(f<T_OK){st.innerHTML=STEPS[si]; const k=f-T_STEP[si]; st.style.opacity=E.oc(seg(k,0,5)); st.style.transform=`translateY(${(1-E.oc(seg(k,0,6)))*10}px)`;}
  else {st.innerHTML='دیاگ آماده‌ست'; st.style.opacity=1; st.style.transform='none';}
  $('p_ttl').textContent=f<T_OK?'در حال اتصال':'متصل شد'; $('p_ttl').style.color=f<T_OK?'#10203C':'#22A050';
  $('p_spin').style.transform=`rotate(${f*14}deg)`; $('p_spin').style.opacity=f<T_OK?1:0;
  const ok=seg(f,T_OK,T_OK+8); $('p_ok').style.opacity=E.oc(ok); $('p_ok').style.transform=`scale(${ok<=0?0.4:lerp(0.4,1,E.back(ok))})`;
  $('h_toast').style.opacity=E.oc(seg(f,T_OK+12,T_OK+18))*(1-seg(f,T_TILE+6,T_TILE+12));
  T(T_TILE,'h_bat');
 }
 /* connection screen (fast: no permission dialog) */
 if(f>=T_CONN&&f<T_BACK+14){
  T(T_SEARCH,'c_search'); const TA=T_SEARCH+2;
  const scanning=f>=TA&&f<T_DEV[4]+4;
  $('c_stat').textContent=f<TA?'برای پیدا کردن دیاگ، جستجو را بزنید':(f<T_DEV[4]+4?'در حال جستجو...':'جستجو کامل شد. ۵ دیاگ یافت شد');
  $('c_search').style.background=scanning?'#90CAF9':'#2196F3';
  $('c_stop').style.color=scanning?'#10203C':'#98A3B8';
  $('c_prog').style.width=(f<TA?0:E.io(seg(f,TA,T_DEV[4]+4))*100)+'%'; $('c_prog').style.opacity=f<T_DEV[4]+10?1:1-seg(f,T_DEV[4]+10,T_DEV[4]+16);
  $('c_dim').style.opacity=0; $('c_perm').style.opacity=0;
  const eo=1-seg(f,T_DEV[0]-2,T_DEV[0]+4); vis($('c_empty'),eo);
  let rr=''; if(f>=TA){for(let i=0;i<3;i++){const ph=((f-TA)/14+i/3)%1; rr+=`<circle cx="268" cy="226" r="${lerp(50,250,ph)}" fill="none" stroke="#2196F3" stroke-width="${5-3*ph}" opacity="${(1-ph)*0.6*seg(f,TA,TA+4)}"/>`;}}
  $('c_radar').innerHTML=rr; $('c_emptyT').textContent=f<TA?'هنوز دستگاهی پیدا نشده':'در حال جستجوی دیاگ...';
  DEV.forEach((d,i)=>{const r=$('c_r'+i); const p=seg(f,T_DEV[i],T_DEV[i]+8); r.style.opacity=E.oc(seg(f,T_DEV[i],T_DEV[i]+4));
   r.style.transform=`translateY(${(1-E.oc(p))*26}px) scale(${p<=0?0.9:lerp(0.9,1,E.back(p))})`;});
  T(T_PICK,'c_r0'); const hl=Math.exp(-Math.pow((f-T_PICK-3)/5,2)); $('c_r0').style.boxShadow=`inset 0 0 0 ${3*hl}px rgba(33,150,243,${hl})`;
 }
 /* battery & alternator test */
 if(f>=T_TILE){
  const st=T_R.filter(t=>f>=t).length;            // recorded steps
  const inStep=f>=T_START&&f<T_RES;
  vis($('b_intro'),f<T_START+4?1-seg(f,T_START+1,T_START+4):0);
  vis($('b_step'),inStep?seg(f,T_START+2,T_START+6)*(f<T_RES-3?1:1-seg(f,T_RES-3,T_RES)):0);
  vis($('b_res'),f>=T_RES?seg(f,T_RES,T_RES+5):0);
  T(T_START,'b_start');
  if(inStep){const k=Math.min(st,3), tk=k?T_R[k-1]:T_START;
   $('b_sh').textContent=`مرحله ${fa(k+1)} از ۴ — ${STP[k][0]}`; $('b_st').innerHTML=STP[k][1];
   const ff=E.oc(seg(f,tk+2,tk+8)); $('b_sh').style.opacity=ff; $('b_st').style.opacity=ff;
   $('b_st').style.transform=`translateY(${(1-ff)*10}px)`;
   T_R.forEach(t=>T(t,'b_rec'));
  }
  const log=VS.map((v,i)=>`${STP[i][0].split(' با ')[0]}: ${vf(v)}`);
  $('b_log').innerHTML=log.slice(0,Math.min(st,3)).join('  •  ');
  $('b_log2').innerHTML=log.join('  •  ');
  RES.forEach((r,i)=>{const a=T_RES+8+i*9, p=seg(f,a,a+10), el=$('b_r'+i);
   el.style.opacity=E.oc(seg(f,a,a+6)); el.style.transform=`translateY(${(1-E.oc(p))*24}px)`;
   if(i>=2) el.style.boxShadow=`0 0 0 ${3*Math.exp(-Math.pow((f-a-14)/6,2))}px rgba(242,128,18,.6)`;});
 }
 if(!tapped) $('tap').style.opacity=0;
}

/* live voltage card: big number + trace with the 13.5 V charging line */
const PX0=T_START+8, PX1=T_RES, py=v=>lerp(214,16,(v-9.8)/(14.2-9.8)), pxf=t=>lerp(8,432,(t-PX0)/(PX1-PX0));
const CHIP=[['#22A050','#DEF6E6','سالم','check'],['#22A050','#DEF6E6','افت عادی','check'],['#fff','#F28012','کمتر از '+vf(13.5),'warn'],['#fff','#F28012','افت زیر بار','warn']];
function live(f){
 if(f<PX0-2||f>PX1+4) return;
 const st=T_R.filter(t=>f>=t).length, k=Math.min(st,3);
 // the card shows the step being measured; after a record it switches to the next one
 const v=volt(Math.min(f,T_R[3])), run=f>=T_R[1]+16;
 $('v_lab').textContent=VLAB[k]; $('v_num').textContent=vf(v); $('v_num').style.color=run?'#F28012':'#10203C';
 const ready=[T_START+26,T_R[1]-4,T_R[1]+22,T_R[2]+14][k]; const c=CHIP[k], cp=seg(f,ready,ready+8);
 $('v_chip').innerHTML=f>=ready?`<span class="pill" style="height:58px;font-size:34px;background:${c[1]};color:${c[0]};transform:scale(${lerp(0.7,1,E.back(cp))});transform-origin:right center">${svg(c[3],c[0],32)}${c[2]}</span>`:'';
 let d='', t1=Math.min(f,PX1); for(let t=PX0;t<=t1;t+=1.5) d+=(d?'L':'M')+pxf(t).toFixed(1)+' '+py(volt(t)).toFixed(1);
 const y135=py(13.5);
 let g=`<rect x="0" y="0" width="440" height="230" rx="22" fill="#F4F8FD"/>
  <line x1="8" x2="432" y1="${y135}" y2="${y135}" stroke="#F28012" stroke-width="3" stroke-dasharray="10 8" opacity=".8"/>
  <text x="16" y="${y135-10}" direction="ltr" style="direction:ltr;unicode-bidi:isolate" text-anchor="start" font-family="V" font-weight="700" font-size="26" fill="#F28012">${vf(13.5)}</text>
  <path d="${d}" fill="none" stroke="#2196F3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
 T_R.forEach((t,i)=>{if(f>=t){const p=E.back(seg(f,t,t+8)); g+=`<circle cx="${pxf(t)}" cy="${py(VS[i])}" r="${11*p}" fill="${i<2?'#22A050':'#F28012'}" stroke="#fff" stroke-width="4"/>`;}});
 if(f<PX1){const x=pxf(t1), y=py(volt(t1)); g+=`<circle cx="${x}" cy="${y}" r="16" fill="#2196F3" opacity="${0.25+0.15*Math.sin(f/3)}"/><circle cx="${x}" cy="${y}" r="8" fill="#2196F3"/>`;}
 $('v_plot').innerHTML=g;
}

function render(f){
 cluster(f); dash(f); phone(f); live(f);
 TT.forEach((t,i)=>{const el=$('tt'+i);const pin=E.oc(seg(f,t.a,t.a+9)),pout=E.ic(seg(f,t.b-6,t.b));const o=pin*(1-pout);
  vis(el,o); el.style.transform=`translateY(${(1-pin)*28-pout*14}px)`;});
 FC.forEach(c=>{const el=$(c.id); if(f<c.a-1||f>c.b+1){el.style.display='none';return}
  el.style.display='block'; const pin=seg(f,c.a,c.a+14), pout=seg(f,c.b-9,c.b);
  el.style.opacity=E.oc(seg(f,c.a,c.a+6))*(1-E.ic(pout));
  el.style.transform=`translateY(${(1-E.oc(pin))*60+E.ic(pout)*30}px) scale(${lerp(0.86,1,E.back(pin))})`;});
 renderEnd(f);
}
