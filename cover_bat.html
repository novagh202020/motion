<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>CarDiag Battery Cover</title>
<style>
@font-face{font-family:V;font-weight:500;src:url(fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:700;src:url(fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(fonts/Vazirmatn-FD-Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:V,sans-serif;color:#10203C;background:#FBFCFF}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,#FBFCFF 0%,#ECF3FC 100%)}
.a{position:absolute}.rtl{direction:rtl}.ltr{direction:ltr;unicode-bidi:isolate}
#title{left:0;top:345px;width:1080px;text-align:center;font-weight:900;font-size:96px;line-height:1.1;white-space:nowrap}
#title b{color:#2196F3;font-weight:900}
#sub{left:0;top:500px;width:1080px;text-align:center;font-weight:500;font-size:44px;color:#6E7D96}
.card{position:absolute;direction:rtl;background:#fff;border:3px solid #DEE6F2;border-radius:44px;box-shadow:0 18px 40px rgba(20,40,80,.14)}
.chip{display:inline-flex;align-items:center;gap:12px;height:70px;padding:0 28px;border-radius:35px;font-weight:800;font-size:38px;white-space:nowrap}
#res{right:60px;top:650px;width:480px;padding:30px 34px}
#res .r{display:flex;align-items:center;justify-content:space-between}
#res .t{font-weight:900;font-size:50px}
#res .v{margin-top:6px;font-weight:500;font-size:34px;color:#6E7D96}
#res hr{border:0;height:3px;background:#DEE6F2;margin:24px 0}
#plot{left:70px;top:1150px;width:940px;padding:26px 34px 22px}
#plot .h{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:38px}
#brand{left:0;top:1498px;width:1080px;text-align:center;font-weight:900;font-size:62px;color:#1565C0}
#url{left:0;top:1572px;width:1080px;text-align:center;font-weight:700;font-size:36px;color:#506482}
</style></head><body>
<div id="c"><div id="g" style="position:absolute;inset:0;transform-origin:540px 990px;transform:translateY(-22px) scale(.86)">

 <div id="title" class="a rtl">باتری نو، <b>باز خوابید؟</b></div>
 <div id="sub" class="a rtl">قبل از خرید باتری، دینام رو تست کن</div>

 <!-- big car battery (left) -->
 <svg class="a" style="left:46px;top:640px;overflow:visible" width="450" height="485" viewBox="0 0 520 560">
  <defs>
   <linearGradient id="bf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1B2A48"/><stop offset=".55" stop-color="#10203C"/><stop offset="1" stop-color="#0B1730"/></linearGradient>
   <linearGradient id="bt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#42A9F6"/><stop offset="1" stop-color="#1E88E5"/></linearGradient>
   <linearGradient id="term" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9D4E4"/><stop offset=".5" stop-color="#F4F7FB"/><stop offset="1" stop-color="#AEBBD0"/></linearGradient>
   <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#28A0FF" stop-opacity=".35"/><stop offset="1" stop-color="#28A0FF" stop-opacity="0"/></radialGradient>
   <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#142850" flood-opacity=".30"/></filter>
  </defs>
  <ellipse cx="260" cy="300" rx="300" ry="280" fill="url(#gl)"/>
  <g filter="url(#sh)">
   <!-- terminals -->
   <rect x="88" y="92" width="74" height="54" rx="12" fill="url(#term)"/><rect x="358" y="92" width="74" height="54" rx="12" fill="url(#term)"/>
   <rect x="80" y="128" width="90" height="20" rx="6" fill="#5F6878"/><rect x="350" y="128" width="90" height="20" rx="6" fill="#5F6878"/>
   <!-- lid -->
   <rect x="30" y="140" width="460" height="74" rx="22" fill="url(#bt)"/>
   <rect x="30" y="196" width="460" height="18" fill="#1565C0" opacity=".55"/>
   <!-- body -->
   <rect x="40" y="204" width="440" height="300" rx="30" fill="url(#bf)"/>
   <rect x="64" y="226" width="12" height="256" rx="6" fill="#fff" opacity=".07"/>
  </g>
  <!-- +/- marks on lid -->
  <rect x="104" y="170" width="42" height="12" rx="6" fill="#fff"/>
  <rect x="374" y="170" width="42" height="12" rx="6" fill="#fff"/><rect x="389" y="155" width="12" height="42" rx="6" fill="#fff"/>
  <!-- label: brand pulse line + 12V -->
  <path d="M96 372 L176 372 L198 330 L224 418 L250 300 L272 372 L424 372" fill="none" stroke="#2196F3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="260" y="470" text-anchor="middle" font-family="V" font-weight="900" font-size="54" fill="#ADD6FA" direction="rtl" style="direction:rtl;unicode-bidi:plaintext">۱۲ ولت</text>
  <!-- "new" tag -->
  <g transform="translate(450 500) rotate(-10)">
   <rect x="-70" y="-36" width="140" height="72" rx="36" fill="#2196F3" stroke="#fff" stroke-width="6"/>
   <text x="0" y="14" text-anchor="middle" font-family="V" font-weight="900" font-size="40" fill="#fff">نو</text>
  </g>
 </svg>

 <!-- result card (right) -->
 <div id="res" class="card">
  <div class="r"><span class="t">باتری</span>
   <span class="chip" style="background:#DEF6E6;color:#22A050"><svg width="42" height="42" viewBox="0 0 24 24"><path fill="#22A050" d="M9 16.17L4.83 12l-1.42 1.42L9 19 21 7l-1.41-1.41z"/></svg>سالم</span></div>
  <div class="v">۱۲٫۶ ولت</div>
  <hr>
  <div class="r"><span class="t">دینام</span>
   <span class="chip" style="background:#F28012;color:#fff"><svg width="38" height="38" viewBox="0 0 24 24"><path fill="#fff" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>شارژ کم</span></div>
  <div class="v">۱۳٫۱ ولت؛ باید بالای ۱۳٫۵</div>
 </div>

 <!-- voltage trace -->
 <div id="plot" class="card">
  <div class="h"><span>ولتاژ لحظه‌به‌لحظه</span><span style="color:#2196F3;font-size:34px;font-weight:700" class="ltr">CarDiag AI</span></div>
  <svg width="872" height="210" viewBox="0 0 872 210" style="display:block;margin-top:14px">
   <rect width="872" height="210" rx="24" fill="#F4F8FD"/>
   <line x1="16" x2="856" y1="52" y2="52" stroke="#F28012" stroke-width="4" stroke-dasharray="14 10"/>
   <text x="24" y="40" font-family="V" font-weight="800" font-size="30" fill="#F28012" style="direction:ltr" direction="ltr">۱۳٫۵</text>
   <path d="M20 104 L240 104 L268 102 L286 178 L300 170 L314 182 L330 174 L352 84 L372 80 L600 80 L640 100 L852 104" fill="none" stroke="#2196F3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="200" cy="104" r="14" fill="#22A050" stroke="#fff" stroke-width="5"/>
   <circle cx="314" cy="182" r="14" fill="#22A050" stroke="#fff" stroke-width="5"/>
   <circle cx="520" cy="80" r="14" fill="#F28012" stroke="#fff" stroke-width="5"/>
   <circle cx="800" cy="103" r="14" fill="#F28012" stroke="#fff" stroke-width="5"/>
  </svg>
 </div>

 <div id="brand" class="a ltr">CarDiag AI</div>
 <div id="url" class="a ltr">cardiag.ir</div>
</div></div>
</body></html>
