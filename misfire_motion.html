  sw+=`<path d="M${x+(k?70:-70)+(k?1:-1)*u*60},${-330+u*90-120*Math.sin(u*Math.PI)} q-10,18 0,26 q10,-8 0,-26 z" fill="#78CDFF" opacity="${1-u}" filter="url(#paperS)"/>`}
 $('sweat').innerHTML=sw;

 const sg=seg(lf,276,286); $('sign').setAttribute('opacity',sg>0?1:0); $('sign').setAttribute('transform',`translate(315,${lerp(-560,-300,E.oc(sg))}) rotate(${sg>0?10*Math.sin((lf-276)/4)*Math.exp(-(lf-276)/30):0})`);}

function s5(lf,q,t){             // 35.3-42.0s  yawning Mohandes; fuel cooks the catalyst into kebab; "و تمام!" he wakes
 const heat=seg(lf,45,130);
 $('cat').setAttribute('fill',heat<.5?mix('#6E7D96','#FFC446',heat*2):mix('#FFC446','#F28012',heat*2-1));

 $('drops').innerHTML=d;

 $('heat').innerHTML=h;

 $('smoke').innerHTML=s;

 let fl='';if(kb)for(let k=0;k<5;k++){const hgt=50+30*Math.abs(Math.sin(lf/3+k*1.7));fl+=`<path d="M${440+k*48},1030 q-22,-${hgt*.5} 0,-${hgt} q22,${hgt*.5} 0,${hgt} z" fill="${k%2?'#FFC446':'#F28012'}" filter="url(#paperS)"/>`}
 $('flames').innerHTML=fl;
 const wake=lf>=177, yawn=lf>=12&&lf<44;
 pose('m5',{lid:wake?0:yawn?.85:.7, mouth:wake?'o':yawn?'yawn':'flat', look:wake?[.6,-.6]:[.2,.5], armL:4, armR:-4, tilt:wake?0:-5, squash:wake?0:.35,

function sR(lf,q,t){             // 42.0-45.4s  "اما رفیق مهندس بود و نذاشت این اتفاق بیفته!"

 $('speed').innerHTML=sp;

function s6(lf,q,t){             // 45.4-54.1s  diag in 45.6 / gossip 47.6 / "کد" 49.9 / "شمع سیلندر یک" 52.1
 lf=lf-6; const plug=E.oc(seg(lf,0,18)); $('diag').style.transform=`translateY(${lerp(400,0,plug)}px) rotate(${jit(q,5,1.5)}deg)`;
 let w='';for(let k=0;k<3;k++){const r=((lf/18+k/3)%1);if(lf>22)w+=`<path d="M${60+r*240},${40+r*120} a${80+r*180},${80+r*180} 0 0 1 ${60+r*120},${-90-r*120}" stroke="#78CDFF" stroke-width="${14-r*6}" fill="none" stroke-linecap="round" opacity="${1-r}" filter="url(#paperS)"/>`}
 $('waves').innerHTML=w;

 $('scanFill').style.width=(seg(lf,48,114)*100)+'%';
 const g=lf>=60&&lf<114; $('gossip').setAttribute('opacity',g?1:0); $('gossip').setAttribute('transform',`translate(${300+jit(q,8,8)},${860+jit(q,9,6)}) rotate(${jit(q,10,6)})`);

 // the three mini suspects: injector and coil drop out, the plug lights up
 const X=[392,238,84];
 for(let i=0;i<3;i++){const inn=E.back(seg(lf,40+i*6,56+i*6));let y=lerp(2300,1460,inn),r=0;
  if(i>0){const fall=E.ic(seg(lf,200+i*8,222+i*8));y+=fall*900;r=fall*(i==1?70:-70)}
  $('ms'+i).setAttribute('transform',`translate(${X[i]},${y}) rotate(${r}) scale(.6)`);}

function s7(lf,q,t){const h=E.oc(seg(lf,100,132));   // 54.1-59.6s  "بچه مثبت" 55.8 halo / "نود و دو درصد" 57.4
 $('hclipR').setAttribute('width',720*.92*h); $('hNum').textContent=FA(Math.round(92*h))+'٪'; $('chip').setAttribute('opacity',lf>136?1:0);
 const order=[0,2,3,1]; for(let i=0;i<4;i++){const ph=(t*1.6+order[i]/4)%1; $('m7s'+i).setAttribute('opacity',lf>4&&ph<.18?1:0);}
 const u=seg(lf,0,220); setCar('c7',lerp(1350,-250,u),1630,lf,{spin:-u*2400,halo:lf>=51});

 const p=$('ePulse'),L=p.getTotalLength(),pd=E.io(seg(lf,14,34)); p.style.strokeDasharray=L; p.style.strokeDashoffset=L*(1-pd);
 [['eBrand',18],['eTag',26],['eUrl',32]].forEach(([id,a])=>{const k=seg(lf,a,a+3)>0?1:0;$(id).style.opacity=k;$(id).style.transform=`translateY(${k?0:30}px)`;});
 const cm=E.back(seg(lf,36,48)), cr=E.back(seg(lf,40,52));
 $('eM').setAttribute('transform',`translate(190,${lerp(2100,1700,cm)}) scale(.55)`); $('eR').setAttribute('transform',`translate(890,${lerp(2100,1700,cr)}) scale(.55)`);
 pose('eM_',{lid:.55,mouth:'smile',armL:4,armR:lf>70?-140:-4,squash:.25}); pose('eR_',{mouth:'smile',armL:40+30*Math.sin(lf/3),armR:-30});}

// ---------- transitions (p: 0..1 across the cut, out = outgoing sheet element) ----------
function polyClip(poly,n,M,keepPos){const out=[];const s=p=>(p[0]-M[0])*n[0]+(p[1]-M[1])*n[1];
 for(let i=0;i<poly.length;i++){const A=poly[i],B=poly[(i+1)%poly.length],sa=s(A),sb=s(B),ia=keepPos?sa>=0:sa<0,ib=keepPos?sb>=0:sb<0;
  if(ia)out.push(A); if(ia!==ib){const k=sa/(sa-sb);out.push([A[0]+(B[0]-A[0])*k,A[1]+(B[1]-A[1])*k])}}return out}
const RECT=[[0,0],[1080,0],[1080,1920],[0,1920]];
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');

function tFlip(out,p,q,fx){           // a hand lifts the bottom-left corner and peels the page away (right-to-left book)
 const C=[0,1920];
 const reach=seg(p,0,.25), peel=E.io(seg(p,.22,1));
 if(peel<=0){fx.innerHTML=HAND(C[0]-10+jit(q,1,6),C[1]+380*(1-E.oc(reach)),110);return}
 const ang=lerp(-38,-58,peel)*Math.PI/180, Lr=4600*peel;
 const P=[C[0]+Math.cos(ang)*Lr,C[1]+Math.sin(ang)*Lr];
 const dx=P[0]-C[0],dy=P[1]-C[1],len=Math.hypot(dx,dy),n=[dx/len,dy/len],M=[(C[0]+P[0])/2,(C[1]+P[1])/2];
 const keep=polyClip(RECT,n,M,true), cut=polyClip(RECT,n,M,false);
 out.style.clipPath=keep.length>2?`polygon(${keep.map(p=>p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px').join(',')})`:'polygon(0 0,0 0,0 0)';
 const flap=cut.map(p=>{const s=(p[0]-M[0])*n[0]+(p[1]-M[1])*n[1];return [p[0]-2*s*n[0],p[1]-2*s*n[1]]});
 const g=document.getElementById('flapG');g.setAttribute('x1',M[0]);g.setAttribute('y1',M[1]);g.setAttribute('x2',P[0]);g.setAttribute('y2',P[1]);
 fx.innerHTML=`<polygon points="${pts(flap)}" fill="url(#flapG)" filter="url(#lift)"/>`+HAND(P[0],P[1],lerp(110,30,peel));}

function tCrumple(out,p,q,fx){        // two hands squeeze the sheet into a ball, then toss it
 const sq=E.io(seg(p,.1,.62)), s=lerp(1,.24,sq), rot=lerp(0,-24,sq)+jit(q,3,3);
 const cx=540,cy=1000;
 if(p<.62){
  $('crD').setAttribute('scale',(70*seg(p,.08,.55)).toFixed(1));
  const a=.8*seg(p,.04,.35);
  // the outline pulls in unevenly, like paper gathering under the fingers
  const bl=[];const per=[[0,0],[1080,0],[1080,1920],[0,1920]];
  for(let e=0;e<4;e++){const A=per[e],B=per[(e+1)%4];for(let k=0;k<7;k++){const u=k/7,x=lerp(A[0],B[0],u),y=lerp(A[1],B[1],u);
   const pull=sq*(.12+.32*hash(e*7+k+.5));bl.push([lerp(x,540,pull),lerp(y,960,pull)]);}}
  out.style.clipPath=`polygon(${bl.map(p=>p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px').join(',')})`; $('crA').setAttribute('k2',1-a); $('crA').setAttribute('k3',a);
  out.style.filter='url(#crumple)'; out.style.transformOrigin=`${cx}px ${cy}px`; out.style.transform=`scale(${s}) rotate(${rot}deg)`;
  const w=540*s, reach=E.oc(seg(p,0,.12));
  fx.innerHTML=HAND(cx-w-lerp(500,0,reach),cy+40,190,1.1)+HAND(cx+w+lerp(500,0,reach),cy-30,-20,1.1);
 } else {
  out.style.display='none';
  const k=E.ic(seg(p,.66,1)), bx=lerp(cx,1400,k), by=lerp(cy,-300,k)-260*Math.sin(k*Math.PI), r=110;
  let ball='';for(let i=0;i<14;i++){const a=i/14*Math.PI*2, rr=r*(.82+.3*hash(i*3.3));ball+=`${(Math.cos(a)*rr).toFixed(1)},${(Math.sin(a)*rr).toFixed(1)} `}
  const creases=[[-60,-30,20,10],[10,-70,-20,40],[30,20,80,-10],[-40,50,30,60],[-80,10,-20,-60]].map(c=>`<line x1="${c[0]}" y1="${c[1]}" x2="${c[2]}" y2="${c[3]}" stroke="#ADD6FA" stroke-width="7" stroke-linecap="round"/>`).join('');
  fx.innerHTML=`<g transform="translate(${bx},${by}) rotate(${lerp(0,540,k)+jit(q,4,10)})"><g filter="url(#lift)"><polygon points="${ball}" fill="#FFFFFF"/>
   <polygon points="-70,-60 10,-90 30,-20 -40,0" fill="#2196F3"/><polygon points="20,30 90,10 70,70" fill="#2196F3"/><polygon points="-90,30 -30,40 -60,90" fill="#78CDFF"/>${creases}</g></g>`
   +HAND(bx+70,by-20+jit(q,5,4),lerp(-20,-50,k),1.1);}}

function tTear(out,p,q,fx){           // two hands rip the sheet down the middle
 const L=$('twL'),R=$('twR');
 [L,R].forEach(w=>{w.innerHTML='';const c=out.cloneNode(true);c.removeAttribute('id');c.style.display='block';c.style.zIndex='';w.appendChild(c);w.style.display='block';});
 out.style.display='none';
 let jag=[];for(let y=0;y<=1920;y+=60)jag.push([540+(hash(y*.37)-.5)*70,y]);
 const left=[[0,0],...jag,[0,1920]], right=[[1080,0],...jag,[1080,1920]];
 L.firstChild.style.clipPath=`polygon(${left.map(p=>p[0]+'px '+p[1]+'px').join(',')})`;
 R.firstChild.style.clipPath=`polygon(${right.map(p=>p[0]+'px '+p[1]+'px').join(',')})`;
 const edge=`<polyline points="${pts(jag)}" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" filter="url(#paperS)"/>`;
 const reach=E.oc(seg(p,0,.2)), rip=seg(p,.2,.5), fly=E.ic(seg(p,.5,1));
 const th=6*rip+18*fly, dx=900*fly;
 [[L,-1],[R,1]].forEach(([w,sd])=>{w.style.transformOrigin=`540px 1920px`;w.style.transform=`translateX(${sd*dx}px) rotate(${sd*th+jit(q,sd+5,.6)}deg)`;
  const hx=sd<0?110:970; const hand=HAND(hx+sd*lerp(420,0,reach),300,sd<0?200:-20,1.1);
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',1080);s.setAttribute('height',1920);
  s.style.cssText='position:absolute;left:0;top:0;overflow:visible';s.innerHTML=(rip>0?edge:'')+hand;
  if(rip>0)s.firstChild.style.clipPath=sd<0?`polygon(0 0,600px 0,600px 1920px,0 1920px)`:`polygon(480px 0,1080px 0,1080px 1920px,480px 1920px)`;
  w.appendChild(s);});
 fx.innerHTML='';}

function tSlide(out,p,q,fx){          // a hand grabs the left edge and drags the sheet away
 const reach=E.oc(seg(p,0,.25)), pull=E.ic(seg(p,.22,1));
 const dx=-1350*pull, r=-5*pull;
 out.style.transformOrigin='0 1920px'; out.style.transform=`translateX(${dx}px) rotate(${r}deg)`; out.style.filter='url(#lift)';
 const a=r*Math.PI/180, hx0=40, hy0=1000; const hx=dx+hx0*Math.cos(a)-(hy0-1920)*Math.sin(a), hy=1920+hx0*Math.sin(a)+(hy0-1920)*Math.cos(a);
 fx.innerHTML=HAND(hx-lerp(500,0,reach),hy,185,1.1);}

function tZoom(out,p,q,fx){          // camera pushes through the windscreen into the dashboard
 const z=E.ic(p); out.style.transformOrigin='501px 1425px'; out.style.transform=`scale(${1+16*z})`;
 out.style.opacity=p<.82?1:0; fx.innerHTML='';}
const TF={flip:tFlip,crumple:tCrumple,tear:tTear,slide:tSlide,zoom:tZoom};

// ---------- frame ----------
function render(f0){
 const q=Math.floor(f0/STEP), f=q*STEP, t=f/FPS;
 // reset sheets
 document.querySelectorAll('#stage>.sc').forEach(el=>{el.style.display='none';el.style.clipPath='';el.style.transform='';el.style.filter='';el.style.zIndex='';el.style.opacity=''});
 ['twL','twR'].forEach(id=>{$(id).style.display='none';$(id).innerHTML=''});
 $('fx').innerHTML='';
 // draw every sheet that is on screen (outgoing above incoming)
 SC.forEach((s,i)=>{const a=i?s.a-H:s.a, b=i<SC.length-1?s.b+H:s.b; if(f<a||f>=b)return;
  const el=$(s.id); el.style.display='block'; el.style.zIndex=40-i; s.fn(f-s.a,q,t);});
 // transitions
 for(let i=0;i<SC.length-1;i++){const b=SC[i].b; if(f>=b-H&&f<b+H){TF[TRN[i]]($(SC[i].id),(f-(b-H))/(2*H),q,$('fx'));}}
 // headline
 let txt='',o=0,dy=0;TT.forEach(([a,b,s])=>{if(f>=a&&f<b){txt=s;const pin=seg(f,a,a+8),pout=seg(f,b-6,b);o=pin>0&&pout<1?1:0;dy=(1-E.oc(pin))*-120}});
 const tp=$('ttlP'); if(tp.textContent!==txt)tp.textContent=txt; tp.style.opacity=o;
 tp.style.transform=`translateY(${dy}px) rotate(${-1.2+jit(q,1,.6)}deg)`;
}
window.READY=document.fonts.ready.then(()=>{render(0);return true});
