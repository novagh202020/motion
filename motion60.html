<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>CarDiag App Tour</title>
<style>
@font-face{font-family:V;font-weight:500;src:url(fonts/Vazirmatn-FD-Medium.ttf)}
@font-face{font-family:V;font-weight:400;src:url(fonts/Vazirmatn-FD-Regular.ttf)}
@font-face{font-family:V;font-weight:700;src:url(fonts/Vazirmatn-FD-Bold.ttf)}
@font-face{font-family:V;font-weight:800;src:url(fonts/Vazirmatn-FD-ExtraBold.ttf)}
@font-face{font-family:V;font-weight:900;src:url(fonts/Vazirmatn-FD-Black.ttf)}
:root{
 --blue:#2196F3;--deep:#1565C0;--glow:#78CDFF;--bloom:#28A0FF;--soft:#ADD6FA;
 --navy:#10203C;--slate:#6E7D96;--url:#506482;
 --amberL:#FFC446;--amber:#F28012;--red:#DC3232;--redT:#FFECEC;
 --green:#22A050;--greenT:#DEF6E6;--ink:#4B3005;
 --card:#FFFFFF;--hair:#DEE6F2;--track:#E6EBF2;--device:#181C24;--edge:#5F6878;
 --appbg:#EEF2F8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#FBFCFF}
body{font-family:V,sans-serif;color:var(--navy)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;
 background:linear-gradient(180deg,#FBFCFF 0%,#ECF3FC 100%)}
.abs{position:absolute}
.ltr{direction:ltr;unicode-bidi:isolate}
.rtl{direction:rtl}

/* ---------- titles ---------- */
#titles{position:absolute;left:0;top:0;width:1080px;height:400px;z-index:50;pointer-events:none}
.ttl{position:absolute;left:0;width:1080px;text-align:center;direction:rtl;opacity:0}
.ttl .h{font-weight:900;font-size:84px;line-height:1.15;color:var(--navy);white-space:nowrap;display:inline-block}
.ttl .s{font-weight:500;font-size:42px;color:var(--slate);margin-top:10px;white-space:nowrap}
.ttl .h b{color:var(--blue);font-weight:900}

/* ---------- device ---------- */
#phone{position:absolute;left:240px;top:390px;width:600px;height:1290px;border-radius:78px;
 background:var(--device);border:3px solid var(--edge);transform-origin:50% 0;
 box-shadow:0 50px 90px rgba(20,40,80,.28),0 12px 26px rgba(20,40,80,.18);z-index:10}
#screen{position:absolute;left:11px;top:11px;width:572px;height:1262px;border-radius:66px;overflow:hidden;clip-path:inset(0 round 66px);isolation:isolate;background:var(--appbg)}
#notch{position:absolute;left:50%;top:14px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#0b0e13;z-index:30}
.scr{position:absolute;left:0;top:0;width:572px;height:1262px;background:var(--appbg);direction:rtl;overflow:hidden;font-family:V}
.sbar{height:48px;display:flex;justify-content:space-between;align-items:center;padding:6px 40px 0;font-weight:700;font-size:19px;direction:ltr}
.appbar{background:var(--blue);color:#fff}
.appbar .sbar{color:#fff}
.abar{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;direction:rtl}
.abar .t{font-weight:800;font-size:29px;display:flex;align-items:center;gap:14px}
.abar .help{font-weight:500;font-size:19px;display:flex;align-items:center;gap:6px;opacity:.95}
.tabs{height:62px;display:flex;background:#F7F8FC;direction:rtl}
.tabs div{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#98A3B8;position:relative}
.tabs div.on{color:var(--blue)}
.tabs div.on:after{content:"";position:absolute;bottom:0;width:90px;height:4px;border-radius:3px;background:var(--blue)}
.card{background:#fff;border:2px solid var(--hair);border-radius:24px;margin:14px 18px;padding:18px 20px;box-shadow:0 6px 16px rgba(20,40,80,.05)}
.btn{height:62px;border-radius:31px;background:var(--blue);color:#fff;font-weight:700;font-size:23px;display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 18px;position:relative;overflow:hidden}
.btn.o{background:#fff;border:2px solid var(--hair);color:var(--slate)}
.nav{position:absolute;left:0;bottom:0;width:572px;height:96px;background:var(--blue);display:flex;direction:rtl;padding-bottom:6px}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:500;font-size:17px;gap:4px}
.nav .home svg{background:rgba(255,255,255,.28);border-radius:16px;padding:3px 18px;width:68px;height:34px}
.lbl{font-weight:500;font-size:18px;color:var(--slate)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;transform:translate(-50%,-50%);width:0;height:0}
.tapdot{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:5px solid rgba(33,150,243,.9);background:rgba(33,150,243,.15);opacity:0;z-index:40}

/* ---------- floating cards ---------- */
.fc{position:absolute;left:110px;top:1430px;width:860px;background:#fff;border:3px solid var(--hair);border-radius:40px;
 box-shadow:0 30px 60px rgba(20,40,80,.20),0 8px 18px rgba(20,40,80,.10);direction:rtl;padding:30px 40px;opacity:0;z-index:20;transform-origin:50% 100%}
.fc .ct{font-weight:800;font-size:50px;color:var(--navy);line-height:1.2}
.fc .sub{font-weight:500;font-size:38px;color:var(--slate);line-height:1.3}
.chip{display:inline-flex;align-items:center;gap:10px;height:66px;padding:0 26px;border-radius:33px;background:var(--greenT);color:var(--green);font-weight:700;font-size:40px;white-space:nowrap}
.chip.red{background:var(--redT);color:var(--red)}
.big{font-weight:900;font-size:70px;line-height:1}

/* ---------- misc ---------- */
.icsq{width:84px;height:84px;border-radius:24px;background:#E3EFFC;display:flex;align-items:center;justify-content:center}
.tile{position:absolute;width:400px;height:200px;background:#fff;border:3px solid var(--hair);border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
 box-shadow:0 18px 36px rgba(20,40,80,.12);direction:rtl;opacity:0;z-index:15}
.tile .tl{font-weight:700;font-size:36px;color:var(--navy);white-space:nowrap}
.ex{position:absolute;left:90px;top:1376px;width:900px;background:#fff;border:3px solid var(--hair);border-radius:40px;
 box-shadow:0 30px 60px rgba(20,40,80,.20),0 8px 18px rgba(20,40,80,.10);direction:rtl;padding:22px 40px;opacity:0;z-index:21;transform-origin:50% 100%}
.exr{display:flex;align-items:center;gap:28px;height:108px;font-weight:800;font-size:48px;color:var(--navy);white-space:nowrap}
.exr+.exr{border-top:2px solid #EEF2F8}
.exn{width:74px;height:74px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;font-size:42px;display:flex;align-items:center;justify-content:center;flex:none}
.goldp{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;background:linear-gradient(90deg,#F6CD5C,#FFEA9C,#E0A82C);color:var(--ink);font-weight:800;font-size:17px;white-space:nowrap}
.tile.t3{width:300px;height:216px;gap:18px;border-radius:34px}
.tile.t3 .tl{font-size:30px}
#gold{position:absolute;left:50%;top:1250px;height:104px;padding:0 54px;border-radius:52px;transform:translateX(-50%);
 background:linear-gradient(90deg,#F6CD5C 0%,#FFEA9C 50%,#E0A82C 100%);color:var(--ink);font-weight:800;font-size:52px;
 display:flex;align-items:center;gap:18px;white-space:nowrap;direction:rtl;box-shadow:0 18px 40px rgba(20,40,80,.18);opacity:0}

/* ================= timeline ================= */
// music grid: bar = 67.5 frames, beat = 16.875; motion bar m downbeat = 7.5+67.5m (= song bar m+1, song/song_full.wav)
// each section = 2 bars: bar 1 the app screen, bar 2 "what it does" (3 lines on the beats)
const F_FEAT=210, DUR=135, HALF=67.5, BEAT=16.875, N=10;
const fs=k=>F_FEAT+DUR*k;          // feature start frame
const T_RECAP=fs(N), T_END=T_RECAP+135;           // 1560 (bar 23) / 1695 (bar 25, outro)

function gaugeSvg(id,max,unit,ticks){
 const cx=110,cy=110,r=92;
 let t='';for(let i=0;i<=10;i++){const a=(225-27*i)*Math.PI/180;const r1=r-14,r2=r-(i%5==0?28:22);
  t+=`<line x1="${cx+r1*Math.cos(a)}" y1="${cy-r1*Math.sin(a)}" x2="${cx+r2*Math.cos(a)}" y2="${cy-r2*Math.sin(a)}" stroke="#B9C4D6" stroke-width="${i%5==0?3:2}"/>`}
 const lab=ticks.map((v,i)=>{const a=(225-135*i)*Math.PI/180;const rr=r-48;return `<text x="${cx+rr*Math.cos(a)}" y="${cy-rr*Math.sin(a)+5}" text-anchor="middle" font-size="15" fill="#98A3B8" font-family="V">${fa(v)}</text>`}).join('');
 return `<svg width="220" height="200" viewBox="0 0 220 200">
  <path d="${arc(cx,cy,r,225,-45)}" fill="none" stroke="#E6EBF2" stroke-width="16" stroke-linecap="round"/>
  <path id="${id}_a" d="" fill="none" stroke="#2196F3" stroke-width="16" stroke-linecap="round"/>
  ${t}${lab}
  <g id="${id}_n" transform="rotate(0 ${cx} ${cy})"><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-72}" stroke="#10203C" stroke-width="5" stroke-linecap="round"/></g>
  <circle cx="${cx}" cy="${cy}" r="12" fill="#10203C"/>
  <text id="${id}_t" x="${cx}" y="${cy+52}" text-anchor="middle" font-size="30" font-weight="900" fill="#10203C" font-family="V">۰</text>
  <text x="${cx}" y="${cy+74}" text-anchor="middle" font-size="15" fill="#98A3B8" font-family="V">${unit}</text></svg>`;
}
function arc(cx,cy,r,a0,a1){ // degrees, math orientation, a0>a1 clockwise
 if(Math.abs(a0-a1)<0.01)a1=a0-0.01;
 const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)];
 const [x0,y0]=p(a0),[x1,y1]=p(a1);const large=(a0-a1)>180?1:0;
 return `M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
}

/* ================= screen state ================= */
const SCR=['sc_home',...FEATS.map((_,k)=>'sc_f'+k)];
function showScreens(f){
 // which screen index and transition
 let x={}; SCR.forEach(s=>x[s]=null);
 const T=7; // half-transition frames
 if(f<F_FEAT-T){x.sc_home=0;}
 else{
  // boundaries: home->f0 at F_FEAT, fk->fk+1 at fs(k+1)
  const bounds=[F_FEAT,...FEATS.slice(1).map((_,k)=>fs(k+1))];
  let shown=false;
  for(let i=0;i<bounds.length;i++){const b=bounds[i];
   if(f>=b-T&&f<b+T){const p=E.io(seg(f,b-T,b+T));x[SCR[i]]=p*572;x[SCR[i+1]]=(p-1)*572;shown=true;break;}}
  if(!shown){let idx=0;for(let i=0;i<bounds.length;i++)if(f>=bounds[i])idx=i+1;x[SCR[idx]]=0;}
 }
 SCR.forEach(s=>{const el=$(s);if(x[s]===null){el.style.display='none'}else{el.style.display='block';el.style.transform=`translateX(${x[s]}px)`}});
}
function tapEl(f,a,id){ const t=f-a; if(t<-4||t>14) return false;
 const r=$(id).getBoundingClientRect(), sc=$('screen').getBoundingClientRect(), k=sc.width/572;
 return tap(f,a,(r.left+r.width/2-sc.left)/k,(r.top+r.height/2-sc.top)/k);
}
function tap(f,a,xp,yp){ // tap indicator in screen coords at frame a
 const t=f-a; if(t<-4||t>14) return false;
 const el=$('tap'); el.style.left=(11+xp)+'px'; el.style.top=(11+yp)+'px';
 const o=t<0?seg(t,-4,0):1-seg(t,4,14); const s=t<0?1.2-0.2*seg(t,-4,0):1+0.6*seg(t,0,14);
 el.style.opacity=o; el.style.transform=`scale(${s})`; return true;
}

  } else {el.style.display='none'}

  const st=T_RECAP+4+k*BEAT/2; const p=seg(f,st-2,st+12); const out=seg(f,T_END-8,T_END+4);

function arcD(cx,cy,r,a0,a1){ // screen-angle degrees (0=right, 90=down)
 const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
 const [x0,y0]=p(a0),[x1,y1]=p(a1);
 return `M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}`;
}

 // 7 Service
 (t,tapAt)=>{
  const p=E.oc(seg(t,10,34))*80; $('sv_bar').style.width=p+'%'; $('fc7bar').style.width=p+'%';
  const ring=t>=30&&t<52? Math.sin((t-30)*1.3)*14*(1-seg(t,30,52)) : 0;
  $('fc7bell').style.transform=`rotate(${ring}deg)`;
 },
 // 8 Health trend: the line is drawn scan by scan, the number climbs with it
 (t,tapAt)=>{
  const L=E.io(seg(t,6,44))*(HT.length-1); const i0=Math.min(HT.length-2,Math.floor(L)), fr=L-i0;
  const pts=HT.slice(0,i0+1).map((p,i)=>[HTX(i),HTY(p[0])]);
  const v=lerp(HT[i0][0],HT[i0+1][0],fr); pts.push([lerp(HTX(i0),HTX(i0+1),fr),HTY(v)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  $('ht_line').setAttribute('d',t<6?'':d); $('ht_area').setAttribute('d',t<6?'':d+` L${pts[pts.length-1][0]} 236 L${HTX(0)} 236 Z`);
  HT.forEach((p,i)=>{const q=seg(L,i-0.05,i+0.25); const g=$('ht_d'+i); g.setAttribute('opacity',t<6?0:E.oc(q));
   g.setAttribute('transform',`translate(${HTX(i)} ${HTY(p[0])}) scale(${q<=0?0.3:lerp(0.3,1,E.back(q))})`);});
  const vv=Math.round(t<6?68:v); const now=$('ht_now'); now.textContent=fa(vv)+'٪'; now.style.color=hcol(vv);
  const fv=$('fc8v'); fv.textContent=fa(vv)+'٪'; fv.style.color=hcol(vv);
  const c=E.back(seg(t,44,54)); $('ht_chip').style.opacity=E.oc(seg(t,44,50)); $('ht_chip').style.transform=`scale(${lerp(0.7,1,c)})`;
  $('fc8c').style.opacity=E.oc(seg(t,44,50)); $('fc8c').style.transform=`scale(${lerp(0.7,1,c)})`;
  [0,1,2].forEach(i=>{const p=E.oc(seg(t,20+i*6,30+i*6)); const s=$('ht_s'+i); s.style.opacity=p; s.style.transform=`translateY(${(1-p)*20}px)`;});
 },
 // 9 Pre-purchase check: question, typing, verdict line by line
 (t,tapAt)=>{
  const g=E.back(seg(t,2,12)); $('by_gold').style.opacity=E.oc(seg(t,2,7)); $('by_gold').style.transform=`scale(${lerp(0.7,1,g)})`;
  const u=E.oc(seg(t,4,12)); $('by_u').style.opacity=u; $('by_u').style.transform=`translateY(${(1-u)*24}px)`;
  const b=E.oc(seg(t,12,18)); $('by_b').style.opacity=b; $('by_b').style.transform=`translateY(${(1-b)*24}px)`;
  const typing=t<26; $('by_dots').style.display=typing?'block':'none';
  [0,1,2].forEach(i=>{$('by_k'+i).style.opacity=0.3+0.7*(0.5+0.5*Math.sin(t*0.5-i*1.2));});
  [0,1,2,3,4].forEach(i=>{const r=$('by_r'+i); const a=26+i*7; const p=E.oc(seg(t,a,a+7));
   r.style.display=t<a-1?'none':(i==0?'flex':(i==1||i==4?'flex':'block')); r.style.opacity=p; r.style.transform=`translateY(${(1-p)*16}px)`;});
  $('by_sb').style.width=(E.oc(seg(t,33,48))*68)+'%';
  const c=E.back(seg(t,26,36)); $('fc9c').style.opacity=E.oc(seg(t,26,32)); $('fc9c').style.transform=`scale(${lerp(0.7,1,c)})`;
 },
];

window.READY=document.fonts.ready.then(()=>{fitTitles();render(0);return true});
const q=new URLSearchParams(location.search); if(q.has('f')) window.READY.then(()=>render(+q.get('f')));
</script>
